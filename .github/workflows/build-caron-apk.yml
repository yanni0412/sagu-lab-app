name: Build CarOn APK

on:
  push:
    paths:
      - 'caron/**'
      - 'caron-app/package.json'
      - 'caron-app/package-lock.json'
      - 'caron-app/capacitor.config.ts'
      - 'caron-app/android/**'
      - '.github/workflows/build-caron-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caron-app
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm 의존성 설치
        run: npm ci

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-caron-${{ runner.os }}-${{ hashFiles('caron-app/android/**/*.gradle*') }}

      - name: 웹 자산(caron/)을 android 프로젝트로 동기화
        run: npx cap sync android

      - name: 디버그 APK 빌드
        working-directory: caron-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: caron-debug-apk
          path: caron-app/android/app/build/outputs/apk/debug/app-debug.apk
