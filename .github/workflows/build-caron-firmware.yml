name: Build CarOn Firmware

on:
  push:
    paths:
      - 'caron-app/firmware/**'
      - '.github/workflows/build-caron-firmware.yml'
  workflow_dispatch: {}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: ESP32 펌웨어 컴파일 검사
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - caron-app/firmware/caron_esp32
