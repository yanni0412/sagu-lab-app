<!doctype html>
<html
  lang="ko"
  data-composition-variables='[{"id":"cloth","type":"color","label":"Ground","default":"#0b3a2f"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b3a2f;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, #11523f 0%, var(--cloth, #0b3a2f) 55%, #062219 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground" class="clip" data-start="0" data-duration="21" data-track-index="0"></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="replay"
        data-composition-id="replay"
        data-composition-src="compositions/replay.html"
        data-start="3.5"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="features"
        data-composition-id="features"
        data-composition-src="compositions/features.html"
        data-start="11.5"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-variable-values='{"cta":"Google Play에서 만나요"}'
        data-start="17.5"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
