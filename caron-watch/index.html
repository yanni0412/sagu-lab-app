<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>카온 워치</title>
<style>
:root{ --amber:#f2a33a; --good:#4fd18b; --bad:#ff6b5e; --ink:#eef1f4; --ink2:#9aa3af; --surf:#23262b; --surf2:#2d3137; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
html,body{height:100%; margin:0}
body{background:#000; color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; overflow:hidden}
/* 둥근 화면: 콘텐츠를 가운데 원 안으로 */
#screen{height:100%; overflow-y:auto; scrollbar-width:none; text-align:center;
  padding:calc(14% ) 10% calc(16%); scroll-snap-type:y proximity}
#screen::-webkit-scrollbar{display:none}
.hdr{display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:10px}
.state{font-size:26px; font-weight:800; letter-spacing:-.02em}
.state.lock{color:var(--good)} .state.open{color:var(--amber)} .state.off{color:var(--ink2)}
.sub{font-size:12px; color:var(--ink2)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--bad); margin-top:2px}
.dot.on{background:var(--good)}
.btns{display:flex; flex-direction:column; gap:9px; align-items:center}
.k{position:relative; width:100%; max-width:230px; min-height:62px; border:0; border-radius:34px; overflow:hidden;
  background:var(--surf); color:var(--ink); font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px;
  scroll-snap-align:center}
.k:active{background:var(--surf2)}
.k svg{width:24px; height:24px}
.k.primary{background:var(--amber); color:#1d1406}
.k.wide{border-radius:34px}
.k.start{background:#30343a}
.k.start.running{background:var(--amber); color:#1d1406}
.k .hold{position:absolute; left:0; bottom:0; height:4px; width:calc(var(--p,0)*100%); background:#1d1406; opacity:.5}
.k:disabled{opacity:.4}
.mini{font-size:12px; color:var(--ink2); margin-top:8px}
/* 토스트 */
#toast{position:fixed; left:50%; bottom:6%; transform:translateX(-50%); max-width:84%; background:#f1f3f5; color:#111;
  padding:8px 14px; border-radius:16px; font-size:13px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; text-align:center}
#toast.bad{background:var(--bad); color:#fff}
#toast.show{opacity:1}
/* 시트(스캔/비번) */
#sheet{position:fixed; inset:0; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12%}
#sheet.show{display:flex}
#sheet h4{margin:0; font-size:18px}
#sheet p{margin:0; font-size:12px; color:var(--ink2); text-align:center}
.pwd{display:flex; gap:6px; margin:6px 0}
.pwd button{width:34px; height:46px; border:0; border-radius:10px; background:var(--surf); color:var(--ink); font-size:20px; font-weight:800}
.row2{display:flex; gap:8px}
.sbtn{border:0; border-radius:24px; padding:11px 18px; font-weight:700; font-size:15px; background:var(--surf); color:var(--ink)}
.sbtn.primary{background:var(--amber); color:#1d1406}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div id="screen"></div>
<div id="toast"></div>
<div id="sheet"></div>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hexToBytes = h => Uint8Array.from((h.match(/../g) || []), b => parseInt(b, 16));
const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
async function hmac(keyHex, bytes, len = 16){
  const key = await crypto.subtle.importKey("raw", hexToBytes(keyHex), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, Uint8Array.from(bytes))).slice(0, len);
}

/* ---- 저장 ---- */
const KEY = "caronwatch.v1", DEMO_KEY = "c0ffee00c0ffee00c0ffee00c0ffee00";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!S) S = {kind:"demo", name:"내 차", pwd:"000000", keyHex:DEMO_KEY, bleId:null, bleName:null, locked:true, engine:false, online:false};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ---- 프로토콜 (phone 앱과 동일) ---- */
const UUID = {SVC:"ca700001-5e1f-4b2a-8c3d-7a9e0b1c2d30", CMD:"ca700002-5e1f-4b2a-8c3d-7a9e0b1c2d30", EVT:"ca700003-5e1f-4b2a-8c3d-7a9e0b1c2d30"};
const MP_UUID = {SVC:"0000ffe0-0000-1000-8000-00805f9b34fb", CMD:"0000ffe4-0000-1000-8000-00805f9b34fb", EVT:"0000ffe9-0000-1000-8000-00805f9b34fb"};
const curU = () => S.kind === "mp686" ? MP_UUID : UUID;
const OP = {check:0x00, unlock:0x10, lock:0x11, trunk:0x12, find:0x13, start:0x14, stop:0x15};
const ERR = {1:"보안 키가 맞지 않아요", 3:"다시 시도하세요", 5:"기기 오류", 6:"잠시 차단됨", 7:"보닛 열림", 8:"브레이크 밟힘", 9:"이미 시동", 10:"시동 실패"};
const MP_CMD = {lock:0xC1, unlock:0xC2, trunk:0xC3, find:0xC4, start:0xC5, stop:0xC6};
const MP_WARN = {0xE1:"문 열림", 0xE2:"트렁크 열림", 0xE3:"충격 감지", 0xE4:"시동 경보"};
const mpSum = a => { let s = 0; for (const x of a) s = (s + x) & 0xFF; return s; };
const mpFrame = a => { const d = [...a]; d.push(mpSum(d)); return d; };
const mpLoginPkt = pwd => { const d = [0xCD, 0x0A, 0]; for (let i = 0; i < 6; i++) d.push(i < pwd.length ? pwd.charCodeAt(i) & 0xFF : 0); return mpFrame(d); };

const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const NativeBle = {
  subs:{}, _ready:null,
  get p(){ return this._p || (this._p = window.Capacitor.registerPlugin("BluetoothLe")); },
  supported:true,
  init(){ return this._ready || (this._ready = this.p.initialize({}).catch(e => { this._ready = null; throw e; })); },
  async pick(){ await this.init(); const d = await this.p.requestDevice({services:[curU().SVC]}); return {id:d.deviceId, name:d.name}; },
  async connect(id, onDisc){ await this.init(); if (this.subs.d) await this.subs.d.remove(); this.subs.d = await this.p.addListener(`disconnected|${id}`, onDisc); await this.p.connect({deviceId:id, timeout:8000}); },
  async notify(id, cb){ if (this.subs.n) await this.subs.n.remove(); this.subs.n = await this.p.addListener(`notification|${id}|${curU().SVC}|${curU().EVT}`, e => cb(hexToBytes(((e && e.value) || "").replace(/[^0-9a-f]/gi, "")))); await this.p.startNotifications({deviceId:id, service:curU().SVC, characteristic:curU().EVT}); },
  write(id, bytes){ return this.p.write({deviceId:id, service:curU().SVC, characteristic:curU().CMD, value:bytesToHex(bytes)}); },
  disconnect(id){ return this.p.disconnect({deviceId:id}).catch(() => {}); },
};
const WebBle = {
  devs:new Map(), ch:null,
  get supported(){ return !!navigator.bluetooth; },
  async pick(){ const d = await navigator.bluetooth.requestDevice({filters:[{services:[curU().SVC]}]}); this.devs.set(d.id, d); return {id:d.id, name:d.name}; },
  async connect(id, onDisc){ let d = this.devs.get(id); if (!d && navigator.bluetooth.getDevices) d = (await navigator.bluetooth.getDevices()).find(x => x.id === id); if (!d) { d = await navigator.bluetooth.requestDevice({filters:[{services:[curU().SVC]}]}); this.devs.set(id, d); } d.ongattserverdisconnected = onDisc; const svc = await (await d.gatt.connect()).getPrimaryService(curU().SVC); this.ch = {d, cmd:await svc.getCharacteristic(curU().CMD), evt:await svc.getCharacteristic(curU().EVT)}; },
  async notify(id, cb){ this.ch.evt.oncharacteristicvaluechanged = e => { const v = e.target.value; cb(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength))); }; await this.ch.evt.startNotifications(); },
  write(id, bytes){ const c = this.ch.cmd; return (c.writeValueWithResponse || c.writeValue).call(c, Uint8Array.from(bytes)); },
  async disconnect(){ if (this.ch && this.ch.d.gatt.connected) this.ch.d.gatt.disconnect(); },
};
const DemoCar = {
  supported:true, cb:null, nonce:null, timers:{},
  async pick(){ return {id:"demo", name:"데모 차량"}; },
  async connect(){ await sleep(300); },
  async notify(id, cb){ this.cb = cb; },
  async disconnect(){ this.cb = null; },
  emit(b){ setTimeout(() => this.cb && this.cb(Uint8Array.from(b)), 30); },
  state(){ this.emit([0xA0, +S.locked, +S.engine, 0, 0, 126, 0, 10]); },
  async write(id, b){
    await sleep(140);
    if (b.length === 1 && b[0] === 1) { this.nonce = crypto.getRandomValues(new Uint8Array(8)); return this.emit([0x81, ...this.nonce]); }
    if (b.length === 1 && b[0] === 2) return this.state();
    const op = b[0], res = c => this.emit([0x90, op, c]);
    if (!this.nonce) return res(3); const mac = await hmac(DEMO_KEY, [...this.nonce, op, b[1]]); this.nonce = null;
    if (mac.some((x, i) => x !== b[2 + i])) return res(1);
    if (op === 0x10) S.locked = false; else if (op === 0x11) S.locked = true;
    else if (op === 0x14) S.engine = true; else if (op === 0x15) S.engine = false;
    res(0); this.state();
  },
};

const Link = {
  live:false, waiters:[],
  t(){ return S.kind === "demo" ? DemoCar : (isNative ? NativeBle : WebBle); },
  id(){ return S.kind === "demo" ? "demo" : S.bleId; },
  async connect(){
    if (this.live) return;
    const t = this.t(), id = this.id();
    await t.connect(id, () => { this.live = false; S.online = false; paint(); });
    await t.notify(id, b => this.rx(b));
    this.live = true;
    if (S.kind === "mp686") { try { await this.mpLogin(); } catch (e) { this.live = false; await t.disconnect(id).catch(() => {}); throw e; } }
    else { S.online = true; await t.write(id, [0x02]); }
    paint();
  },
  async disconnect(){ this.live = false; await this.t().disconnect(this.id()).catch(() => {}); S.online = false; paint(); },
  expect(match, ms = 6000){ return new Promise((res, rej) => { const w = {match, res, timer:setTimeout(() => { this.waiters = this.waiters.filter(x => x !== w); rej(new Error("응답 없음")); }, ms)}; this.waiters.push(w); }); },
  rx(b){
    if (!b.length) return;
    const w = this.waiters.find(x => x.match(b));
    if (w) { clearTimeout(w.timer); this.waiters = this.waiters.filter(x => x !== w); w.res(b); }
    if (S.kind === "mp686") return this.mpRx(b);
    if (b[0] === 0xA0 && b.length >= 3) { S.locked = !!b[1]; S.engine = !!b[2]; S.online = true; save(); paint(); }
    if (b[0] === 0xB0 && b.length >= 3) { if (b[1] === 1) S.locked = false; else if (b[1] === 2) S.locked = true; else if (b[1] === 3) toast("경보!", true); else if (b[1] === 5) S.engine = false; save(); paint(); }
  },
  mpRx(b){
    if (b[0] !== 0xCD || b.length < 3) return;
    if (b[1] === 0x0D && b[3] === 0) { const c = b[2]; if (c === 0xC1) S.locked = true; else if (c === 0xC2) S.locked = false; else if (c === 0xC5) S.engine = true; else if (c === 0xC6) S.engine = false; }
    else if (b[1] === 0x0E) toast("경보: " + (MP_WARN[b[2]] || "경보"), true);
    else if (b[1] === 0xA1) S.engine = b[2] !== 0;
    S.online = true; save(); paint();
  },
  async mpLogin(){
    const w = this.expect(b => b[0] === 0xCD && b[1] === 0x0A, 5000);
    await this.t().write(this.id(), mpLoginPkt(S.pwd || "000000"));
    const r = await w; if (r[2] !== 0) throw new Error("비밀번호가 맞지 않아요");
    S.online = true; if (r.length >= 4) S.locked = r[3] === 0xA1 ? true : r[3] === 0xA2 ? false : S.locked;
  },
  async mpControl(cmd){
    const code = MP_CMD[cmd]; await this.connect();
    const w = this.expect(b => b[0] === 0xCD && b[1] === 0x0D && b[2] === code, cmd === "start" ? 12000 : 6000);
    await this.t().write(this.id(), mpFrame([0xCD, 0x0D, code]));
    const r = await w; if (r[3] !== 0) throw new Error("명령 거부됨"); return r;
  },
  async auth(op){
    await this.connect();
    const nP = this.expect(b => b[0] === 0x81);
    await this.t().write(this.id(), [0x01]);
    const nonce = (await nP).slice(1, 9);
    const mac = await hmac(S.keyHex, [...nonce, op, 0]);
    const rP = this.expect(b => b[0] === 0x90, op === OP.start ? 12000 : 6000);
    await this.t().write(this.id(), [op, 0, ...mac]);
    const r = await rP; if (r[2] !== 0) throw new Error(ERR[r[2]] || "기기 오류"); return r;
  },
  send(cmd){ return S.kind === "mp686" ? this.mpControl(cmd) : this.auth(OP[cmd]); },
};

/* ---- 동작 ---- */
let busy = "";
const LABEL = {lock:"잠금", unlock:"열기", trunk:"트렁크", find:"찾기", start:"시동", stop:"시동 끄기"};
async function act(cmd){
  if (busy) return;
  busy = cmd; paint();
  try { await Link.send(cmd); toast(LABEL[cmd] + " 완료"); vib(30); }
  catch (e) { toast((LABEL[cmd] || "") + " 실패: " + (e.message || e), true); }
  finally { busy = ""; save(); paint(); }
}
async function connectNow(manual){
  if (busy) return false;
  busy = "connect"; paint();
  try { await Link.connect(); if (manual) toast("연결됨"); return true; }
  catch (e) { if (manual) toast("연결 실패: " + (e.name === "NotFoundError" ? "취소" : (e.message || e)), true); return false; }
  finally { busy = ""; paint(); }
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* ---- 토스트 ---- */
let toastT = null;
function toast(msg, bad){ const el = $("#toast"); el.textContent = msg; el.className = (bad ? "bad " : "") + "show"; clearTimeout(toastT); toastT = setTimeout(() => el.className = el.className.replace("show", "").trim(), 2200); }

/* ---- 화면 ---- */
const SVG = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V6.5a4 4 0 0 1 7.8-1.2"/></svg>',
  trunk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h3l2.5 5H21v4H5.5L3 14"/><path d="M8.5 14 15 6.5l4.5 1.5"/></svg>',
  find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 7a7 7 0 0 1 0 10"/></svg>',
  engine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>',
};
function paint(){
  const on = S.online, off = !on;
  const stateCls = off ? "off" : S.locked ? "lock" : "open";
  const stateTxt = busy === "connect" ? "연결 중…" : off ? "연결 안 됨" : S.locked ? "잠김" : "열림";
  const dis = off || !!busy;
  const b = (cmd, cls, label, hold) => `<button class="k ${cls}" data-cmd="${cmd}" ${hold ? `data-hold="${hold}"` : ""} ${dis ? "disabled" : ""}>${SVG[cmd] || ""}${label}${hold ? '<span class="hold"></span>' : ""}</button>`;
  $("#screen").innerHTML = `
    <div class="hdr">
      <div class="state ${stateCls}">${stateTxt}</div>
      <div class="sub">${esc(S.name)}${S.kind === "mp686" ? " · 크라운" : S.kind === "demo" ? " · 데모" : ""}</div>
      <div class="dot ${on ? "on" : ""}"></div>
    </div>
    <div class="btns">
      ${off
        ? `<button class="k primary" data-act="connect">${SVG.unlock}연결</button>`
        : S.locked
          ? b("unlock", "primary", "열기")
          : b("lock", "primary", "잠그기")}
      ${!off ? b("trunk", "", "트렁크", 700) : ""}
      ${!off ? `<button class="k start ${S.engine ? "running" : ""}" data-cmd="${S.engine ? "stop" : "start"}" ${S.engine ? "" : 'data-hold="1100"'} ${dis ? "disabled" : ""}>${SVG.engine}${S.engine ? "시동 끄기" : "시동"}${S.engine ? "" : '<span class="hold"></span>'}</button>` : ""}
      ${!off ? b("find", "", "찾기") : ""}
      <button class="k" data-act="setup" style="background:transparent; min-height:44px; color:var(--ink2)">${SVG.gear}기기 설정</button>
    </div>
    <div class="mini">${off ? "차 가까이에서 연결하세요" : "트렁크·시동은 길게 누르기"}</div>`;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* 길게 누르기 */
let hold = null;
$("#screen").addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-hold]"); if (!b || b.disabled) return;
  b.setPointerCapture(e.pointerId);
  const ms = +b.dataset.hold, t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms); b.style.setProperty("--p", p); if (p >= 1) { hold = null; b.style.setProperty("--p", 0); vib(30); act(b.dataset.cmd); } else hold = {raf:requestAnimationFrame(step), b}; };
  hold = {raf:requestAnimationFrame(step), b};
});
const cancelHold = () => { if (!hold) return; cancelAnimationFrame(hold.raf); hold.b.style.setProperty("--p", 0); const c = hold.b.dataset.cmd; hold = null; if (c === "trunk" || c === "start") toast("길게 누르세요"); };
$("#screen").addEventListener("pointerup", cancelHold);
$("#screen").addEventListener("pointercancel", () => { if (hold) { cancelAnimationFrame(hold.raf); hold.b.style.setProperty("--p", 0); hold = null; } });

$("#screen").addEventListener("click", e => {
  const k = e.target.closest("[data-cmd]"); if (k) { if (k.dataset.hold) return; return act(k.dataset.cmd); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "connect") connectNow(true);
  else if (a.dataset.act === "setup") setupSheet();
});

/* ---- 기기 설정(스캔/비번) ---- */
function setupSheet(){
  const sh = $("#sheet");
  sh.innerHTML = `<h4>기기 설정</h4>
    <p>차 가까이에서 선택하세요</p>
    <button class="sbtn primary" id="sMp">크라운 호환(MP686)</button>
    <button class="sbtn" id="sEsp">카온 기기(ESP32)</button>
    <button class="sbtn" id="sDemo">데모</button>
    <button class="sbtn" id="sClose" style="background:transparent; color:var(--ink2)">닫기</button>`;
  sh.classList.add("show");
  $("#sClose").onclick = () => sh.classList.remove("show");
  $("#sDemo").onclick = async () => { await Link.disconnect().catch(() => {}); Object.assign(S, {kind:"demo", keyHex:DEMO_KEY, bleId:null, online:false, locked:true, engine:false}); save(); sh.classList.remove("show"); paint(); connectNow(false); };
  $("#sEsp").onclick = () => espSheet();
  $("#sMp").onclick = () => mpSheet();
}
function mpSheet(){
  const sh = $("#sheet");
  let pwd = (S.pwd || "000000").padEnd(6, "0").slice(0, 6).split("").map(Number);
  const render = () => { sh.innerHTML = `<h4>크라운 비밀번호</h4>
    <div class="pwd">${pwd.map((d, i) => `<button data-i="${i}">${d}</button>`).join("")}</div>
    <p>숫자를 눌러 올리기 · 기본 000000</p>
    <div class="row2"><button class="sbtn" id="mCancel">취소</button><button class="sbtn primary" id="mGo">연결</button></div>`;
    sh.querySelectorAll(".pwd button").forEach(btn => btn.onclick = () => { const i = +btn.dataset.i; pwd[i] = (pwd[i] + 1) % 10; render(); });
    $("#mCancel").onclick = () => sh.classList.remove("show");
    $("#mGo").onclick = async () => {
      const t = isNative ? NativeBle : WebBle;
      if (!t.supported) return toast("블루투스 미지원", true);
      const prev = {...S};
      try {
        await Link.disconnect().catch(() => {});
        Object.assign(S, {kind:"mp686", pwd:pwd.join(""), keyHex:null, online:false});
        const picked = await t.pick(); S.bleId = picked.id; S.bleName = picked.name || "크라운"; S.name = S.name || "내 차";
        await Link.connect();
        save(); sh.classList.remove("show"); paint(); toast("연결됨");
      } catch (e) { await Link.disconnect().catch(() => {}); Object.assign(S, prev); S.online = false; save(); paint(); toast("실패: " + (e.name === "NotFoundError" ? "취소" : (e.message || e)), true); }
    };
  };
  render(); sh.classList.add("show");
}
function espSheet(){
  const sh = $("#sheet");
  sh.innerHTML = `<h4>ESP32 기기</h4><p>휴대폰 앱에서 보안 키 32자리를 확인해 입력하세요. 워치에서는 입력이 번거로워요.</p>
    <p style="color:var(--amber)">보통 크라운(MP686)만 쓰면 돼요.</p>
    <button class="sbtn" id="eClose">닫기</button>`;
  sh.classList.add("show"); $("#eClose").onclick = () => sh.classList.remove("show");
}

/* ---- 시작 ---- */
paint();
if (S.kind === "demo" || (isNative && S.bleId)) connectNow(false);
})();
</script>
