<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="color-scheme" content="dark">
<title>카온 차량 원격제어</title>
<script src="capacitor.js"></script>

<style>
:root{
  --bg:#141619; --bg-2:#1c1f23; --surface:#22262b; --surface-2:#2b3036; --line:#353b42;
  --ink:#eef1f4; --ink-2:#b4bcc6; --ink-3:#7f8893;
  --amber:#f2a33a; --amber-soft:rgba(242,163,58,.16);
  --blue:#4c8dff; --blue-soft:rgba(76,141,255,.18);
  --good:#4fd18b; --good-soft:rgba(79,209,139,.15);
  --bad:#ff6b5e; --bad-soft:rgba(255,107,94,.15);
  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* ---------- 상단 ---------- */
.titlebar{position:sticky; top:0; z-index:10; text-align:center; padding:calc(12px + env(safe-area-inset-top)) 56px 12px;
  background:linear-gradient(#26292e,#1b1d21); border-bottom:1px solid #000; box-shadow:0 1px 0 rgba(255,255,255,.04)}
.titlebar h1{margin:0; font-size:20px; font-weight:800; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.titlebar .demo{position:absolute; left:12px; top:calc(14px + env(safe-area-inset-top)); font-size:11px; font-weight:800; color:var(--amber);
  border:1px solid var(--amber); border-radius:6px; padding:1px 6px}

main{flex:1; display:flex; flex-direction:column}
.view{flex:1; display:flex; flex-direction:column; animation:fade .18s ease}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* ---------- 제어 화면 ---------- */
.stage{position:relative; flex:1; min-height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.07), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 2px, transparent 2px 6px),
    #2a2d31}
.car{height:min(46vh,380px); width:auto; overflow:visible; filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.car .beam{opacity:0; transition:opacity .15s}
.car .lamp{fill:#e9e3c8; transition:fill .15s}
.car .tail{fill:#7a1f1a; transition:fill .15s}
.car.flash .beam{animation:beam var(--fd,.5s) ease-in-out var(--fn,1)}
.car.flash .lamp{animation:lamp var(--fd,.5s) ease-in-out var(--fn,1)}
.car.flash .tail{animation:tail var(--fd,.5s) ease-in-out var(--fn,1)}
@keyframes beam{50%{opacity:.85}}
@keyframes lamp{50%{fill:#fffbe6}}
@keyframes tail{50%{fill:#ff3b2f}}
.car.engine .beam{opacity:.45}
.car.engine .lamp{fill:#fffbe6}
.car.engine .tail{fill:#d8352b}
.car .trunk{transition:transform .35s ease, fill .2s; transform-origin:100px 372px; transform-box:view-box}
.car.trunk-open .trunk{transform:translateY(22px) scaleY(.82); fill:#9aa1a9}
.car .smoke{opacity:0}
.car.engine .smoke{animation:smoke 1.6s ease-out infinite}
.car.engine .smoke:nth-of-type(2){animation-delay:.55s}
.car.engine .smoke:nth-of-type(3){animation-delay:1.1s}
@keyframes smoke{0%{opacity:.5; transform:translateY(0) scale(.6)} 100%{opacity:0; transform:translateY(34px) scale(1.8)}}
.car .smoke{transform-box:fill-box; transform-origin:center}
.car .lockmark{transition:opacity .2s}

.waves{position:absolute; left:50%; top:50%; width:10px; height:10px; pointer-events:none}
.waves i{position:absolute; left:-140px; top:-140px; width:280px; height:280px; border-radius:50%; border:3px solid var(--amber); opacity:0}
.waves.on i{animation:wave 1.2s ease-out 3}
.waves.on i:nth-child(2){animation-delay:.4s}
@keyframes wave{0%{transform:scale(.4); opacity:.9} 100%{transform:scale(1.5); opacity:0}}

.bt{position:absolute; right:16px; top:18%; width:54px; height:54px; border-radius:50%; border:2px solid #1d3a6e;
  background:radial-gradient(circle at 35% 30%, #3a6bc4, #1b3c78); color:#fff; display:grid; place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25)}
.bt svg{width:26px; height:26px}
.bt::after{content:""; position:absolute; top:6px; left:50%; margin-left:-4px; width:8px; height:8px; border-radius:50%; background:var(--bad);
  box-shadow:0 0 6px var(--bad)}
.bt.on::after{background:var(--good); box-shadow:0 0 6px var(--good)}
.bt.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

.chips{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:0 12px}
.chip{font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:rgba(0,0,0,.45); color:var(--ink-2); border:1px solid rgba(255,255,255,.08)}
.chip.good{color:var(--good)} .chip.warn{color:var(--amber)} .chip.bad{color:var(--bad)}

/* 컨트롤 패드 */
.pad{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; background:#101214;
  border-top:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.key{position:relative; height:clamp(78px,12vh,104px); border-radius:14px; border:2px solid #3a2a12; overflow:hidden;
  background:linear-gradient(170deg,#4a4e54 0%,#2b2e33 45%,#1c1e21 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(242,163,58,.55), 0 3px 0 #000;
  display:flex; align-items:center; color:#e9ecef; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.key:nth-child(odd){justify-content:flex-start; padding-left:16%}
.key:nth-child(even){justify-content:flex-end; padding-right:16%}
.key svg{width:40px; height:40px}
.key .lbl{position:absolute; bottom:6px; font-size:11.5px; font-weight:700; color:var(--ink-3)}
.key:nth-child(odd) .lbl{left:14px} .key:nth-child(even) .lbl{right:14px}
.key:active,.key.pressing{background:linear-gradient(170deg,#3a3d42,#1c1e21); box-shadow:inset 0 0 0 1px var(--amber), 0 1px 0 #000}
.key .hold{position:absolute; left:0; bottom:0; height:3px; width:calc(var(--p,0)*100%); background:var(--amber)}
.key:disabled{opacity:.45}
.start{position:absolute; left:50%; top:50%; width:clamp(108px,30vw,132px); aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; border:0; padding:0;
  background:conic-gradient(var(--amber) calc(var(--p,0)*1turn), #8d939a 0); box-shadow:0 0 0 5px #101214, 0 6px 14px rgba(0,0,0,.7);
  display:grid; place-items:center; touch-action:none; user-select:none; -webkit-user-select:none}
.start .in{width:calc(100% - 12px); aspect-ratio:1; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 35%, #dfe2ea, #b9bdc9 70%, #9fa4b2); box-shadow:inset 0 0 0 4px #5b6068, inset 0 0 0 7px #e8eaee;
  color:#f3f4f7; font-weight:900; letter-spacing:.08em; line-height:1; text-shadow:0 1px 1px rgba(0,0,0,.45)}
.start .in b{font-size:19px} .start .in small{font-size:9px; margin:3px 0; letter-spacing:.14em}
.start.running .in{background:radial-gradient(circle at 50% 35%, #ffd9a0, #f2a33a 70%, #c27618); box-shadow:inset 0 0 0 4px #6b4510, inset 0 0 0 7px #ffe2b8, 0 0 22px rgba(242,163,58,.6)}
.start:disabled{opacity:.55}

.hint{text-align:center; font-size:12px; color:var(--ink-3); padding:6px 12px 0; background:#101214; min-height:24px}

/* ---------- 목록 화면 ---------- */
.page{padding:0 0 16px}
.list{background:var(--bg-2)}
.row{display:flex; align-items:center; gap:12px; padding:14px 18px; min-height:64px; border-bottom:1px solid #2f343a; box-shadow:0 1px 0 rgba(255,255,255,.03)}
button.row{width:100%; border-left:0; border-right:0; border-top:0; background:none; text-align:left}
button.row:active{background:var(--surface)}
.row .body{flex:1; min-width:0}
.row .t1{font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t2{font-size:13px; color:var(--ink-3)}
.row .side{font-size:13px; color:var(--ink-3); flex:none; text-align:right}
.row .ico{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--surface-2); color:var(--ink-2)}
.row .ico svg{width:19px; height:19px}
.ico.good{background:var(--good-soft); color:var(--good)} .ico.warn{background:var(--amber-soft); color:var(--amber)}
.ico.bad{background:var(--bad-soft); color:var(--bad)} .ico.blue{background:var(--blue-soft); color:var(--blue)}
.sec{font-size:13px; font-weight:700; color:var(--ink-3); padding:18px 18px 6px; letter-spacing:.02em}
.danger .t1{color:var(--bad)}
.empty{padding:40px 16px; text-align:center; color:var(--ink-3)}

.check{position:relative; width:34px; height:34px; flex:none}
.check input{position:absolute; inset:0; margin:0; opacity:0; cursor:pointer; z-index:1}
.check i{position:absolute; inset:0; border:2px solid #6b737c; border-radius:4px; background:#1a1c1f}
.check input:checked + i::after{content:""; position:absolute; left:9px; top:3px; width:9px; height:17px; border:solid #8be04e; border-width:0 4px 4px 0; transform:rotate(45deg)}
.check input:focus-visible + i{outline:2px solid var(--amber); outline-offset:2px}
.check input:disabled + i{opacity:.4}
.row select{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 10px}

.prose{padding:8px 20px 20px; color:var(--ink-2); font-size:14.5px}
.prose h2{color:var(--ink); font-size:20px; text-align:center; margin:14px 0 10px}
.prose h3{color:var(--ink); font-size:15px; margin:18px 0 4px}
.prose ul{padding-left:20px; margin:4px 0}
.prose .warn{background:var(--amber-soft); border:1px solid rgba(242,163,58,.35); color:#f6cf98; border-radius:12px; padding:10px 12px; margin-top:12px}

/* ---------- 탭 ---------- */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:#0d0e10; border-top:1px solid #000; padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabs button{height:60px; border:0; border-right:1px solid #000; background:linear-gradient(#26292d,#1a1c1f); color:#6f7781; font-size:17px; font-weight:600}
.tabs button:last-child{border-right:0}
.tabs button.on{background:linear-gradient(#c9ccd1,#a9adb3); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4)}

/* ---------- 시트 / PIN / 토스트 ---------- */
.scrim{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; animation:fade .15s}
.sheet{width:100%; max-width:520px; max-height:88vh; overflow:auto; background:var(--bg-2); border-radius:20px 20px 0 0; border-top:1px solid var(--line);
  padding:8px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .2s ease}
@keyframes up{from{transform:translateY(30px)} to{transform:none}}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 12px}
.sheet h4{font-size:19px; font-weight:800; margin:0 0 4px}
.sheet p.sub{margin:0; color:var(--ink-2); font-size:14px}
.field{display:block; margin-top:14px}
.field > span{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.field input{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px}
.field input:focus{outline:2px solid var(--amber); outline-offset:-1px}
.btn{border:0; border-radius:12px; padding:13px 16px; font-weight:700; background:var(--surface-2); color:var(--ink)}
.btn.primary{background:var(--amber); color:#1d1406}
.btn.danger{background:var(--bad-soft); color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn-row{display:flex; gap:8px; margin-top:16px}
.btn-row .btn{flex:1}
.note{font-size:12.5px; color:var(--ink-3); margin:10px 2px 0}
.code{font-family:ui-monospace,Menlo,monospace; font-size:13px; word-break:break-all; background:var(--surface); padding:10px 12px; border-radius:10px; margin-top:8px}

.pin-screen{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.pin-screen h4{font-size:20px; font-weight:800; margin:0}
.pin-screen p{color:var(--ink-2); margin:6px 0 0; min-height:22px; text-align:center}
.pin-screen p.err{color:var(--bad)}
.pin-dots{display:flex; gap:16px; margin:26px 0 30px}
.pin-dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-3)}
.pin-dots i.on{background:var(--ink); border-color:var(--ink)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
.numpad{display:grid; grid-template-columns:repeat(3,76px); gap:14px 22px}
.numpad button{width:76px; height:76px; border-radius:50%; border:0; background:var(--surface); font-size:26px; font-weight:600}
.numpad button.ghost{background:none; font-size:15px; color:var(--ink-2)}
.numpad button:active{background:var(--surface-2)}

.toasts{position:fixed; left:0; right:0; top:calc(60px + env(safe-area-inset-top)); z-index:70; display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none; padding:0 16px}
.toast{max-width:480px; width:100%; background:#f1f3f5; color:#121417; border-radius:14px; padding:11px 16px; font-size:14px; font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.45); animation:drop .2s ease}
.toast.bad{background:var(--bad); color:#fff}
@keyframes drop{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div id="app">
  <header class="titlebar"><span class="demo" id="demoTag" hidden>데모</span><h1 id="title">차량 번호</h1></header>
  <main id="main"></main>
  <nav class="tabs" aria-label="메뉴"><div class="in">
    <button data-tab="control" class="on">제어</button>
    <button data-tab="settings">설정</button>
    <button data-tab="log">기록</button>
    <button data-tab="about">정보</button>
  </div></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════
   1. 유틸
   ══════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const randInt = n => {
  const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= max);
  return buf[0] % n;
};
const uid = () => Date.now().toString(36) + randInt(1e9).toString(36);
const hexToBytes = h => Uint8Array.from(h.match(/../g) || [], b => parseInt(b, 16));
const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return bytesToHex(new Uint8Array(buf));
}
async function hmac(keyHex, bytes, len = 16){
  const key = await crypto.subtle.importKey("raw", hexToBytes(keyHex), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, Uint8Array.from(bytes))).slice(0, len);
}

const DAY = ["일","월","화","수","목","금","토"];
const fmtTime = t => new Date(t).toLocaleTimeString("ko-KR", {hour:"numeric", minute:"2-digit"});
const fmtDate = t => {
  const d = new Date(t), today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - new Date(d).setHours(0,0,0,0)) / 864e5);
  if (diff === 0) return "오늘";
  if (diff === 1) return "어제";
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAY[d.getDay()]})`;
};
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };

const ICON = {
  lock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><path d="M12 14.5c-.9 1.2-1.3 1.9-1.3 2.4a1.3 1.3 0 0 0 2.6 0c0-.5-.4-1.2-1.3-2.4z" fill="currentColor" stroke="none"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V6.5a4 4 0 0 1 7.8-1.2"/><path d="M12 14.5c-.9 1.2-1.3 1.9-1.3 2.4a1.3 1.3 0 0 0 2.6 0c0-.5-.4-1.2-1.3-2.4z" fill="currentColor" stroke="none"/></svg>',
  trunk:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h3l2.5 5H21v4H5.5L3 14"/><path d="M8.5 14 15 6.5l4.5 1.5"/><path d="M9 18v2h4v-2"/></svg>',
  horn:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 7a7 7 0 0 1 0 10"/></svg>',
  bt:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>',
  engine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
  alert:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
};

/* ══════════════════════════════════════════════════════════
   2. 상태 저장
   ══════════════════════════════════════════════════════════ */
const STORE_KEY = "caron.v1";
const DEMO_KEY = "c0ffee00c0ffee00c0ffee00c0ffee00";
function seed(){
  const now = Date.now();
  return {
    car:{kind:"demo", name:"내 차", plate:"12가 3456", bleId:null, keyHex:DEMO_KEY,
      locked:true, engine:false, engineUntil:0, trunk:false, voltage:126, runMin:10, walkAway:true, online:false},
    settings:{autoUnlock:false, walkAwayLock:false, proxLevel:"medium", shake:false, confirmUnlock:false, pinHash:null},
    logs:[
      {id:uid(), t:now - 42*6e4, type:"lock", src:"앱"},
      {id:uid(), t:now - 47*6e4, type:"stop", src:"시간 종료"},
      {id:uid(), t:now - 57*6e4, type:"start", src:"앱"},
      {id:uid(), t:now - 26*36e5, type:"alarm", src:"충격 감지"},
    ],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); } catch { S = seed(); }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} };
const C = () => S.car;

/* ══════════════════════════════════════════════════════════
   3. 통신 — 카온 BLE 프로토콜 (caron-app/firmware/caron_esp32 와 짝)
   앱 → 기기 (CMD 쓰기)
     [0x01]               일회용 난수 요청
     [0x02]               상태 요청
     [op, arg, mac(16)]   인증 명령, mac = HMAC-SHA256(키, nonce‖op‖arg) 앞 16바이트
       op 0x00 키 확인 · 0x10 열기 · 0x11 잠그기 · 0x12 트렁크 · 0x13 차량 찾기(경적+비상등)
          0x14 시동 · 0x15 시동 끄기 · 0x21 원격시동 시간(arg=분) · 0x22 멀어지면 잠금(arg=0/1)
          0x30 보안 키 재발급
   기기 → 앱 (EVT 알림)
     [0x81, nonce(8)]     난수 (10초 유효, 1회용)
     [0x90, op, code]     결과
     [0xA0, 잠김, 시동, 트렁크, 남은분, 전압×10, 멀어지면잠금, 원격시동분]   상태
     [0xB0, 종류, 사유]   현장 이벤트 — 1 열림 2 잠김 3 경보 4 시동 5 시동꺼짐 6 트렁크
     [0xC0, 순번, 8바이트] 재발급 키 조각 (기존 키로 만든 HMAC과 XOR — 엿들어도 복원 불가)
   ══════════════════════════════════════════════════════════ */
const UUID = {
  SVC:"ca700001-5e1f-4b2a-8c3d-7a9e0b1c2d30",
  CMD:"ca700002-5e1f-4b2a-8c3d-7a9e0b1c2d30",
  EVT:"ca700003-5e1f-4b2a-8c3d-7a9e0b1c2d30",
};
/* MP686: 지오르돈/크라운 호환 모듈 (APK 분석 결과, FFE0 서비스의 시리얼 통신) */
const MP_UUID = {
  SVC:"0000ffe0-0000-1000-8000-00805f9b34fb",
  CMD:"0000ffe4-0000-1000-8000-00805f9b34fb",   // 쓰기
  EVT:"0000ffe9-0000-1000-8000-00805f9b34fb",   // 알림
};
const uuidsFor = kind => kind === "mp686" ? MP_UUID : UUID;
const curU = () => uuidsFor(C().kind);
/* MP686 프로토콜: 헤더 0xCD, 평문, 체크섬=앞바이트 합의 하위 1바이트 */
const MP_CMD = {lock:0xC1, unlock:0xC2, trunk:0xC3, find:0xC4, start:0xC5, stop:0xC6};
const MP_WARN = {0xE1:"문 열림", 0xE2:"트렁크 열림", 0xE3:"충격 감지", 0xE4:"시동 경보"};
const mpSum = a => { let s = 0; for (const x of a) s = (s + x) & 0xFF; return s; };
const mpFrame = a => { const d = [...a]; d.push(mpSum(d)); return d; };
const mpLoginPkt = (pwd, autoUnlock) => { const d = [0xCD, 0x0A, autoUnlock ? 1 : 0]; for (let i = 0; i < 6; i++) d.push(i < pwd.length ? pwd.charCodeAt(i) & 0xFF : 0); return mpFrame(d); };
const mpPwdPkt = (oldP, newP) => { const d = [0xCD, 0x0B]; for (let i = 0; i < 6; i++) d.push(i < oldP.length ? oldP.charCodeAt(i) & 0xFF : 0); for (let i = 0; i < 6; i++) d.push(i < newP.length ? newP.charCodeAt(i) & 0xFF : 0); return mpFrame(d); };
const mpAutoLockPkt = on => mpFrame([0xCD, 0x0F, on ? 1 : 0]);

const OP = {check:0x00, unlock:0x10, lock:0x11, trunk:0x12, find:0x13, start:0x14, stop:0x15, runmin:0x21, walkaway:0x22, rekey:0x30};
const ERR = {1:"보안 키가 맞지 않아요", 3:"요청 시간이 지났어요. 다시 눌러 주세요", 5:"기기가 명령을 이해하지 못했어요",
  6:"인증 실패가 반복돼 30초간 차단됐어요", 7:"보닛이 열려 있어 시동할 수 없어요", 8:"브레이크가 밟혀 있어 원격 시동할 수 없어요",
  9:"이미 시동이 걸려 있어요", 10:"시동이 걸리지 않았어요"};
const SRC_LOCK = {1:"리모컨", 2:"실내 버튼", 3:"자동 재잠금", 6:"멀어짐"};
const SRC_STOP = {1:"시간 종료", 2:"앱", 3:"브레이크", 4:"시동 실패"};

/* 전송 계층 ① APK: Capacitor BLE 플러그인 */
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const NativeBle = {
  subs:{}, _ready:null,
  get p(){ return this._p || (this._p = window.Capacitor.registerPlugin("BluetoothLe")); },
  supported:true,
  init(){ return this._ready || (this._ready = this.p.initialize({}).catch(e => { this._ready = null; throw e; })); },
  async pick(){ await this.init(); const d = await this.p.requestDevice(C().kind === "mp686" ? {optionalServices:[MP_UUID.SVC]} : {services:[curU().SVC]}); return {id:d.deviceId, name:d.name}; },
  async connect(id, onDisc){
    await this.init();
    if (this.subs.d) await this.subs.d.remove();
    this.subs.d = await this.p.addListener(`disconnected|${id}`, onDisc);
    await this.p.connect({deviceId:id, timeout:8000});
  },
  async notify(id, cb){
    if (this.subs.n) await this.subs.n.remove();
    this.subs.n = await this.p.addListener(`notification|${id}|${curU().SVC}|${curU().EVT}`, e => cb(hexToBytes(((e && e.value) || "").replace(/[^0-9a-f]/gi, ""))));
    await this.p.startNotifications({deviceId:id, service:curU().SVC, characteristic:curU().EVT});
  },
  write(id, bytes){ return this.p.write({deviceId:id, service:curU().SVC, characteristic:curU().CMD, value:bytesToHex(bytes)}); },
  async readRssi(id){ try { return (await this.p.readRssi({deviceId:id})).value; } catch { return null; } },
  disconnect(id){ return this.p.disconnect({deviceId:id}).catch(() => {}); },
};
/* 전송 계층 ② 브라우저: Web Bluetooth (안드로이드·PC Chrome, https) */
const WebBle = {
  devs:new Map(), ch:null,
  get supported(){ return !!navigator.bluetooth; },
  reqOpts(){ return C().kind === "mp686" ? {acceptAllDevices:true, optionalServices:[MP_UUID.SVC]} : {filters:[{services:[curU().SVC]}]}; },
  async pick(){ const d = await navigator.bluetooth.requestDevice(this.reqOpts()); this.devs.set(d.id, d); return {id:d.id, name:d.name}; },
  async connect(id, onDisc){
    let d = this.devs.get(id);
    if (!d && navigator.bluetooth.getDevices) d = (await navigator.bluetooth.getDevices()).find(x => x.id === id);
    if (!d) { d = await navigator.bluetooth.requestDevice(this.reqOpts()); this.devs.set(id, d); }
    d.ongattserverdisconnected = onDisc;
    const svc = await (await d.gatt.connect()).getPrimaryService(curU().SVC);
    this.ch = {d, cmd:await svc.getCharacteristic(curU().CMD), evt:await svc.getCharacteristic(curU().EVT)};
  },
  async notify(id, cb){
    this.ch.evt.oncharacteristicvaluechanged = e => { const v = e.target.value; cb(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength))); };
    await this.ch.evt.startNotifications();
  },
  write(id, bytes){ const c = this.ch.cmd; return (c.writeValueWithResponse || c.writeValue).call(c, Uint8Array.from(bytes)); },
  async readRssi(){ return null; },   // Web Bluetooth는 RSSI 미지원
  async disconnect(){ if (this.ch && this.ch.d.gatt.connected) this.ch.d.gatt.disconnect(); },
};
/* 전송 계층 ③ 데모: 펌웨어 로직을 그대로 흉내 내는 가상 차량 */
const DemoCar = {
  supported:true, cb:null, onDisc:null, nonce:null, fails:0, lockoutUntil:0, timers:{},
  st:null,
  load(){ const c = C(); this.st = {locked:c.locked, engine:c.engine && c.engineUntil > Date.now(), until:c.engineUntil, trunk:false, runMin:c.runMin, walkAway:c.walkAway}; },
  emit(bytes){ setTimeout(() => this.cb && this.cb(Uint8Array.from(bytes)), 30 + randInt(60)); },
  state(){ const s = this.st, left = s.engine ? Math.ceil((s.until - Date.now()) / 6e4) : 0;
    this.emit([0xA0, +s.locked, +s.engine, +s.trunk, Math.max(0, left), s.engine ? 141 : 126, +s.walkAway, s.runMin]); },
  async pick(){ return {id:"demo", name:"카온 데모 차량"}; },
  async connect(id, onDisc){ await sleep(350); this.onDisc = onDisc; this.load(); if (this.st.engine) this.armEngine(); },
  async notify(id, cb){ this.cb = cb; },
  async readRssi(){ return typeof window.__rssi === "number" ? window.__rssi : -55; },
  async disconnect(){ this.cb = null; },
  armEngine(){
    clearTimeout(this.timers.eng);
    this.timers.eng = setTimeout(() => { this.st.engine = false; this.emit([0xB0, 5, 1]); this.state(); }, Math.max(0, this.st.until - Date.now()));
  },
  async write(id, b){
    await sleep(120 + randInt(200));
    if (b.length === 1 && b[0] === 1) { this.nonce = crypto.getRandomValues(new Uint8Array(8)); return this.emit([0x81, ...this.nonce]); }
    if (b.length === 1 && b[0] === 2) return this.state();
    const op = b[0], arg = b[1], res = code => this.emit([0x90, op, code]);
    if (b.length !== 18) return res(5);
    if (Date.now() < this.lockoutUntil) return res(6);
    if (!this.nonce) return res(3);
    const mac = await hmac(DEMO_KEY, [...this.nonce, op, arg]); this.nonce = null;
    if (mac.some((x, i) => x !== b[2 + i])) { res(1); if (++this.fails >= 5) { this.fails = 0; this.lockoutUntil = Date.now() + 30000; this.emit([0xB0, 3, 2]); } return; }
    this.fails = 0;
    const s = this.st;
    switch (op) {
      case 0x00: res(0); break;
      case 0x10: res(0); s.locked = false;
        clearTimeout(this.timers.relock);   // 30초 안에 문을 안 열면 다시 잠금 (도난 방지)
        this.timers.relock = setTimeout(() => { if (!s.locked && !s.engine) { s.locked = true; this.emit([0xB0, 2, 3]); this.state(); } }, 30000);
        break;
      case 0x11: res(0); s.locked = true; clearTimeout(this.timers.relock); break;
      case 0x12: res(0); s.trunk = true; clearTimeout(this.timers.trunk);
        this.timers.trunk = setTimeout(() => { s.trunk = false; this.state(); }, 8000); break;
      case 0x13: res(0); break;
      case 0x14: if (s.engine) return res(9);
        res(0); await sleep(1500); s.engine = true; s.until = Date.now() + s.runMin * 6e4; this.armEngine(); break;
      case 0x15: res(0); s.engine = false; clearTimeout(this.timers.eng); break;
      case 0x21: res(0); s.runMin = Math.min(30, Math.max(1, arg)); break;
      case 0x22: res(0); s.walkAway = !!arg; break;
      default: return res(5);
    }
    this.state();
  },
};

/* 공통 링크: 난수 받기 → HMAC 서명 → 결과 대기 */
const Link = {
  live:false, waiters:[],
  t(){ return C().kind === "demo" ? DemoCar : (isNative ? NativeBle : WebBle); },
  id(){ return C().kind === "demo" ? "demo" : C().bleId; },
  async connect(){
    if (this.live) return;
    const t = this.t(), id = this.id();
    await t.connect(id, () => { this.live = false; onLink({type:"disconnected"}); });
    await t.notify(id, b => this.rx(b));
    this.live = true;
    if (C().kind === "mp686") { try { await this.mpLogin(); } catch (e) { this.live = false; await t.disconnect(id).catch(() => {}); throw e; } }
    else { onLink({type:"connected"}); await t.write(id, [0x02]); }
  },
  async disconnect(){ const was = this.live; this.live = false; await this.t().disconnect(this.id()); if (was) onLink({type:"disconnected", quiet:true}); },
  expect(match, ms = 6000){
    return new Promise((resolve, reject) => {
      const w = {match, resolve, timer:setTimeout(() => { this.waiters = this.waiters.filter(x => x !== w); reject(new Error("차량 기기가 응답하지 않아요")); }, ms)};
      this.waiters.push(w);
    });
  },
  rx(b){
    if (!b.length) return;
    const w = this.waiters.find(x => x.match(b));
    if (w) { clearTimeout(w.timer); this.waiters = this.waiters.filter(x => x !== w); w.resolve(b); }
    if (C().kind === "mp686") return mpHandle(b);
    if (b[0] === 0xA0 && b.length >= 8) onLink({type:"state", locked:!!b[1], engine:!!b[2], trunk:!!b[3], minsLeft:b[4], voltage:b[5], walkAway:!!b[6], runMin:b[7]});
    if (b[0] === 0xB0 && b.length >= 3) onLink({type:"event", kind:b[1], detail:b[2]});
  },
  /* ---- MP686 (크라운 호환) ---- */
  async mpWrite(bytes){ await this.connect(); await this.t().write(this.id(), bytes); },
  async mpLogin(){
    const w = this.expect(b => b[0] === 0xCD && b[1] === 0x0A, 8000);
    await this.t().write(this.id(), mpLoginPkt(C().pwd || "000000", S.settings.autoUnlock));
    const r = await w;
    if (r[2] !== 0) throw new Error("비밀번호가 맞지 않아요");
    onLink({type:"connected"});
    if (r.length >= 4) onLink({type:"mpstate", locked:r[3] === 0xA1 ? true : r[3] === 0xA2 ? false : C().locked});
  },
  async mpControl(cmd){
    const code = MP_CMD[cmd]; if (code == null) throw new Error("지원하지 않는 명령");
    await this.connect();
    const w = this.expect(b => b[0] === 0xCD && b[1] === 0x0D && b[2] === code, cmd === "start" ? 12000 : 6000);
    await this.t().write(this.id(), mpFrame([0xCD, 0x0D, code]));
    const r = await w;
    if (r[3] !== 0) throw new Error("차량이 명령을 거부했어요");
    return r;
  },
  async mpChangePwd(newP){
    await this.connect();
    const w = this.expect(b => b[0] === 0xCD && b[1] === 0x0B, 5000);
    await this.t().write(this.id(), mpPwdPkt(C().pwd || "000000", newP));
    const r = await w;
    if (r[2] !== 0) throw new Error("기기가 비밀번호 변경을 거부했어요");
    C().pwd = newP; save();
  },
  async auth(op, arg, keyHex, extra = []){
    await this.connect();
    const nP = this.expect(b => b[0] === 0x81);
    await this.t().write(this.id(), [0x01]);
    const nonce = (await nP).slice(1, 9);
    const mac = await hmac(keyHex, [...nonce, op, arg]);
    const waits = [this.expect(b => b[0] === 0x90, op === OP.start ? 12000 : 6000), ...extra.map(h => this.expect(b => b[0] === h))];
    await this.t().write(this.id(), [op, arg, ...mac]);
    const [r, ...rest] = await Promise.all(waits);
    if (r[2] !== 0) throw new Error(ERR[r[2]] || `기기 오류 (${r[2]})`);
    return {nonce, rest};
  },
  send(cmd, arg = 0){ return C().kind === "mp686" ? this.mpControl(cmd) : this.auth(OP[cmd], arg, C().keyHex); },
  async rssi(){ const t = this.t(); return t.readRssi ? t.readRssi(this.id()) : null; },
  /* 보안 키 재발급: 새 키 조각 2개를 받아 기존 키로 풀고, 새 키로 확인해야 기기가 확정 */
  async rekey(){
    const old = C().keyHex;
    const {nonce, rest} = await this.auth(OP.rekey, 0, old, [0xC0, 0xC0]);
    const parts = [];
    for (const p of rest) {
      const idx = p[1], pad = await hmac(old, [...nonce, OP.rekey, idx], 8);
      parts[idx] = p.slice(2, 10).map((x, i) => x ^ pad[i]);
    }
    if (!parts[0] || !parts[1]) throw new Error("새 키를 받지 못했어요");
    const fresh = bytesToHex([...parts[0], ...parts[1]]);
    await this.auth(OP.check, 0, fresh);
    return fresh;
  },
};

/* ══════════════════════════════════════════════════════════
   4. 상태 반영 · 기록
   ══════════════════════════════════════════════════════════ */
function log(type, src){
  S.logs.unshift({id:uid(), t:Date.now(), type, src});
  if (S.logs.length > 500) S.logs.length = 500;
}
let fx = null;   // 일회성 화면 효과: flash1 / flash2 / find

function onLink(ev){
  const c = C();
  if (ev.type === "connected") c.online = true;
  else if (ev.type === "disconnected") { if (c.online && !ev.quiet) toast("차량과 블루투스 연결이 끊겼어요", true); c.online = false; }
  else if (ev.type === "state") {
    const wasLocked = c.locked;
    Object.assign(c, {locked:ev.locked, engine:ev.engine, trunk:ev.trunk, walkAway:ev.walkAway, online:true});
    if (ev.voltage) c.voltage = ev.voltage;
    if (ev.runMin) c.runMin = ev.runMin;
    c.engineUntil = ev.engine ? (c.engine && Math.abs(c.engineUntil - Date.now() - ev.minsLeft * 6e4) < 6e4 ? c.engineUntil : Date.now() + ev.minsLeft * 6e4) : 0;
    if (wasLocked !== ev.locked && !fx) fx = ev.locked ? "flash1" : "flash2";
  } else if (ev.type === "mpstate") {
    c.online = true;
    if (c.locked !== ev.locked && !fx) fx = ev.locked ? "flash1" : "flash2";
    c.locked = ev.locked;
  } else if (ev.type === "event") {
    const k = ev.kind, d = ev.detail;
    if (k === 1) { log("unlock", SRC_LOCK[d] || "리모컨"); toast(`${SRC_LOCK[d] || "리모컨"}(으)로 문이 열렸어요`); }
    else if (k === 2) log("lock", SRC_LOCK[d] || "리모컨");
    else if (k === 3) { const why = d === 2 ? "잘못된 키 반복 시도" : "충격·문 열림 감지"; log("alarm", why); toast(`경보: ${why}`, true); vibrate([200, 100, 200]); }
    else if (k === 4) log("start", "리모컨");
    else if (k === 5) { log("stop", SRC_STOP[d] || "기기"); if (d !== 2) toast(`시동이 꺼졌어요 (${SRC_STOP[d] || "기기"})`); }
    else if (k === 6) log("trunk", "리모컨");
  }
  save(); render();
}

/* MP686(크라운 호환) 수신 프레임 처리 */
function mpHandle(b){
  const c = C();
  if (b[0] !== 0xCD || b.length < 3) return;
  const type = b[1];
  if (type === 0x0D && b[3] === 0) {          // 제어 성공 → 상태 반영 (앱·리모컨 공통)
    const cmd = b[2];
    if (cmd === 0xC1) c.locked = true;
    else if (cmd === 0xC2) c.locked = false;
    else if (cmd === 0xC5) c.engine = true;
    else if (cmd === 0xC6) c.engine = false;
  } else if (type === 0x0E) {                  // 경보
    const why = MP_WARN[b[2]] || "경보";
    log("alarm", why); toast(`경보: ${why}`, true); vibrate([200, 100, 200]);
  } else if (type === 0xA1) {                  // 시동 상태 알림
    c.engine = b[2] !== 0;
  }
  c.online = true; save(); render();
}

let busy = "";
const LABEL = {lock:"잠금", unlock:"문 열기", trunk:"트렁크 열기", find:"차량 찾기", start:"원격 시동", stop:"시동 끄기"};
async function act(cmd, src = "앱"){
  if (busy) return;
  if (cmd === "unlock" && src === "앱" && S.settings.confirmUnlock && S.settings.pinHash) {
    if (!(await askPin({title:"문 열기", sub:"앱 비밀번호를 입력하세요", verify:true}))) return;
  }
  busy = cmd; render();
  try {
    await Link.send(cmd);
    log(cmd, src);
    fx = {lock:"flash1", unlock:"flash2", find:"find", trunk:"flash1"}[cmd] || null;
    if (cmd === "start") toast(C().kind === "mp686" ? "시동을 걸었어요" : `시동을 걸었어요 · ${C().runMin}분 뒤 자동으로 꺼져요`);
    else toast(`${LABEL[cmd]} 완료`);
    vibrate(30);
  } catch (e) {
    toast(e.name === "NotFoundError" ? "기기 선택을 취소했어요" : `${LABEL[cmd]} 실패: ${e.message || e}`, true);
  } finally { busy = ""; save(); render(); }
}
async function connectNow(manual = true){
  if (busy) return;
  busy = "connect"; render();
  try { await Link.connect(); if (manual) toast(`${C().name}에 연결했어요`); return true; }
  catch (e) { if (manual) toast(e.name === "NotFoundError" ? "기기 선택을 취소했어요" : `연결 실패: ${e.message || e}`, true); return false; }
  finally { busy = ""; render(); }
}
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* ══════════════════════════════════════════════════════════
   5. 화면
   ══════════════════════════════════════════════════════════ */
let tab = "control";
const main = $("#main");

const CAR_SVG = `
<svg class="car" id="car" viewBox="0 -80 200 520" aria-hidden="true">
  <defs>

function engineLeft(){ return C().engine ? C().engineUntil - Date.now() : 0; }

      on && c.engine ? (engineLeft() > 0 ? `<span class="chip warn num" id="engChip">시동 중 · ${mmss(engineLeft())}</span>` : `<span class="chip warn">시동 중</span>`) : "",
      on && c.trunk ? `<span class="chip warn">트렁크 열림</span>` : "",
      on && c.voltage && c.kind !== "mp686" ? `<span class="chip ${c.voltage < 118 ? "bad" : ""} num">배터리 ${(c.voltage / 10).toFixed(1)}V</span>` : "",
    ].join("");

      !on ? "오른쪽 블루투스 버튼을 눌러 차량과 연결하세요" :
      c.engine ? "가운데 버튼을 누르면 시동이 꺼져요" : "트렁크·시동 버튼은 길게 누르세요";
    return `
      <section class="stage">
        ${CAR_SVG}
        <div class="waves" id="waves"><i></i><i></i></div>
        <button class="bt ${on ? "on" : ""} ${conn ? "busy" : ""}" id="btBtn" aria-label="블루투스 ${on ? "연결됨 — 눌러서 끊기" : "연결 안 됨 — 눌러서 연결"}">${ICON.bt}</button>
        <div class="chips">${chips}</div>
      </section>
      <section class="pad">
        <button class="key" data-cmd="lock" aria-label="잠금" ${dis ? "disabled" : ""}>${ICON.lock}<span class="lbl">잠금</span></button>

        <button class="key" data-cmd="find" aria-label="차량 찾기 (경적·비상등)" ${dis ? "disabled" : ""}>${ICON.horn}<span class="lbl">찾기</span></button>
        <button class="start ${c.engine && on ? "running" : ""}" id="startBtn" ${c.engine ? "" : 'data-hold="1200"'} data-cmd="${c.engine ? "stop" : "start"}"

    return `<div class="page">
      <div class="list">

        ${mp ? `<button class="row" data-act="mppwd"><div class="body"><div class="t1">기기 비밀번호 변경</div><div class="t2">크라운 모듈의 숫자 비밀번호(기본 000000)</div></div></button>` : ""}
        <button class="row" data-act="pin"><div class="body"><div class="t1">앱 잠금 비밀번호</div><div class="t2">${s.pinHash ? "설정됨 · 눌러서 변경" : "앱 실행 시 6자리 비밀번호 확인"}</div></div></button>
        <div class="row"><div class="body"><div class="t1">문 열기 전 비밀번호 확인</div><div class="t2">앱 잠금 비밀번호가 있어야 켤 수 있어요</div></div>${ck("confirmUnlock", s.confirmUnlock, !s.pinHash)}</div>
        ${s.pinHash ? `<button class="row danger" data-act="pin-off"><div class="body"><div class="t1">앱 잠금 비밀번호 해제</div></div></button>` : ""}
        ${ble || mp ? `<button class="row" data-act="to-demo"><div class="body"><div class="t1">데모 모드로 전환</div><div class="t2">등록한 기기 정보는 삭제돼요</div></div></button>` : ""}
        <button class="row danger" data-act="reset"><div class="body"><div class="t1">모든 데이터 초기화</div></div></button>
        <div class="row"><div class="body"><div class="t1">앱 버전 정보</div><div class="t2">1.0 · ${ble ? "블루투스 기기" : mp ? "크라운 호환(MP686)" : "데모 모드"}</div></div></div>
      </div></div>`;
  },

  log(){
    const META = {
      lock:["good", ICON.lock, "잠금"], unlock:["warn", ICON.unlock, "문 열림"], trunk:["blue", ICON.trunk, "트렁크 열림"],
      find:["blue", ICON.horn, "차량 찾기"], start:["warn", ICON.engine, "원격 시동"], stop:["", ICON.engine, "시동 꺼짐"], alarm:["bad", ICON.alert, "경보"],
    };
    let html = "", day = "";
    for (const l of S.logs) {
      const d = fmtDate(l.t);
      if (d !== day) { html += `${day ? "</div>" : ""}<div class="sec">${d}</div><div class="list">`; day = d; }
      const [cls, svg, t] = META[l.type] || ["", ICON.alert, l.type];
      html += `<div class="row"><span class="ico ${cls}">${svg}</span><div class="body"><div class="t1">${t}</div><div class="t2">${esc(l.src || "")}</div></div><span class="side num">${fmtTime(l.t)}</span></div>`;
    }
    if (day) html += "</div>";
    return `<div class="page">${html || `<div class="empty">아직 기록이 없어요</div>`}
      ${S.logs.length ? `<div style="padding:16px"><button class="btn block" data-act="clear-log">기록 지우기</button></div>` : ""}</div>`;
  },

  about(){
    return `<div class="page"><div class="prose">
      <h2>카온 차량 원격제어</h2>
      <p>휴대폰 블루투스로 차 문 잠금·열림, 트렁크, 차량 찾기(경적·비상등), 원격 시동을 제어하는 앱이에요.
      <b>설정 → 기기 검색</b>에서 <b>크라운 호환(MP686)</b> 모듈이나 직접 만든 <b>카온 기기(ESP32)</b>에 연결하세요.
      기기가 없으면 <b>데모 모드</b>로 모든 기능을 체험할 수 있어요.</p>
      <div class="warn">⚠️ 크라운 호환(MP686) 모듈은 명령이 평문으로 오가고 기본 비밀번호(000000)를 쓰는 경우가 많아, 보안이 약해요. 비밀번호를 꼭 바꾸세요.</div>
      <h3>사용법</h3>
      <ul>
        <li>잠금·열기·찾기: 한 번 누르기</li>
        <li>트렁크·원격 시동: 길게 누르기 (실수 방지)</li>
        <li>시동이 걸려 있을 때 가운데 버튼: 시동 끄기</li>
      </ul>
      <h3>자동 기능</h3>
      <ul>
        <li><b>흔들어서 잠금/열림</b>: 연결된 상태에서 휴대폰을 세게 두 번 흔들면 잠금↔열림 (설정에서 켜기)</li>
        <li><b>가까워지면 열림</b>: 차에 다가가 블루투스가 연결되면 자동으로 문 열림 (APK 전용)</li>
        <li><b>멀어지면 잠금</b>: 차에서 멀어져 신호가 약해지면 자동으로 잠금 (APK 전용 · 신호세기 기준)</li>
      </ul>
      <h3>보안</h3>
      <ul>
        <li>명령마다 기기가 일회용 난수를 주고, 앱이 보안 키로 서명(HMAC-SHA256)해서 보내요</li>
        <li>엿들은 신호를 다시 보내도 통하지 않고, 잘못된 키로 5번 시도하면 30초 차단 + 경보</li>
      </ul>
      <div class="warn">⚠️ 원격 시동은 차량 배선을 다루는 작업이에요. 전문 설치점이나 상용 원격시동기 모듈을 통해 연결하고,
      닫힌 차고·실내에서는 절대 시동을 걸지 마세요. 일부 지역은 공회전 시간을 제한하고 있어요.</div>
    </div></div>`;
  },
};

function render(){
  const c = C();
  $("#title").textContent = c.plate || c.name;
  $("#demoTag").hidden = c.kind !== "demo";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const y = window.scrollY;
  main.innerHTML = `<div class="view">${VIEWS[tab]()}</div>`;
  window.scrollTo(0, y);
  if (tab === "control") paintCar();
}

function paintCar(){
  const car = $("#car"); if (!car) return;
  const c = C();
  car.classList.toggle("engine", c.online && c.engine);
  car.classList.toggle("trunk-open", c.online && c.trunk);
  const g = car.querySelector(".lockmark");
  g.setAttribute("stroke", !c.online ? "#9aa0a7" : c.locked ? "#2f9e64" : "#d98a1f");
  g.querySelector(".shackle").setAttribute("d", c.locked ? "M8 14 V8 a8 8 0 0 1 16 0 V14" : "M8 14 V8 a8 8 0 0 1 15.5 -2.5");
  if (fx) {
    const kind = fx; fx = null;
    car.style.setProperty("--fn", kind === "flash2" ? 2 : kind === "find" ? 6 : 1);
    car.style.setProperty("--fd", kind === "find" ? ".4s" : ".45s");
    car.classList.remove("flash"); void car.getBoundingClientRect(); car.classList.add("flash");
    if (kind === "find") { const w = $("#waves"); w.classList.remove("on"); void w.offsetWidth; w.classList.add("on"); }
  }
}

function toast(text, bad = false){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : ""); el.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2800);
}
function sheet(html, onMount){
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => scrim.remove();
  scrim.addEventListener("click", e => { if (e.target === scrim || e.target.closest("[data-close]")) close(); });
  document.body.append(scrim);
  onMount && onMount(scrim.firstElementChild, close);
  return close;
}
function textSheet(title, label, value, onSave, opts = {}){
  sheet(`<h4>${esc(title)}</h4>
    <label class="field"><span>${esc(label)}</span><input id="tx" maxlength="${opts.max || 20}" value="${esc(value)}" ${opts.attrs || ""}></label>
    ${opts.note ? `<p class="note">${opts.note}</p>` : ""}
    <div class="btn-row"><button class="btn" data-close>취소</button><button class="btn primary" id="txOk">저장</button></div>`,
  (el, close) => {
    const inp = el.querySelector("#tx"); inp.focus(); inp.select();
    const ok = () => { if (onSave(inp.value.trim()) !== false) close(); };
    el.querySelector("#txOk").onclick = ok;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
  });
}
function confirmSheet(title, sub, okLabel, onOk){
  sheet(`<h4>${esc(title)}</h4><p class="sub">${esc(sub)}</p>
    <div class="btn-row"><button class="btn" data-close>취소</button><button class="btn danger" id="cOk">${esc(okLabel)}</button></div>`,
  (el, close) => { el.querySelector("#cOk").onclick = () => { close(); onOk(); }; });
}
function askPin({title, sub = "", verify = false, cancelable = true, len = 6}){
  return new Promise(resolve => {
    const el = document.createElement("div");
    el.className = "pin-screen";
    el.innerHTML = `<h4>${esc(title)}</h4><p>${esc(sub)}</p><div class="pin-dots">${"<i></i>".repeat(len)}</div>
      <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join("")}
        <button class="ghost" data-x="cancel" ${cancelable ? "" : "style='visibility:hidden'"}>취소</button>
        <button data-n="0">0</button><button class="ghost" data-x="back">지우기</button></div>`;
    document.body.append(el);
    let v = "", tries = 0;
    const dots = el.querySelector(".pin-dots"), msg = el.querySelector("p");
    const paint = () => dots.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", i < v.length));
    const done = r => { el.remove(); document.removeEventListener("keydown", onKey); resolve(r); };
    const input = async n => {
      if (v.length >= len) return;
      v += n; paint();
      if (v.length < len) return;
      if (!verify) return done(v);
      if (await sha256(v) === S.settings.pinHash) return done(true);
      tries++; v = "";
      msg.textContent = `비밀번호가 맞지 않아요 (${tries}회)`; msg.className = "err";
      dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake"); paint();
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.n) input(b.dataset.n);
      else if (b.dataset.x === "back") { v = v.slice(0, -1); paint(); }
      else if (b.dataset.x === "cancel" && cancelable) done(verify ? false : null);
    });
    const onKey = e => {
      if (/^\d$/.test(e.key)) input(e.key);
      else if (e.key === "Backspace") { v = v.slice(0, -1); paint(); }
      else if (e.key === "Escape" && cancelable) done(verify ? false : null);
    };
    document.addEventListener("keydown", onKey);
  });
}

function scanSheet(){
  const t = isNative ? NativeBle : WebBle;
  if (!t.supported) return sheet(`<h4>블루투스를 쓸 수 없어요</h4>
    <p class="sub" style="margin-top:6px">이 브라우저는 블루투스를 지원하지 않아요. <b>카온 APK</b>를 설치하거나 안드로이드·PC의
    <b>Chrome</b>에서 https 주소로 열어 주세요.</p><button class="btn block" style="margin-top:16px" data-close>확인</button>`);
  scanMp686();   // 크라운(MP686)이 일반적인 기기 → 바로 크라운 검색으로. ESP32는 그 안의 링크로.
}

function scanEsp32(){
  const t = isNative ? NativeBle : WebBle;
  sheet(`<h4>카온 기기 연결</h4>
    <p class="sub">차량 시동을 끄고(ACC 전원만) 휴대폰을 차 가까이 두세요.</p>
    <label class="field"><span>보안 키 (32자리)</span><input id="bKey" class="num" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="기기 시리얼 모니터에 나온 키"></label>
    <p class="note">키는 카온 기기를 처음 켰을 때 시리얼(115200)에 출력돼요.</p>
    <div class="btn-row"><button class="btn" data-close>취소</button><button class="btn primary" id="bGo">검색 시작</button></div>`,
  (el, close) => {
    const go = el.querySelector("#bGo");
    go.onclick = async () => {
      const keyHex = el.querySelector("#bKey").value.replace(/[\s:-]/g, "").toLowerCase();
      if (!/^[0-9a-f]{32}$/.test(keyHex)) return toast("보안 키는 0-9, a-f로 된 32자리여야 해요", true);
      go.disabled = true; go.textContent = "검색 중…";
      const prev = {...C()};
      try {
        await Link.disconnect();
        Object.assign(C(), {kind:"ble", keyHex, online:false});
        const picked = await t.pick();
        C().bleId = picked.id; C().bleName = picked.name || "카온 기기";
        go.textContent = "인증 중…";
        await Link.send("check");
        save(); close(); tab = "control"; render(); toast("기기를 등록했어요");
      } catch (e) {
        await Link.disconnect().catch(() => {});
        S.car = prev; S.car.online = false; save(); render();
        toast(e.name === "NotFoundError" ? "기기 선택을 취소했어요" : `등록 실패: ${e.message || e}`, true);
        go.disabled = false; go.textContent = "검색 시작";
      }
    };
  });
}

function scanMp686(){
  const t = isNative ? NativeBle : WebBle;
  sheet(`<h4>크라운 호환 기기 연결</h4>
    <p class="sub">차량 ACC 전원만 켜고 휴대폰을 가까이 두세요. 기기 목록에서 모듈 이름(예: 8250, 825040 등)을 고르세요.</p>
    <label class="field"><span>기기 비밀번호 (숫자 6자리)</span><input id="mPwd" inputmode="numeric" maxlength="6" value="000000"></label>
    <p class="note">크라운 앱에서 쓰던 비밀번호예요. 바꾼 적 없으면 기본값 000000.</p>
    <p class="note" style="text-align:center; margin-top:14px"><a href="#" id="toEsp" style="color:var(--ink-3)">직접 만든 ESP32 기기 연결 →</a></p>
    <div class="btn-row"><button class="btn" data-close>취소</button><button class="btn primary" id="mGo">검색 시작</button></div>`,
  (el, close) => {
    el.querySelector("#toEsp").onclick = e => { e.preventDefault(); close(); scanEsp32(); };
    const go = el.querySelector("#mGo");
    go.onclick = async () => {
      const pwd = el.querySelector("#mPwd").value.replace(/\D/g, "");
      if (pwd.length < 1 || pwd.length > 6) return toast("비밀번호는 숫자 1~6자리여야 해요", true);
      go.disabled = true; go.textContent = "검색 중…";
      const prev = {...C()};
      const errText = e => e && (e.message || e.errorMessage || e.code || e.name) || String(e);
      try {
        await Link.disconnect();
        Object.assign(C(), {kind:"mp686", pwd, keyHex:null, online:false});
        let picked;
        try { picked = await t.pick(); }
        catch (e) {
          if (e && e.name === "NotFoundError") throw new Error("__cancel__");
          throw new Error("기기 검색 실패: " + errText(e));
        }
        C().bleId = picked.id; C().bleName = picked.name || "크라운 기기";
        go.textContent = "연결 중…";
        try { await Link.connect(); }   // 연결 + 로그인
        catch (e) { throw new Error("연결/로그인 실패: " + errText(e)); }
        save(); close(); tab = "control"; render(); toast(`${C().bleName}에 연결했어요`);
      } catch (e) {
        await Link.disconnect().catch(() => {});
        S.car = prev; S.car.online = false; save(); render();
        toast(e.message === "__cancel__" ? "기기 선택을 취소했어요" : (e.message || String(e)), true);
        go.disabled = false; go.textContent = "검색 시작";
      }
    };
  });
}

async function setPin(){
  if (S.settings.pinHash && !(await askPin({title:"앱 잠금 비밀번호 변경", sub:"현재 비밀번호를 입력하세요", verify:true}))) return;
  const a = await askPin({title:"새 비밀번호", sub:"숫자 6자리를 입력하세요"}); if (!a) return;
  const b = await askPin({title:"한 번 더 입력", sub:"확인을 위해 다시 입력하세요"}); if (!b) return;
  if (a !== b) return toast("두 번 입력한 비밀번호가 달라요", true);
  S.settings.pinHash = await sha256(a); save(); render(); toast("앱 잠금 비밀번호를 설정했어요");
}

/* ══════════════════════════════════════════════════════════
   7. 입력 처리
   ══════════════════════════════════════════════════════════ */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; window.scrollTo(0, 0); render();
});

/* 길게 누르기 (data-hold=ms) */
let hold = null;
main.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-hold]"); if (!b || b.disabled) return;
  b.setPointerCapture(e.pointerId);
  b.classList.add("pressing");
  const ms = +b.dataset.hold, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    b.style.setProperty("--p", p);
    if (p >= 1) { hold = null; b.style.setProperty("--p", 0); b.classList.remove("pressing"); b.dataset.fired = "1"; vibrate(30); act(b.dataset.cmd); return; }
    hold = {raf:requestAnimationFrame(step), b};
  };
  hold = {raf:requestAnimationFrame(step), b};
});
const cancelHold = () => {
  if (!hold) return;
  cancelAnimationFrame(hold.raf); hold.b.style.setProperty("--p", 0); hold.b.classList.remove("pressing");
  if (hold.b.dataset.cmd === "trunk" || hold.b.dataset.cmd === "start") toast("길게 눌러 주세요");
  hold = null;
};
main.addEventListener("pointerup", cancelHold);
main.addEventListener("pointercancel", () => { if (hold) { cancelAnimationFrame(hold.raf); hold.b.style.setProperty("--p", 0); hold.b.classList.remove("pressing"); hold = null; } });
main.addEventListener("contextmenu", e => { if (e.target.closest(".pad")) e.preventDefault(); });

main.addEventListener("click", e => {
  const t = e.target;
  const k = t.closest("[data-cmd]");
  if (k) {
    if (k.dataset.hold) { if (k.dataset.fired) delete k.dataset.fired; else if (e.detail === 0) act(k.dataset.cmd); return; }  // detail 0 = 키보드
    return act(k.dataset.cmd);
  }
  if (t.closest("#btBtn")) {
    if (busy) return;
    if (C().online) { Link.disconnect(); return; }
    return connectNow(true);
  }
  const a = t.closest("[data-act]"); if (!a) return;
  ({
    scan: scanSheet,
    name: () => textSheet("이름 변경", "기기 이름", C().name, v => { if (!v) return false; C().name = v; save(); render(); }),
    plate: () => textSheet("차량 번호", "예: 12가 3456", C().plate, v => { C().plate = v; save(); render(); }),
    pin: setPin,
    "pin-off": async () => { if (await askPin({title:"앱 잠금 비밀번호 해제", sub:"현재 비밀번호를 입력하세요", verify:true})) { S.settings.pinHash = null; S.settings.confirmUnlock = false; save(); render(); toast("앱 잠금을 해제했어요"); } },
    rekey: () => confirmSheet("기기 비밀번호 변경", "기기가 새 보안 키를 만들고, 이 휴대폰에만 암호화해서 전달해요. 다른 휴대폰에 등록된 키는 더 이상 쓸 수 없어요.", "변경", async () => {
      if (busy) return;
      busy = "rekey"; render();
      try { const k = await Link.rekey(); C().keyHex = k; save(); toast("보안 키를 바꿨어요");
        sheet(`<h4>새 보안 키</h4><p class="sub">다른 휴대폰에도 등록하려면 이 키를 안전하게 옮겨 적으세요.</p><div class="code">${k}</div><button class="btn block" style="margin-top:14px" data-close>확인</button>`); }
      catch (err) { toast(`변경 실패: ${err.message || err}`, true); }
      finally { busy = ""; render(); }
    }),
    mppwd: () => textSheet("기기 비밀번호 변경", "새 비밀번호 (숫자 6자리)", "", v => {
      v = (v || "").replace(/\D/g, "");
      if (v.length < 1 || v.length > 6) { toast("숫자 1~6자리로 입력하세요", true); return false; }
      Link.mpChangePwd(v).then(() => { render(); toast("기기 비밀번호를 바꿨어요"); }).catch(e => toast(e.message || e, true));
    }, {attrs:'inputmode="numeric" maxlength="6"'}),
    "to-demo": () => confirmSheet("데모 모드로 전환", "등록한 기기 정보가 이 휴대폰에서 지워져요.", "전환", async () => {
      await Link.disconnect().catch(() => {});
      Object.assign(C(), {kind:"demo", bleId:null, bleName:null, keyHex:DEMO_KEY, pwd:null, online:false}); save(); render(); connectNow(false);
    }),
    reset: () => confirmSheet("모든 데이터 초기화", "기기 등록·보안 키·기록·앱 비밀번호가 처음 상태로 돌아가요.", "초기화", async () => {
      await Link.disconnect().catch(() => {});
      S = seed(); save(); tab = "control"; render(); connectNow(false);
    }),
    "clear-log": () => confirmSheet("기록 지우기", "모든 사용 기록을 지워요.", "지우기", () => { S.logs = []; save(); render(); }),
  })[a.dataset.act]?.();
});

main.addEventListener("change", e => {
  const el = e.target.closest("[data-set]"); if (!el) return;
  const k = el.dataset.set, v = el.type === "checkbox" ? el.checked : +el.value;
  if (k === "runMin" && C().kind === "ble") {        // ESP32 기기에 저장되는 원격시동 시간
    Link.send("runmin", +v)
      .then(() => toast("기기 설정을 바꿨어요"))
      .catch(err => toast(err.message, true))
      .finally(() => render());
    return;
  }
  if (k === "autoUnlock") {                          // MP686은 로그인 패킷에 담겨 전송됨
    S.settings.autoUnlock = v; save(); render();
    if (C().kind === "mp686" && C().online) Link.mpLogin().catch(() => {});
    return;
  }
  if (k === "proxLevel") { S.settings.proxLevel = el.value; resetProx(); save(); render(); return; }
  S.settings[k] = v;
  if (k === "shake" && v) enableShake();
  save(); render();
});

/* ---------- 흔들어서 잠금/열림 ---------- */
let shakeOn = false, lastPeak = 0, lastShake = 0;
async function enableShake(){
  if (shakeOn) return;
  try {
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {   // iOS
      if (await DeviceMotionEvent.requestPermission() !== "granted") throw new Error("denied");
    }
    window.addEventListener("devicemotion", onMotion);
    shakeOn = true;
  } catch { toast("움직임 센서를 쓸 수 없어요", true); S.settings.shake = false; save(); render(); }
}
function onMotion(e){
  if (!S.settings.shake || document.hidden) return;
  const a = e.acceleration && e.acceleration.x != null ? e.acceleration : e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  const g = e.acceleration && e.acceleration.x != null ? 0 : 9.8;
  const m = Math.abs(Math.hypot(a.x, a.y, a.z) - g), now = Date.now();
  if (m < 18) return;
  if (now - lastPeak > 120 && now - lastPeak < 700 && now - lastShake > 3000) {   // 0.7초 안에 강한 흔들림 2번
    lastShake = now;
    const c = C();
    if (c.online && !busy) act(c.locked ? "unlock" : "lock", "흔들기");
  }
  if (now - lastPeak > 120) lastPeak = now;
}

/* ---------- 근접 엔진 (신호세기 RSSI 기준) ----------
   블루투스는 멀리서도 연결되므로, "연결/끊김"이 아니라 신호세기로 거리를 가늠해요.
   near(가까움)·far(멀어짐) 두 문턱 사이에 넓은 완충구간(히스테리시스)을 둬서 경계에서 출렁이지 않아요.
   가까워지면 열림: 멀리 있다가 near를 '넘어 들어올' 때 1번만 열기
   멀어지면 잠금: 가까이 있다가 far 밖으로 '나갈' 때 1번만 잠그기
   (RSSI는 APK에서만 읽을 수 있어요. 데모는 가상값)                                   */
const PROX = {
  close:  {near:-58, far:-74, label:"가까이"},   // 차 바로 앞에서 열림
  medium: {near:-66, far:-82, label:"보통"},
  far:    {near:-74, far:-90, label:"멀리"},
};
let rssiAvg = null, proxZone = null, proxBusy = false;
function resetProx(){ rssiAvg = null; proxZone = null; }
async function proximityTick(){
  const c = C();
  if (proxBusy || busy || document.hidden) return;
  if (c.kind !== "demo" && c.kind !== "ble" && c.kind !== "mp686") return;
  const canReconnect = isNative || c.kind === "demo";
  const wantProx = S.settings.autoUnlock || S.settings.walkAwayLock;
  proxBusy = true;
  try {
    if (!c.online) {
      resetProx();
      if (canReconnect && wantProx) await connectNow(false);   // 연결만 유지 — 연결됐다고 열지 않음
      return;
    }
    if (!wantProx) return;
    const r = await Link.rssi().catch(() => null);
    if (r == null || r === 0) return;                          // RSSI 못 읽으면 대기
    rssiAvg = rssiAvg == null ? r : Math.round(rssiAvg * 0.5 + r * 0.5);   // 평활화(노이즈 완화)
    const P = PROX[S.settings.proxLevel] || PROX.medium;
    const zone = rssiAvg >= P.near ? "near" : rssiAvg <= P.far ? "far" : proxZone;  // 완충구간은 이전 상태 유지
    if (proxZone == null) { proxZone = zone; return; }         // 첫 측정은 기준만 잡고 동작 안 함(연결 직후 오작동 방지)
    if (zone !== proxZone) {
      if (zone === "near" && S.settings.autoUnlock && c.locked) await act("unlock", "근접 자동");
      else if (zone === "far" && S.settings.walkAwayLock && !c.locked && !c.engine) await act("lock", "근접 자동");
      proxZone = zone;
    }
  } finally { proxBusy = false; }
}
setInterval(proximityTick, 1800);
window.__proximityTick = proximityTick;   // 테스트 훅

/* 시동 남은 시간 표시 */
setInterval(() => {
  const chip = $("#engChip");
  if (chip) chip.textContent = `시동 중 · ${mmss(engineLeft())}`;
}, 1000);

/* ══════════════════════════════════════════════════════════
   8. 시작
   ══════════════════════════════════════════════════════════ */
S.car.online = false;
render();
if (S.settings.shake) enableShake();
(async () => {
  if (S.settings.pinHash) await askPin({title:"카온", sub:"앱 잠금 비밀번호를 입력하세요", verify:true, cancelable:false});
  if (C().kind === "demo" || isNative) connectNow(false);   // 웹 블루투스는 사용자가 버튼을 눌러야 연결 가능
})();

})();
</script>
