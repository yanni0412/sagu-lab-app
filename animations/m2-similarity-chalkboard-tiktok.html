  :root{--bg:#07060a;--fg:#fff4e0;--dim:#b9a99a;--accent:#ffd34a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"ChalkFont","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
  body.portrait canvas{width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 55%,rgba(20,40,30,.55),rgba(0,0,0,.86) 70%);cursor:pointer;
    transition:opacity .9s ease;text-align:center;padding:16px;box-sizing:border-box;user-select:none}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,54px);line-height:1.25;letter-spacing:.02em;
    text-shadow:0 4px 0 #140c18,0 0 18px rgba(255,200,120,.35)}
  #overlay .sub{color:var(--dim);font-size:clamp(13px,2.4vw,17px);letter-spacing:.08em}
  #overlay button{margin-top:16px;font:inherit;font-size:clamp(16px,2.6vw,20px);color:#1b1220;background:var(--accent);
    border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 0 4px rgba(255,211,74,.2),0 8px 30px rgba(255,170,60,.25)}
  #overlay button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay .hint{color:#8a7d70;font-size:12px;letter-spacing:.06em;margin-top:6px}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#8e2d72,#ffd34a);opacity:0;transition:opacity .4s}
  body:hover #bar{opacity:.75}
  #pause{position:fixed;top:14px;right:16px;font-size:13px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .3s}
  #pause.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1080" height="1920" aria-label="칠판으로 배우는 원주각 영상"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="재생">
  <h1>원주각,<br>칠판으로 한 번에</h1>
  <div class="sub">중심각 · 원주각 · 증명 · 지름은 90° · 3초 퀴즈</div>
  <button id="play" type="button">▶ 재생 (소리 켜짐)</button>
  <div class="hint">화면 터치 · Space 일시정지 · R 처음부터 · F 전체화면</div>
</div>
<div id="bar"></div>
<div id="pause">PAUSE</div>
<script>
"use strict";
// ================= CORE: math, color, noise, drawing helpers =================
const W = 1080, H = 1920; let DUR = 90;
const PT = H > W, V = (l, p) => PT ? p : l;   // landscape / portrait (9:16) layouts
const TAU = Math.PI * 2;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
document.body.classList.toggle('portrait', PT);
const ctx = cv.getContext('2d');
const INK = '#1b1220';

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a));
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// piecewise keyframes [[t,v],...] with smoothstep between keys
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, ss(t0, t1, t));
    }
  }
  return keys[keys.length - 1][1];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// deterministic hash -> [0,1)
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) p[i] = r();
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return lerp(p[i & 1023], p[(i + 1) & 1023], u);
  };
}
function fbm(n, x, oct = 4) {
  let s = 0, a = .5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); norm += a; a *= .5; f *= 2.03; }
  return s / norm;
}

// ---- color ----
const _pc = new Map();
function P(c) {
  if (Array.isArray(c)) return c;
  let v = _pc.get(c);
  if (!v) {
    if (c[0] === '#') {
      const h = c.slice(1);
      v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    } else { // "rgb(r,g,b)" / "rgba(...)" produced by mix()/rgb()
      const m = c.match(/[\d.]+/g).map(Number);
      v = [m[0], m[1], m[2]];
    }
    if (_pc.size > 4000) _pc.clear();
    _pc.set(c, v);
  }
