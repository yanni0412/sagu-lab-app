  :root{--bg:#07060a;--fg:#fff4e0;--dim:#b9a99a;--accent:#ffd34a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"CapFont","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
  body.portrait canvas{width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 55%,rgba(30,16,30,.5),rgba(0,0,0,.88) 70%);cursor:pointer;
    transition:opacity .9s ease;text-align:center;padding:16px;box-sizing:border-box;user-select:none}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,54px);line-height:1.25;letter-spacing:.02em;
    text-shadow:0 4px 0 #140c18,0 0 18px rgba(255,200,120,.35)}
  #overlay .sub{color:var(--dim);font-size:clamp(13px,2.4vw,17px);letter-spacing:.08em}
  #overlay button{margin-top:16px;font:inherit;font-size:clamp(16px,2.6vw,20px);color:#1b1220;background:var(--accent);
    border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 0 4px rgba(255,211,74,.2),0 8px 30px rgba(255,170,60,.25)}
  #overlay button.ghost{margin-top:0;background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px rgba(255,244,224,.5);font-size:clamp(13px,2.2vw,16px);padding:9px 22px}
  #overlay button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay .hint{color:#8a7d70;font-size:12px;letter-spacing:.06em;margin-top:6px}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#8e2d72,#ffd34a);opacity:0;transition:opacity .4s}
  body:hover #bar{opacity:.75}
  #pause{position:fixed;top:14px;right:16px;font-size:13px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .3s}
  #pause.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1080" height="1920" aria-label="40초 애니메이션: 노래하는 모나리자"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="재생">
  <h1>모나리자,<br>오늘 첫 공연</h1>
  <div class="sub">레오나르도 다 빈치 〈모나리자〉 패러디 · 그림과 노래는 코드로 직접 제작</div>
  <button id="play" type="button">▶ 재생 (소리 켜짐)</button>
  <button id="voiceBtn" type="button" class="ghost">🎤 내 목소리 파일로 재생</button>
  <input id="voiceFile" type="file" accept="audio/*" hidden>
  <div class="hint">화면 터치 · Space 일시정지 · R 처음부터 · F 전체화면</div>
</div>
<div id="bar"></div>
<div id="pause">PAUSE</div>
<script>
"use strict";
// ================= CORE: math, color, noise, drawing helpers =================
const W = 1080, H = 1920; let DUR = 40;
const PT = H > W, V = (l, p) => PT ? p : l;   // landscape / portrait (9:16) layouts
const TAU = Math.PI * 2;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
document.body.classList.toggle('portrait', PT);
const ctx = cv.getContext('2d');
const INK = '#1b1220';

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a));
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// piecewise keyframes [[t,v],...] with smoothstep between keys
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, ss(t0, t1, t));
    }
  }
  return keys[keys.length - 1][1];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// deterministic hash -> [0,1)
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) p[i] = r();
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return lerp(p[i & 1023], p[(i + 1) & 1023], u);
  };
}
function fbm(n, x, oct = 4) {
  let s = 0, a = .5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); norm += a; a *= .5; f *= 2.03; }
  return s / norm;
}

// ---- color ----
const _pc = new Map();
function P(c) {
  if (Array.isArray(c)) return c;
  let v = _pc.get(c);
  if (!v) {
    if (c[0] === '#') {
      const h = c.slice(1);
      v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    } else { // "rgb(r,g,b)" / "rgba(...)" produced by mix()/rgb()
      const m = c.match(/[\d.]+/g).map(Number);
      v = [m[0], m[1], m[2]];
    }
    if (_pc.size > 4000) _pc.clear();
    _pc.set(c, v);
  }
  return v;
}
const mixA = (a, b, t) => { a = P(a); b = P(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; };
const rgb = (a, al) => al === undefined
  ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`
  : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const mix = (a, b, t, al) => rgb(mixA(a, b, t), al);
function stoneOf(c) {
  const a = P(c), l = (a[0] * .3 + a[1] * .59 + a[2] * .11) / 255;
  const v = lerp(78, 168, l);
  return [v + 6, v + 3, v - 2];
}
function mulA(a, b) { a = P(a); b = P(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; }

// ---- paths ----
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();

      VOW[v].forEach(([fq, db], j) => { const tune = j === 0 ? Math.max(fq, mtof(m) * 1.02) : (j === 1 ? Math.max(fq, mtof(m) * 1.6) : fq); fb[j][0].frequency.setTargetAtTime(tune, T(nt), .05); fb[j][1].gain.setTargetAtTime(Math.pow(10, db / 20), T(nt), .05); });

    for (const o of [src, vib, drift, breathN]) { o.start(T(t0 - .06)); o.stop(T(t1 + .6)); }

    noise(WHITE, T(t0 - .5), .45, filt('bandpass', 1600, .8, hold(T(t0 - .5), .2, .05, .1, .12, sfx)));
  }

  // ---- orchestra ----
  const strings = (t0, notes, dur, v, cut = 1800) => { const g = hold(T(t0), Math.min(.9, dur * .4), v, dur, .9, filt('lowpass', cut, .6, orch)); const l = ac.createOscillator(); l.frequency.value = 5.2; const lg = ac.createGain(); lg.gain.value = 8; l.connect(lg); l.start(T(t0)); l.stop(T(t0 + dur + 1.2)); for (const m of notes) for (const dt of [-9, 0, 8]) { const o = osc('sawtooth', mtof(m), T(t0), T(t0 + dur + 1.2), g); o.detune.value = dt; lg.connect(o.detune); } };
  const harp = (t0, m, v) => { osc('triangle', mtof(m), T(t0), T(t0 + 1.6), env(T(t0), .003, v, 1.4, orch)); osc('sine', mtof(m) * 2, T(t0), T(t0 + .6), env(T(t0), .002, v * .3, .5, orch)); };
  const bassP = (t0, m, d, v) => { const lp = filt('lowpass', 600, .7, hold(T(t0), .03, v, d, .3, orch)); osc('sawtooth', mtof(m - 12), T(t0), T(t0 + d + .5), lp); osc('sine', mtof(m - 12), T(t0), T(t0 + d + .5), lp); };
  const timp = (t0, v, roll = 0) => { const n = roll ? Math.floor(roll / .06) : 1; for (let k = 0; k < n; k++) { const tt = t0 + k * .06, vv = roll ? v * (.3 + .7 * k / n) : v; const o = osc('sine', 88, T(tt), T(tt + .8), env(T(tt), .003, vv, .6, orch)); o.frequency.exponentialRampToValueAtTime(66, T(tt + .4)); noise(BROWN, T(tt), .2, filt('lowpass', 220, .7, env(T(tt), .003, vv * .5, .15, orch))); } };
  const horns = (t0, notes, d, v) => { const g = hold(T(t0), .5, v, d, .6, filt('lowpass', 1100, .8, orch)); for (const m of notes) for (const dt of [-5, 5]) { const o = osc('sawtooth', mtof(m), T(t0), T(t0 + d + .8), g); o.detune.value = dt; } };
  // intro swell + harp roll
  strings(.6, [53, 57, 60, 65], T_INTRO + 4 * BEAT - .6, .05, 900);
  [53, 57, 60, 65, 69, 72, 77].forEach((m, i) => harp(T_INTRO + i * .11, m, .1));
  [65, 69, 72, 77, 72, 69].forEach((m, i) => harp(T_INTRO + 2 * BEAT + i * .18, m, .07));
  CHORDS.forEach(([b, bass, up], i) => {
    const t0 = T_INTRO + b * BEAT, nb2 = CHORDS[i + 1] ? CHORDS[i + 1][0] : b + 5, d = (nb2 - b) * BEAT;
    const climax = b >= 24 && b < 29, swell = b >= 20;
    strings(t0, up, d, climax ? .09 : swell ? .075 : .055, climax ? 3200 : swell ? 2400 : 1600);
    bassP(t0, bass, d, climax ? .2 : .14);
    if (!climax) for (let k = 0; k < Math.floor(d / BEAT) * 2; k++) harp(t0 + k * BEAT / 2, up[(k * 2 + 1) % up.length] + (k % 4 === 3 ? 12 : 0), b >= 31 ? .05 : .065);
    if (climax || b === 33) horns(t0, up.slice(0, 3), d, .06);
  });
  timp(T_CLIMAX - 2 * BEAT, .25, 2 * BEAT); timp(T_CLIMAX, .5); timp(T_FINAL, .35); timp(T_END_SING - .2, .4);
  // ---- museum ----
  { const g = hold(T(0), .3, .22, 3.3, .35, amb); const bp = filt('bandpass', 650, .6, g); const l = ac.createOscillator(); l.frequency.value = 3; const lg = ac.createGain(); lg.gain.value = 300; l.connect(lg); lg.connect(bp.frequency); l.start(T(0)); l.stop(T(4.2)); noise(WHITE, T(0), 4.2, bp); }
  for (const x of [.4, 1.3, 2.2, 3.0]) noise(WHITE, T(x), .1, filt('bandpass', 900, 1.2, env(T(x), .005, .05, .08, amb)));
  for (let i = 0; i < 6; i++) osc('sine', 2600 + i * 400, T(.62 + i * .025), T(.7 + i * .025), env(T(.62 + i * .025), .002, .02, .05, sfx));
  { const g = hold(T(3.5), .25, .12, .5, .4, sfx), b1 = filt('bandpass', 450, 3, g), b2 = filt('bandpass', 800, 4, g); noise(WHITE, T(3.5), 1.2, b1); noise(WHITE, T(3.5), 1.2, b2); }
  { const g = hold(T(T_CLIMAX + .3), .4, .08, 1.0, .6, sfx); noise(WHITE, T(T_CLIMAX + .3), 2.1, filt('bandpass', 450, 3, g)); }
  { const g = hold(T(T_CLIMAX + .5), 1.2, .025, MK.crack - T_CLIMAX - .5, .1, sfx), o = osc('sine', 2093, T(T_CLIMAX + .5), T(MK.crack + .2), g); o.frequency.linearRampToValueAtTime(2140, T(MK.crack)); const l = ac.createOscillator(); l.frequency.value = 9; const lg = ac.createGain(); lg.gain.value = 12; l.connect(lg); lg.connect(o.frequency); l.start(T(T_CLIMAX + .5)); l.stop(T(MK.crack + .2)); }
  for (let i = 0; i < 14; i++) { const x = MK.crack + i * .022 + hash(i) * .02; noise(WHITE, T(x), .05, filt('highpass', 2500 + hash(i * 3) * 3000, .7, env(T(x), .001, .3 - i * .015, .04, sfx))); }
  for (let i = 0; i < 8; i++) osc('sine', 4200 + hash(i) * 2400, T(MK.crack + .1 + i * .05), T(MK.crack + .5 + i * .05), env(T(MK.crack + .1 + i * .05), .001, .03, .3, sfx));
  for (let i = 0; i < 26; i++) { const x = NOTES[14][0] + hash(i * 7) * (40 - NOTES[14][0]); noise(WHITE, T(x), .04, filt('bandpass', 3000, 1, env(T(x), .001, .04, .03, sfx))); osc('square', 1800, T(x + .03), T(x + .05), env(T(x + .03), .001, .01, .015, sfx)); }
  // applause + cheers
  for (let i = 0; i < 420; i++) { const x = T_END_SING + .25 + Math.pow(hash(i * 1.3), .8) * (40 - T_END_SING - .3); noise(WHITE, T(x), .03, filt('bandpass', 1200 + hash(i * 5) * 1800, 1.4, env(T(x), .001, .05 + hash(i * 9) * .05, .02, amb))); }
  { const g = hold(T(T_END_SING + .5), .2, .04, 1.2, .4, sfx), o = osc('sine', 1600, T(T_END_SING + .5), T(T_END_SING + 2.4), g); o.frequency.linearRampToValueAtTime(2400, T(T_END_SING + .8)); o.frequency.linearRampToValueAtTime(1700, T(T_END_SING + 1.6)); }
  for (const x of [37.45]) { osc('sine', 3200, T(x), T(x + .15), env(T(x), .002, .05, .12, sfx)); osc('sine', 4800, T(x + .04), T(x + .2), env(T(x + .04), .002, .03, .14, sfx)); }
  if (!NOCAP) for (const [t0, , , , t2] of CAPS) for (const x of [t0, t2]) { const o = osc('sine', 900, T(x), T(x + .08), env(T(x), .002, .04, .06, sfx)); o.frequency.exponentialRampToValueAtTime(1500, T(x + .05)); }
  return master;
}

// ---- real-voice mode: the recording carries the music; museum SFX follow the analysed markers ----
function buildVoiceShow(ac, T0, A) {
  const { master, rev, sfx, amb, osc, env, hold, noise, filt, WHITE, T } = A, M = MK;
  master.gain.cancelScheduledValues(T(0)); master.gain.setValueAtTime(.95, T(0)); master.gain.setValueAtTime(.95, T(M.dur - .8)); master.gain.linearRampToValueAtTime(0, T(M.dur + .6));
  const src = ac.createBufferSource(); src.buffer = VOICE.buf;
  const vg = ac.createGain(); vg.gain.value = 1; src.connect(vg); vg.connect(master);
  const vs = ac.createGain(); vs.gain.value = .12; vg.connect(vs); vs.connect(rev);
  src.start(T(0));
  if (M.sing > 1.2) { const d = Math.min(3.6, M.sing - .6), g = hold(T(0), .3, .2, d - .35, .35, amb), bp = filt('bandpass', 650, .6, g); noise(WHITE, T(0), d + .1, bp); }
  if (M.sing > 2.5) { const g = hold(T(M.sing - 2.1), .25, .1, .5, .4, sfx); noise(WHITE, T(M.sing - 2.1), 1.2, filt('bandpass', 450, 3, g)); }
  { const g = hold(T(M.climax + .3), .4, .07, 1.0, .6, sfx); noise(WHITE, T(M.climax + .3), 2.1, filt('bandpass', 450, 3, g)); }
  if (M.crack > M.climax + .6) { const g = hold(T(M.climax + .5), .8, .02, M.crack - M.climax - .5, .1, sfx), o = osc('sine', 2093, T(M.climax + .5), T(M.crack + .2), g); o.frequency.linearRampToValueAtTime(2140, T(M.crack)); }
  for (let i = 0; i < 14; i++) { const x = M.crack + i * .022 + hash(i) * .02; noise(WHITE, T(x), .05, filt('highpass', 2500 + hash(i * 3) * 3000, .7, env(T(x), .001, .3 - i * .015, .04, sfx))); }
  for (let i = 0; i < 8; i++) osc('sine', 4200 + hash(i) * 2400, T(M.crack + .1 + i * .05), T(M.crack + .5 + i * .05), env(T(M.crack + .1 + i * .05), .001, .03, .3, sfx));
  for (let i = 0; i < 26; i++) { const x = M.react + hash(i * 7) * (M.dur - M.react); noise(WHITE, T(x), .04, filt('bandpass', 3000, 1, env(T(x), .001, .03, .03, sfx))); }
  for (let i = 0; i < 420; i++) { const x = M.end + .25 + Math.pow(hash(i * 1.3), .8) * (M.dur - M.end - .3); noise(WHITE, T(x), .03, filt('bandpass', 1200 + hash(i * 5) * 1800, 1.4, env(T(x), .001, .05 + hash(i * 9) * .05, .02, amb))); }
  osc('sine', 3200, T(M.end + .9), T(M.end + 1.05), env(T(M.end + .9), .002, .05, .12, sfx));
  if (!NOCAP) for (const [t0, , , , t2] of CAPS) for (const x of [t0, t2]) { const o = osc('sine', 900, T(x), T(x + .08), env(T(x), .002, .04, .06, sfx)); o.frequency.exponentialRampToValueAtTime(1500, T(x + .05)); }
  return master;
}
// ================= PLAYBACK =================
const pt_fonts = (document.fonts && document.fonts.load) ? document.fonts.load('80px CapFont') : Promise.resolve();
const pt_voice = (typeof VOICE_B64 === 'string' && VOICE_B64) ? loadVoice(b64ToBuf(VOICE_B64)).catch(e => { console.warn('voice', e); return false; }) : Promise.resolve(false);
window.__fontsReady = Promise.all([pt_fonts.catch(() => null), pt_voice]);
const overlay = document.getElementById('overlay'), bar = document.getElementById('bar'), pauseTag = document.getElementById('pause');
let ac = null, T0 = 0, perf0 = 0, pausedAt = 0, state = 'idle', lastFrame = -1;

function now() {
  if (state === 'paused') return pausedAt;
  if (ac) return ac.currentTime - T0;
  return (performance.now() - perf0) / 1000;
}
async function start() {
  if (ac) { try { ac.close(); } catch (e) { } ac = null; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC({ latencyHint: 'playback' });
    if (ac.state === 'suspended') await ac.resume();
    T0 = ac.currentTime + .15;
    buildAudio(ac, T0);
  } catch (e) { console.warn('audio unavailable', e); ac = null; }
  perf0 = performance.now() + 150;
  state = 'playing'; lastFrame = -1;
  overlay.classList.add('hide'); pauseTag.classList.remove('on');
}
function togglePause() {
  if (state === 'playing') {
    pausedAt = now(); state = 'paused'; pauseTag.classList.add('on');
    if (ac) ac.suspend();
  } else if (state === 'paused') {
    state = 'playing'; pauseTag.classList.remove('on');
    if (ac) ac.resume(); else perf0 = performance.now() - pausedAt * 1000;
  }
}
function finish() {
  state = 'ended';
  overlay.querySelector('h1').textContent = 'Brava!';
  overlay.querySelector('.sub').textContent = '모나리자, 오늘 첫 공연 · 앙코르는 500년 뒤에';
  overlay.querySelector('#play').textContent = '↺ 다시 보기';
  overlay.classList.remove('hide');
}

function loop() {
  requestAnimationFrame(loop);
  if (state !== 'playing') return;
  const t = now();
  if (t < 0) return;
  const f = Math.floor(t * 24);
  if (f !== lastFrame) { lastFrame = f; render(t); bar.style.width = (clamp(t / DUR) * 100) + '%'; }
  if (t >= DUR + .6) { render(DUR); finish(); }
}

overlay.addEventListener('click', e => { if (e.target.closest('#voiceBtn')) return; if (state === 'idle' || state === 'ended') start(); });
// bring your own recording: lip-sync and the whole show re-time themselves to it
const vIn = document.getElementById('voiceFile');
document.getElementById('voiceBtn').addEventListener('click', e => { e.stopPropagation(); vIn.click(); });
vIn.addEventListener('change', async () => {
  const f = vIn.files && vIn.files[0]; if (!f) return;
  const b = document.getElementById('voiceBtn'); b.textContent = '분석 중…';
  try { await loadVoice(await f.arrayBuffer()); b.textContent = '🎤 ' + f.name.slice(0, 24); render(MK.climax + .5); start(); }
  catch (err) { console.warn(err); b.textContent = '이 파일은 읽을 수 없어요'; }
});
overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (state === 'idle' || state === 'ended') start(); } });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'playing' || state === 'paused')) { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') start();
  else if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); }
});
document.getElementById('stage').addEventListener('click', () => { if (state === 'playing' || state === 'paused') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// poster frame behind the start screen; window.__render(t) lets you scrub a still for inspection
window.__render = t => render(t);
const poster = () => render(15.6);
window.__fontsReady.then(poster, poster);
requestAnimationFrame(loop);
