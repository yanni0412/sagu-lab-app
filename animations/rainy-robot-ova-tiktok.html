<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잠드는 언덕 · 9:16</title>
<style>
  :root{
    --bg:#07060a; --fg:#f3e6cf; --dim:#a99a86; --accent:#ffad66;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP","Noto Serif KR","Nanum Myeongjo",serif;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--serif)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
  body.portrait canvas{width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 55%,rgba(20,16,30,.55),rgba(0,0,0,.88) 70%);cursor:pointer;
    transition:opacity .9s ease;text-align:center;padding:16px;box-sizing:border-box;user-select:none}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-weight:600;font-size:clamp(34px,7vw,72px);letter-spacing:.18em;
    text-shadow:0 0 18px rgba(255,190,120,.35),0 2px 0 #000}
  #overlay .sub{color:var(--dim);font-size:clamp(13px,2.2vw,18px);letter-spacing:.3em}
  #overlay button{margin-top:18px;font:inherit;font-size:clamp(15px,2.4vw,19px);letter-spacing:.2em;color:#1b1220;
    background:var(--accent);border:0;border-radius:999px;padding:12px 30px;cursor:pointer;
    box-shadow:0 0 0 4px rgba(255,173,102,.18),0 8px 30px rgba(255,140,60,.25)}
  #overlay button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay .hint{color:#7d7366;font-size:12px;letter-spacing:.12em;margin-top:6px}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#6a5acd,#ff8a5c,#ffd27a);
    opacity:.0;transition:opacity .4s}
  body:hover #bar{opacity:.75}
  #pause{position:fixed;top:14px;right:16px;font-size:13px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .3s}
  #pause.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720" aria-label="80초 애니메이션: 잠드는 언덕"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="재생">
  <h1>ねむりの丘</h1>
  <div class="sub">잠드는 언덕 · 1990s OVA STYLE · 80″</div>
  <button id="play" type="button">▶ 재생 (소리 켜짐)</button>
  <div class="hint">화면 터치 · Space 일시정지 · R 처음부터 · F 전체화면</div>
</div>
<div id="bar"></div>
<div id="pause">PAUSE</div>
<script>
"use strict";
// ================= CORE: math, color, noise, drawing helpers =================
const W = 1080, H = 1920, DUR = 80;
const PT = H > W, V = (l, p) => PT ? p : l;   // landscape / portrait (9:16) layouts
const TAU = Math.PI * 2;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
document.body.classList.toggle('portrait', PT);
const ctx = cv.getContext('2d');
const INK = '#1b1220';

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a));
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// piecewise keyframes [[t,v],...] with smoothstep between keys
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, ss(t0, t1, t));
    }
  }
  return keys[keys.length - 1][1];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// deterministic hash -> [0,1)
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) p[i] = r();
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return lerp(p[i & 1023], p[(i + 1) & 1023], u);
  };
}
function fbm(n, x, oct = 4) {
  let s = 0, a = .5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); norm += a; a *= .5; f *= 2.03; }
  return s / norm;
}

// ---- color ----
const _pc = new Map();
function P(c) {
  if (Array.isArray(c)) return c;
  let v = _pc.get(c);
  if (!v) {
    if (c[0] === '#') {
      const h = c.slice(1);
      v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    } else { // "rgb(r,g,b)" / "rgba(...)" produced by mix()/rgb()
      const m = c.match(/[\d.]+/g).map(Number);
      v = [m[0], m[1], m[2]];
    }
    if (_pc.size > 4000) _pc.clear();
    _pc.set(c, v);
  }
  return v;
}
const mixA = (a, b, t) => { a = P(a); b = P(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; };
const rgb = (a, al) => al === undefined
  ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`
  : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const mix = (a, b, t, al) => rgb(mixA(a, b, t), al);
function stoneOf(c) {
  const a = P(c), l = (a[0] * .3 + a[1] * .59 + a[2] * .11) / 255;
  const v = lerp(78, 168, l);
  return [v + 6, v + 3, v - 2];
}
function mulA(a, b) { a = P(a); b = P(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; }

// ---- paths ----
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function capsule(c, x1, y1, x2, y2, r) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.beginPath();
  c.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2);
  c.arc(x1, y1, r, a + Math.PI / 2, a + Math.PI * 1.5);
  c.closePath();
}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); }

// Cel shading: fill shade, clip, then fill base shifted toward light -> hard-edged shadow rim.
function cel(c, build, base, shade, lx, ly, lw, ink = INK) {
  c.save();
  build(c); c.fillStyle = shade; c.fill();
  c.clip();
  c.translate(lx, ly); build(c); c.fillStyle = base; c.fill();
  c.restore();
  if (lw > 0) { build(c); c.lineWidth = lw; c.strokeStyle = ink; c.stroke(); }
}

function camera(c, cx, cy, z) { c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cx, -cy); }

// ---- offscreen buffers ----
function mk(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; }
const rimBuf = mk(W, H), rimCtx = rimBuf.getContext('2d');
const bloomBuf = mk(W / 8 | 0, H / 8 | 0), bloomCtx = bloomBuf.getContext('2d');
const bloomBuf2 = mk(W / 4 | 0, H / 4 | 0), bloomCtx2 = bloomBuf2.getContext('2d');
const BW = bloomBuf.width, BH = bloomBuf.height, BW2 = bloomBuf2.width, BH2 = bloomBuf2.height;

// draw something with a backlit rim (silhouette offset copies under the real drawing)
function rimmed(c, drawFn, rimCol, amt, offs) {
  if (amt > 0.01) {
    const m = c.getTransform();
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-over';
    rimCtx.clearRect(0, 0, W, H);
    rimCtx.setTransform(m);
    drawFn(rimCtx);
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-in';
    rimCtx.fillStyle = rimCol; rimCtx.fillRect(0, 0, W, H);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = amt;
    for (const [dx, dy] of offs) c.drawImage(rimBuf, dx, dy);
    c.restore();
  }
  drawFn(c);
}

// ---- film grain, vignette ----
const grains = [];
(function () {
  const r = mulberry32(77);
  for (let k = 0; k < 4; k++) {
    const g = mk(256, 256), gc = g.getContext('2d'), id = gc.createImageData(256, 256);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = 128 + (r() - .5) * 255 * (r() < .5 ? .6 : 1);
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
    }
    gc.putImageData(id, 0, 0);
    grains.push(ctx.createPattern(g, 'repeat'));
  }
})();
const vignette = (function () {
  const v = mk(W, H), vc = v.getContext('2d');
  const g = vc.createRadialGradient(W / 2, H / 2, V(H * .35, W * .3), W / 2, H / 2, V(H * .95, Math.hypot(W, H) / 2));
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.7, 'rgba(10,4,18,.28)'); g.addColorStop(1, 'rgba(6,2,10,.78)');
  vc.fillStyle = g; vc.fillRect(0, 0, W, H);
  return v;
})();

function postFX(t, frame, opt) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  // halation / bloom: downsample, square (multiply) to keep highlights, add back
  const bs = opt.bloom ?? .5;
  if (bs > 0) {
    bloomCtx2.globalCompositeOperation = 'source-over';
    bloomCtx2.drawImage(cv, 0, 0, BW2, BH2);
    bloomCtx2.globalCompositeOperation = 'multiply';
    bloomCtx2.drawImage(bloomBuf2, 0, 0);
    bloomCtx2.drawImage(bloomBuf2, 0, 0);
    bloomCtx.globalCompositeOperation = 'source-over';
    bloomCtx.drawImage(bloomBuf2, 0, 0, BW, BH);
    c.save();
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = bs * .55;
    c.drawImage(bloomBuf, 0, 0, W, H);
    c.globalAlpha = bs * .35;
    c.drawImage(bloomBuf2, 0, 0, W, H);
    c.restore();
  }
  // vignette
  c.drawImage(vignette, 0, 0);
  // grain
  c.save();
  c.globalCompositeOperation = 'overlay';
  c.globalAlpha = opt.grain ?? .14;
  c.fillStyle = grains[frame & 3];
  c.translate((hash(frame) * 256) | 0, (hash(frame + 9) * 256) | 0);
  c.fillRect(-256, -256, W + 512, H + 512);
  c.restore();
  // film dust specks & a rare hair
  c.save();
  for (let i = 0; i < 3; i++) {
    const h = hash(frame * 7.3 + i * 13.1);
    if (h < .32) {
      c.fillStyle = h < .16 ? 'rgba(10,6,12,.55)' : 'rgba(255,248,230,.35)';
      circ(c, hash(frame + i * 3.7) * W, hash(frame * 1.7 + i) * H, 1 + hash(frame + i) * 2.2); c.fill();
    }
  }
  if (hash(frame * .37) < .04) {
    c.strokeStyle = 'rgba(15,8,14,.35)'; c.lineWidth = 1;
    const x = hash(frame * 3.1) * W, y = hash(frame * 5.3) * H;
    c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + 20, y + 10, x - 10, y + 30, x + 14, y + 46); c.stroke();
  }
  c.restore();
  // fades
  if (opt.fade > 0) { c.fillStyle = `rgba(0,0,0,${opt.fade})`; c.fillRect(0, 0, W, H); }
  if (opt.white > 0) { c.fillStyle = `rgba(255,250,240,${opt.white})`; c.fillRect(0, 0, W, H); }
}
// ================= CHARACTERS: toy robot & little bird =================
const RC = {
  red: '#c64a3b', redS: '#7a2832', cream: '#eadcb6', creamS: '#a48e72',
  metal: '#959caa', metalS: '#5a5e70', visor: '#2b2434', eyeOff: '#3e3631', eyeOn: '#ffd166',
  brass: '#d4a84a', brassS: '#8a6526', rust: '#8e4a2a', moss: '#6a8a3e', mossS: '#3f5a2a', sole: '#3a2b2b'
};
const partStone = (st, h) => clamp(st * 1.7 - h * .7);

function drawRobot(c, R) {
  const s = R.s, f = R.face ?? 0, fx = f * 6, st = R.stone || 0, back = !!R.back;
  const base = c.getTransform(), inv = base.inverse();
  const amb = R.amb || '#000000', ambA = R.ambA || 0;
  const col = (hx, h) => {
    let a = P(hx); const k = partStone(st, h);
    if (k > 0) a = mixA(a, stoneOf(a), k);
    if (ambA > 0) a = mixA(a, amb, ambA);
    return rgb(a);
  };
  const lx = R.lx ?? -4, ly = R.ly ?? -4;
  const lw = Math.max(1.3, 2.3 * Math.sqrt(s)) / s;
  const ph = R.walk || 0, wa = R.walkAmt || 0, sit = R.sit || 0, sl = R.slump || 0;
  const out = R.out || (R.out = {});
  const here = (x, y) => { const p = inv.multiply(c.getTransform()).transformPoint(new DOMPoint(x, y)); return { x: p.x, y: p.y }; };
  const crackA = clamp((st - .35) / .5);

  c.save();
  c.translate(R.x + (R.jx || 0), R.y);
  c.scale(s, s);
  c.rotate(R.lean || 0);
  const bob = -wa * Math.abs(Math.sin(ph)) * 3.2;
  const hipY = -30 + sit * 22;

  // ---- legs ----
  const legs = f === 0 ? [-1, 1] : [-f, f];
  if (!(back && sit > .5)) for (const i of legs) {
    const p = ph + (i < 0 ? Math.PI : 0);
    const lift = wa * Math.max(0, Math.sin(p)) * 9;
    const fwd = wa * Math.cos(p) * 8 * (f || 1);
    const legX = f === 0 ? i * 15 : i * 12 + f * 2;
    const hx = legX, hy = hipY + bob;
    let fxp = legX + fwd + sit * f * 28, fyp = -lift - 5;
    if (f === 0 && sit > 0) fxp = legX * (1 + .35 * sit);
    const far = f !== 0 && i === -f;
    const mc = far ? mixA(col(RC.metal, .1), [30, 20, 40], .25) : P(col(RC.metal, .1));
    cel(c, k => capsule(k, hx, hy, fxp, fyp, 7), rgb(mc), col(RC.metalS, .1), lx, ly, lw);
    if (f === 0 && sit > .5) {
      cel(c, k => ell(k, fxp, fyp + 2, 13, 10), col(RC.red, 0), col(RC.redS, 0), lx, ly, lw);
      ell(c, fxp, fyp + 3, 8, 6); c.fillStyle = col(RC.sole, 0); c.fill();
    } else {
      cel(c, k => rrect(k, fxp - 13 + f * 4, fyp - 5, 26, 11, 5), col(RC.red, 0), col(RC.redS, 0), lx, ly, lw);
    }
  }

  // ---- upper body ----
  c.save();
  c.translate(0, hipY + bob);
  c.rotate((R.bodyRot || 0) + sl * .09);
  const key = R.key || 0;
  const swing = -wa * .35 * Math.cos(ph) * (f || 1);
  const drawArm = (side, a) => {
    a += swing;
    const sx = f === 0 || back ? side * 37 : (side === f ? f * 32 : -f * 29), sy = -54;
    const L = 34, ex = sx + side * Math.sin(a) * L, ey = sy + Math.cos(a) * L;
    const far = f !== 0 && !back && side === -f;
    const mc = far ? rgb(mixA(col(RC.metal, .5), [30, 20, 40], .25)) : col(RC.metal, .5);
    cel(c, k => capsule(k, sx, sy, ex, ey, 6.5), mc, col(RC.metalS, .5), lx, ly, lw);
    cel(c, k => circ(k, ex, ey, 7.5), col(RC.red, .5), col(RC.redS, .5), lx, ly, lw);
    c.beginPath(); c.moveTo(ex + side * 2, ey + 2); c.lineTo(ex + side * 6, ey + 7); c.lineWidth = lw * 1.2; c.strokeStyle = INK; c.stroke();
    if (side === 1) out.handR = here(ex, ey - 6);
  };
  const drawKey = (kx, ky, flat) => {
    c.save(); c.translate(kx, ky);
    if (flat) {
      cel(c, k => rrect(k, -f * 2 - 4, -3, 14, 6, 2), col(RC.brass, .4), col(RC.brassS, .4), lx, ly, lw);
      const cs = Math.cos(key), hx = -f * 14;
      for (const sg of [-1, 1]) cel(c, k => ell(k, hx, sg * 8 * cs, 5, Math.abs(cs) * 8 + 1.5), col(RC.brass, .4), col(RC.brassS, .4), lx, ly, lw);
      cel(c, k => circ(k, hx, 0, 3.5), col(RC.brass, .4), col(RC.brassS, .4), lx, ly, lw);
    } else {
      c.rotate(key);
      for (const sg of [-1, 1]) cel(c, k => ell(k, sg * 11, 0, 10, 6.5), col(RC.brass, .4), col(RC.brassS, .4), lx, ly, lw);
      cel(c, k => circ(k, 0, 0, 5), col(RC.brass, .4), col(RC.brassS, .4), lx, ly, lw);
    }
    c.restore();
  };

  if (f !== 0 && !back) { drawKey(-f * 40, -34, true); drawArm(-f, (f > 0 ? R.armL : R.armR) ?? .12); }
  if (f === 0 && !back) { drawArm(-1, R.armL ?? .12); }
  // body
  cel(c, k => rrect(k, -34, -62, 68, 62, 10), col(RC.red, .4), col(RC.redS, .4), lx, ly, lw);
  // rust & belt
  c.fillStyle = col(RC.rust, .3);
  for (const [rx, ry, rr] of [[24, -16, 4], [-25, -50, 3], [19, -57, 2.4], [-14, -6, 2.8]]) { ell(c, rx, ry, rr * 1.3, rr); c.globalAlpha = .55; c.fill(); }
  c.globalAlpha = 1;
  c.beginPath(); c.moveTo(-34, -14); c.lineTo(34, -14); c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
  for (const bx of [-27, 27]) { circ(c, bx, -8, 2.2); c.fillStyle = col(RC.metal, .3); c.fill(); }
  if (!back) {
    cel(c, k => rrect(k, -22 + fx, -54, 44, 32, 5), col(RC.cream, .45), col(RC.creamS, .45), lx * .6, ly * .6, lw);
    cel(c, k => circ(k, -8 + fx, -38, 8), col(RC.metal, .45), col(RC.metalS, .45), lx * .5, ly * .5, lw);
    const na = -1.2 + (R.eye || 0) * 1.6 + Math.sin((R.walk || 0) * 2) * .1 * wa;
    c.beginPath(); c.moveTo(-8 + fx, -38); c.lineTo(-8 + fx + Math.cos(na) * 6, -38 + Math.sin(na) * 6); c.lineWidth = lw; c.stroke();
    const lampOn = (R.eye || 0) * (1 - partStone(st, .45));
    for (const [i, lc] of [[0, '#ff6a4a'], [1, '#7dff9a']]) {
      circ(c, 7 + fx + i * 7, -46, 3);
      c.fillStyle = mix(col('#4a3a3a', .45), lc, lampOn * (i === 0 ? 1 : .5 + .5 * Math.sin((R.t || 0) * 6)));
      c.fill(); c.lineWidth = lw * .8; c.stroke();
    }
  } else {
    c.lineWidth = lw; c.strokeStyle = INK;
    for (const vy of [-52, -47, -42]) { c.beginPath(); c.moveTo(-15, vy); c.lineTo(15, vy); c.stroke(); }
    drawKey(0, -28, false);
  }
  if (crackA > 0) {
    c.save(); c.globalAlpha = crackA; c.strokeStyle = 'rgba(30,24,28,.85)'; c.lineWidth = lw * .8;
    c.beginPath(); c.moveTo(-30, -4); c.lineTo(-20, -18); c.lineTo(-24, -30); c.lineTo(-12, -44);
    c.moveTo(30, -40); c.lineTo(22, -30); c.lineTo(26, -20); c.moveTo(4, -2); c.lineTo(8, -12); c.stroke();
    c.restore();
  }
  // near arm
  if (f !== 0 && !back) drawArm(f, (f > 0 ? R.armR : R.armL) ?? .12);
  if (f === 0 || back) drawArm(1, R.armR ?? .12);
  if (back) drawArm(-1, R.armL ?? .12);
  out.shoulder = here(f !== 0 && !back ? f * 22 : 24, -63);
  out.body = here(0, -30);

  // neck
  cel(c, k => rrect(k, -8, -73, 16, 13, 3), col(RC.metal, .7), col(RC.metalS, .7), lx, ly, lw);

  // ---- head ----
  c.save();
  c.translate(0, -70 - (R.headLift || 0) + (R.headDrop || 0));
  c.rotate(R.headRot || 0);

const BC = { back: '#7d5437', backS: '#4c2f20', belly: '#f2e4c7', bellyS: '#c3ad8b', wing: '#5d3b27', wingS: '#3a2418', beak: '#e7a63c', leg: '#b07a50' };

function drawBird(c, B) {
  const s = B.s || 1, f = B.face || 1;
  const ambA = B.ambA || 0, amb = B.amb || '#000000';
  const col = hx => ambA > 0 ? mix(hx, amb, ambA) : hx;

  c.save();
  c.translate(B.x, B.y);
  c.scale(s * f, s);
  c.rotate(B.rot || 0);
  if (!B.fly) {
    const pk = B.peck || 0, bob = B.bob || 0;
    c.translate(0, bob);
    // tail
    c.beginPath(); c.moveTo(-7, -9); c.lineTo(-22, -4 + (B.tail || 0)); c.lineTo(-20, -1 + (B.tail || 0)); c.lineTo(-5, -5); c.closePath();

    // legs
    c.beginPath(); c.moveTo(-2, -4); c.lineTo(-3, 0); c.moveTo(3, -4); c.lineTo(3, 0);
    c.lineWidth = lw * 1.1; c.strokeStyle = col(BC.leg); c.stroke();

    const body = k => ell(k, 0, -11, 12, 9.5, -.15);
    cel(c, body, col(BC.back), col(BC.backS), lx, ly, 0);
    c.save(); body(c); c.clip();
    cel(c, k => ell(k, 4, -6, 9, 7), col(BC.belly), col(BC.bellyS), lx, ly, 0);
    c.restore();
    body(c); c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
    // wing (raised when spreading)
    const sp = B.spread || 0;
    c.save(); c.translate(-2, -13); c.rotate(-.25 - sp * 1.3 + Math.sin((B.flapT || 0) * 30) * sp * .5);
    cel(c, k => ell(k, -5, 0, 9 + sp * 6, 5), col(BC.wing), col(BC.wingS), lx, ly, lw);
    c.restore();
    // head
    c.save();
    c.translate(7 + pk * 4, -17 + pk * 7); c.rotate((B.headRot || 0) + pk * .6);
    cel(c, k => circ(k, 0, -2, 7), col(BC.back), col(BC.backS), lx, ly, lw);
    c.save(); circ(c, 0, -2, 7); c.clip(); ell(c, 2.5, 3, 6, 4); c.fillStyle = col(BC.belly); c.fill(); c.restore();
    circ(c, 0, -2, 7); c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
    c.beginPath(); c.moveTo(6, -3.5); c.lineTo(11, -1.8); c.lineTo(6, -.3); c.closePath();
    c.fillStyle = col(BC.beak); c.fill(); c.lineWidth = lw * .8; c.stroke();
    if (B.chirp) { c.beginPath(); c.moveTo(6.5, -1.8); c.lineTo(10.5, 1.2); c.lineTo(6, .6); c.fillStyle = col(BC.beak); c.fill(); c.stroke(); }
    circ(c, 3, -3, 1.7); c.fillStyle = INK; c.fill();
    circ(c, 3.5, -3.6, .6); c.fillStyle = '#fff'; c.fill();
    c.restore();
    // wet droplets on feathers
    if (B.wet > 0) {
      c.fillStyle = `rgba(200,225,255,${.7 * B.wet})`;
      for (const [dx, dy] of [[-6, -16], [2, -19], [-9, -9], [5, -14]]) { circ(c, dx, dy, 1.1); c.fill(); }
    }
  } else {
    const fl = Math.sin(B.flap || 0);

      const ty = -3 - 24 * fl, tx = -9 + Math.abs(fl) * 2;
      c.beginPath(); c.moveTo(5 + off, -3); c.quadraticCurveTo(2 + off, ty * .6 - 2, tx + off, ty);
      c.quadraticCurveTo(-4 + off, ty * .4, -7 + off, -2); c.closePath();

    };

    c.beginPath(); c.moveTo(-9, -1); c.lineTo(-22, -4); c.lineTo(-22, 2); c.closePath();
    c.fillStyle = col(BC.wingS); c.fill(); c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
    const body = k => ell(k, 0, 0, 11, 6.5, -.08);
    cel(c, body, col(BC.back), col(BC.backS), lx, ly, 0);

    wing(false, 0);
  }

}

function roomDust(c, t, k) {

const N1 = makeNoise(11), N2 = makeNoise(23), N3 = makeNoise(37), N4 = makeNoise(51);

function drawSun(c, x, y, r, pal, a = 1) {

function cloudPath(k, x, y, w, h, seed) {
  k.beginPath();
  const n = Math.max(3, Math.round(w / (h * .9)));
  for (let i = 0; i < n; i++) {
    const u = (i + .5) / n, r = h * (.45 + .55 * Math.sin(u * Math.PI)) * (.75 + hash(seed + i) * .5);
    const cx = x + u * w, cy = y - r * .55;
    k.moveTo(cx + r, cy); k.arc(cx, cy, r, 0, TAU);
  }
  k.moveTo(x, y); k.rect(x + h * .2, y - h * .5, w - h * .4, h * .5);
}
function drawCloud(c, x, y, w, h, seed, lit, shade, ox = 0, oy = 6, a = 1) {

  gl.addColorStop(0, rgb(lit)); gl.addColorStop(1, mix(lit, shade, .38));
  const gs = c.createLinearGradient(0, y - h * 1.3, 0, y);
  gs.addColorStop(0, mix(shade, lit, .25)); gs.addColorStop(1, rgb(shade));
  cel(c, k => cloudPath(k, x, y, w, h, seed), gl, gs, ox, -oy, 0);

}

// distant ridge in screen space with parallax
function ridge(c, off, baseY, amp, freq, noise, color, step = 6) {
  c.beginPath(); c.moveTo(-10, H + 10);
  for (let sx = -10; sx <= W + 10; sx += step) {
    const wx = sx + off;
    const v = fbm(noise, wx * freq, 5);
    c.lineTo(sx, baseY - (v - .3) * amp - Math.pow(Math.max(0, v - .55), 2) * amp * 1.6);
  }

  c.fillStyle = color; c.fill();
}

function drawStars(c, a, t, maxY = 360) {

}

function drawRainbow(c, cx, cy, r, a) {
  if (a <= 0) return;

  const cols = ['#ff5a5a', '#ffa04a', '#ffe66a', '#7ee07a', '#5aa8ff', '#9a7aff'];

}

function godRays(c, x, y, a, t, col = '#ffe2a8') {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 8; i++) {
    const ang = Math.PI * .55 + i * .16 + Math.sin(t * .2 + i) * .02, sp = .035 + hash(i) * .03;
    c.fillStyle = rgb(P(col), a * (.04 + hash(i + 3) * .05));

    c.lineTo(x + Math.cos(ang - sp) * 1800, y + Math.sin(ang - sp) * 1800);
    c.lineTo(x + Math.cos(ang + sp) * 1800, y + Math.sin(ang + sp) * 1800); c.fill();
  }

}

function lensFlare(c, sx, sy, a) {
  if (a <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  const dx = W / 2 - sx, dy = H / 2 - sy;
  const ghosts = [[.35, 14, '#ffb070', .22], [.6, 34, '#7fd0c8', .10], [.85, 9, '#ffe0a0', .3], [1.25, 52, '#b080ff', .08], [1.55, 22, '#ff9a6a', .14], [1.9, 70, '#80b0ff', .06]];
  for (const [k, r, cl, al] of ghosts) {
    const x = sx + dx * k, y = sy + dy * k;

    c.beginPath();
    for (let i = 0; i < 6; i++) { const an = i / 6 * TAU + .3; c.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); }
    c.closePath(); c.fill();
  }

  g.addColorStop(0, 'rgba(255,170,110,0)'); g.addColorStop(.5, `rgba(255,220,170,${.35 * a})`); g.addColorStop(1, 'rgba(255,170,110,0)');
  c.fillStyle = g; c.fillRect(sx - 500, sy - 2, 1000, 4);

}

// grass tuft at (x,y) in world units
function tuft(c, x, y, h, sway, colA, colB, lw = 2) {
  c.lineCap = 'round';
  for (let j = 0; j < 4; j++) {
    const ox = (j - 1.5) * 3, hh = h * (.6 + hash(x * .13 + j) * .6), bend = sway * (.7 + j * .15) + (j - 1.5) * 2;
    c.strokeStyle = j % 2 ? colA : colB; c.lineWidth = lw;
    c.beginPath(); c.moveTo(x + ox, y + 2); c.quadraticCurveTo(x + ox + bend * .3, y - hh * .6, x + ox + bend, y - hh); c.stroke();
  }
}

// The near slope (world space). g(x) gives the ground height.
function drawSlope(c, t, o) {
  const pal = o.pal, x0 = o.x0, x1 = o.x1, g = o.g;
  const base = o.rock ? mixA('#5a4a52', pal.cShade, .35) : mixA(mixA('#4b7536', '#2c3040', ss(.45, .95, pal.k) * .75), pal.mid, .12);
  const lit = o.rock ? mixA('#a08a7a', pal.cLit, .5) : mixA('#a9cb60', '#ffb46c', ss(.4, .85, pal.k));
  const build = k => {
    k.beginPath(); k.moveTo(x0, g(x0) + 900);
    for (let x = x0; x <= x1; x += 8) k.lineTo(x, g(x));
    k.lineTo(x1, g(x1) + 900); k.closePath();
  };
  cel(c, build, rgb(base), rgb(lit), 0, 9, 0);
  // painted texture strokes
  c.save(); build(c); c.clip();
  const yTop = Math.min(g(x0), g(x1)), sh = c.createLinearGradient(0, yTop, 0, yTop + 900);
  sh.addColorStop(0, 'rgba(255,240,200,0)'); sh.addColorStop(.35, rgb(mixA(base, [10, 14, 30], .5), .3)); sh.addColorStop(1, rgb(mixA(base, [10, 8, 24], .6), .7));
  c.fillStyle = sh; c.fillRect(x0, yTop, x1 - x0, 900);
  c.strokeStyle = rgb(mixA(base, [0, 0, 0], .25)); c.lineWidth = 3; c.lineCap = 'round';
  for (let x = Math.floor(x0 / 37) * 37; x < x1; x += 37) {
    const d = 30 + hash(x) * 200, y = g(x) + d;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + 14 + hash(x + 1) * 20, y - 3); c.stroke();
  }
  // rocks
  for (let x = Math.floor(x0 / 260) * 260; x < x1; x += 260) {
    const rx = x + hash(x * .7) * 120, ry = g(rx) + 8, rs = 10 + hash(x) * 18;
    cel(c, k => { k.beginPath(); k.moveTo(rx - rs, ry + 4); k.quadraticCurveTo(rx - rs * .8, ry - rs * .9, rx, ry - rs); k.quadraticCurveTo(rx + rs, ry - rs * .7, rx + rs * 1.1, ry + 4); k.closePath(); },
      rgb(mixA('#8a8590', lit, .3)), rgb(mixA('#4a4652', base, .3)), -3, -3, 1.4, 'rgba(27,18,32,.6)');
  }
  c.restore();
  // tufts and flowers along the ridge line
  const wind = Math.sin(t * 1.6) * 4 + Math.sin(t * 3.7) * 2 + (o.wind || 6);
  const ca = rgb(mixA(lit, base, .2)), cb = rgb(mixA(base, lit, .35));
  for (let x = Math.floor(x0 / 16) * 16; x < x1; x += 16) {
    if (hash(x * .31) < .35) continue;
    const y = g(x) + 3, sw = wind + Math.sin(t * 2.4 + x * .03) * 3;
    tuft(c, x, y, 10 + hash(x) * 16, sw, ca, cb, 2);
    if (!o.rock && hash(x * 1.9) < .12) {
      c.fillStyle = hash(x) < .5 ? '#fff6e0' : '#ffd25a';
      circ(c, x + sw * .9, y - 14 - hash(x) * 6, 2.4); c.fill();
    }
    if (o.sparkle > 0 && hash(x * 2.7) < .1) {
      const tw = Math.max(0, Math.sin(t * 3 + x));
      if (tw > .6) {
        const sa = o.sparkle * (tw - .6) * 2.5, sx = x + sw, sy = y - 16;
        c.strokeStyle = `rgba(255,255,240,${sa})`; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(sx - 5, sy); c.lineTo(sx + 5, sy); c.moveTo(sx, sy - 5); c.lineTo(sx, sy + 5); c.stroke();
      }
    }
  }
}

function fgGrass(c, t, off, col, n = 26, hMax = 120) {
  c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const x = ((hash(i * 3.3) * (W + 400) - off) % (W + 400) + (W + 400)) % (W + 400) - 200;
    for (let j = 0; j < 6; j++) { // soft, out-of-focus blades: tapered curved wedges
      const h = hMax * (.35 + hash(i * 7 + j) * .65), bx = x + (j - 2.5) * 9;
      const lean = (j - 2.5) * 9 + Math.sin(t * 1.5 + i + j * .4) * 8 + 16;
      c.beginPath(); c.moveTo(bx - 7, H + 8);
      c.quadraticCurveTo(bx - 2 + lean * .2, H - h * .55, bx + lean, H - h);
      c.quadraticCurveTo(bx + 4 + lean * .25, H - h * .5, bx + 7, H + 8); c.fill();
    }
  }
}

function cloudSea(c, pal, y0, t, off = 0, a = 1) {
  for (let r = 0; r < 4; r++) {
    const yy = y0 + r * 34, sc = .7 + r * .3;
    const lit = mixA(pal.cLit, pal.bot, .25 - r * .05), sh = mixA(pal.cShade, [20, 12, 40], r * .08);
    for (let i = -2; i < 8; i++) {
      const w = 260 * sc, x = ((i * w * .8 - off * (.2 + r * .15) - t * (3 + r * 2)) % (W + w * 2) + W + w * 2) % (W + w * 2) - w;
      drawCloud(c, x, yy + hash(i + r * 9) * 14, w, 46 * sc, i * 7 + r * 31, lit, sh, 0, 8, a);
    }
    c.fillStyle = rgb(sh, a); c.fillRect(-300, yy + 6, W + 600, H - yy + 300);
  }
}

let ROCK_PTS = [];
function rockY(x) {
  const p = ROCK_PTS;
  for (let i = 1; i < p.length; i++) if (p[i][0] >= x) { const u = (x - p[i - 1][0]) / (p[i][0] - p[i - 1][0] || 1); return lerp(p[i - 1][1], p[i][1], u); }
  return H;
}
function summitRock(c, cx, topY, w, pal, rimA) {
  const dark = mixA('#3a2a40', pal.cShade, .3), lit = mixA('#ffb070', pal.sun, .3);
  const segs = [[cx - w, H + 20], [cx - w * .7, topY + 70], [cx - w * .3, topY + 14], [cx - w * .1, topY - 6], [cx + w * .08, topY],
    [cx + w * .35, topY + 4], [cx + w * .5, topY + 40], [cx + w * .8, topY + 90], [cx + w, H + 20]];
  ROCK_PTS = [];
  for (let s = 0; s < 4; s++) {
    const a = segs[s * 2], b = segs[s * 2 + 1], d = segs[s * 2 + 2];
    for (let i = 0; i <= 24; i++) { const u = i / 24, v = 1 - u; ROCK_PTS.push([v * v * a[0] + 2 * v * u * b[0] + u * u * d[0], v * v * a[1] + 2 * v * u * b[1] + u * u * d[1]]); }
  }
  const build = k => {
    k.beginPath(); k.moveTo(segs[0][0], segs[0][1]);
    for (let s = 0; s < 4; s++) k.quadraticCurveTo(segs[s * 2 + 1][0], segs[s * 2 + 1][1], segs[s * 2 + 2][0], segs[s * 2 + 2][1]);
    k.closePath();
  };
  cel(c, build, rgb(dark), rgb(mixA(dark, lit, rimA)), 0, 5, 0);
}
// ================= SHOTS 1-5: the rainy room =================
// single source of truth shared with the audio engine
const CHIRPS = [11.0, 13.0, 16.5, 22.6, 28.0, 44.5, 52.2, 60.6, 64.2, 70.4, 74.5, 76.2, 77.0, 78.0];
const STRIKES = V([3.6, 18.3], [1.3, 18.3]);
const WALK0 = 30.4;          // walk cycle origin: a foot lands every 0.5 s after this
const beakOpen = t => CHIRPS.some(t0 => t - t0 >= 0 && t - t0 < .42 && (Math.floor((t - t0) * 9) % 2 === 0));
const walkPh = t => (t - WALK0) * TAU;

function flashAt(t) {
  let f = 0;
  for (const t0 of STRIKES) {
    const d = t - t0; if (d < 0 || d > 1.4) continue;
    f = Math.max(f, d < .07 ? 1 : 0, d > .14 && d < .2 ? .7 : 0, d > .2 ? Math.exp(-(d - .2) * 4.5) * .8 : 0);
  }
  return f;
}
function flashOverlay(c, fl) {
  if (fl <= 0) return;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter';
  c.fillStyle = `rgba(120,140,210,${fl * .2})`; c.fillRect(0, 0, W, H); c.restore();
}
function hopArc(a, b, u, h) { return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) - Math.sin(u * Math.PI) * h }; }
function bez(p0, p1, p2, u) { const v = 1 - u; return { x: v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x, y: v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y }; }

function robotRoom(tq) {
  return { x: 560, y: 612, s: 1.5, face: 0, sit: 1, slump: 1, headRot: .22, headDrop: 7, armL: .18, armR: .1, eye: 0,
    amb: '#121a38', ambA: .42, lx: 4, ly: -4, key: 0, t: tq, lid: .6 };
}

function titleCard(c, t) {
  const a = V(ss(2.4, 3.6, t), ss(1.0, 2.0, t)) * (1 - ss(6.4, 7.6, t));
  if (a <= 0) return;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(255,170,100,.55)'; c.shadowBlur = 22;
  c.fillStyle = '#f6e8cc';
  c.font = V('600 70px', '600 104px') + ' "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP","Noto Serif KR",serif';
  const s = 'ねむりの丘', sp = V(84, 126), ty = V(H * .4, H * .155);
  for (let i = 0; i < s.length; i++) c.fillText(s[i], W / 2 + (i - (s.length - 1) / 2) * sp, ty);
  c.shadowBlur = 10; c.font = V('500 22px', '500 34px') + ' "Noto Serif KR","Nanum Myeongjo",serif'; c.fillStyle = '#d8c8ae';
  c.fillText('잠  드  는    언  덕', W / 2, ty + V(70, 104));
  c.restore();
}

// ---- S1 (0-9): establishing, the abandoned robot ----
function S1(c, t, tq) {
  const fl = flashAt(t);
  c.save(); camera(c, V(640, 750), V(380, 430), V(1, 1.69) * lerp(1, 1.07, easeIO(clamp(t / 9))));
  drawRoom(c, t, { flash: fl, outside: 0, rain: 1 });
  roomDust(c, t, .6);
  const R = robotRoom(tq); R.ambA = .42 - fl * .22;
  drawRobot(c, R);
  c.restore();
  flashOverlay(c, fl);
  titleCard(c, t);
  return { fade: 1 - ss(0, V(2.6, .8), t), bloom: .3 };
}

// ---- S2 (9-14): a wet little bird slips in through the broken pane ----
function S2(c, t, tq) {
  const fl = flashAt(t);
  c.save(); camera(c, 905, 300, V(1.9, 3.0));
  drawRoom(c, t, { flash: fl, outside: 0, rain: 1 });
  const B = { s: 1, face: -1, amb: '#16203a', ambA: .3, lx: 1.5, ly: -1.5, wet: 1 };
  const sill = { x: 905, y: 418 };
  if (tq < 10.3) {
    const u = easeOut(lin(9, 10.3, tq)), p = bez({ x: 880, y: 214 }, { x: 980, y: 300 }, sill, u);
    Object.assign(B, { x: p.x, y: p.y - 10 * (1 - u), fly: 1, flap: tq * TAU * 7, s: lerp(.7, 1, u) });
  } else {
    let x = sill.x;
    if (tq > 12.3 && tq < 12.9) x += Math.sin(tq * 120) * 1.6;
    Object.assign(B, { x, y: sill.y, spread: 1 - ss(10.3, 10.8, tq), flapT: tq, chirp: beakOpen(t) });
    if (tq > 11.7 && tq < 12.1) B.face = 1;
    B.wet = tq < 12.3 ? 1 : .25;
    B.headRot = kf(tq, [[13.3, 0], [13.7, .45]]);
    B.bob = tq > 13.6 ? -Math.abs(Math.sin(tq * 9)) * 1.5 : 0;
  }
  drawBird(c, B);
  // shake spray
  if (t > 12.3 && t < 13.3) {
    const d = t - 12.3;
    c.fillStyle = 'rgba(200,225,255,.75)';
    for (let i = 0; i < 14; i++) {
      const vx = (hash(i) - .5) * 160, vy = -40 - hash(i + 1) * 120;
      circ(c, sill.x + vx * d, sill.y - 12 + vy * d + 260 * d * d, 1.3); c.fill();
    }
  }
  c.restore();
  flashOverlay(c, fl);
  return { bloom: .3 };
}

// ---- S3 (14-18): the bird finds the sleeping robot ----
function S3(c, t, tq) {
  c.save(); camera(c, V(610, 600), V(545, 560), V(1.75, 3.2));
  drawRoom(c, t, { flash: 0, outside: 0, rain: 1 });
  roomDust(c, t, .8);
  const R = robotRoom(tq);
  if (tq > 17.7 && tq < 17.9) R.armR = .16;
  drawRobot(c, R);
  const B = { s: 1, face: -1, amb: '#121a38', ambA: .35, lx: 1.5, ly: -1.5, wet: .25, chirp: beakOpen(t) };
  const pts = [{ x: 700, y: 612 }, { x: 676, y: 612 }, { x: 652, y: 612 }, { x: 622, y: 612 }];
  if (tq < 14.8) {
    const u = easeOut(lin(14, 14.8, tq)), p = bez({ x: 860, y: 380 }, { x: 760, y: 470 }, pts[0], u);
    Object.assign(B, { x: p.x, y: p.y, fly: 1, flap: tq * TAU * 7 });
  } else {
    let p = pts[0];
    if (tq >= 15.3) p = hopArc(pts[0], pts[1], lin(15.3, 15.6, tq), 10);

    for (let k = 0; k < n; k++) {
      const t = T(c0 + k * .14), f0 = 3300 + hash(i + k) * 900;
      const g = gainEnv(t, .008, .085 * soft, .09, sfx);
      const o = osc('sine', f0, t, t + .14, g);
      o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * 1.35, t + .04); o.frequency.exponentialRampToValueAtTime(f0 * .95, t + .1);
      const fm = ac.createOscillator(); fm.frequency.value = 70; const fmg = ac.createGain(); fmg.gain.value = 260; fm.connect(fmg); fmg.connect(o.frequency); fm.start(t); fm.stop(t + .14);
    }
  });
  const flap = (t0, n, vol) => { for (let k = 0; k < n; k++) { const t = T(t0 + k * .085); const g = gainEnv(t, .01, vol, .06, sfx); noise(WHITE, t, .1, filt('bandpass', 850, .9, g)); } };
  flap(9.1, 9, .14); flap(10.25, 3, .1); flap(12.3, 7, .07); flap(14.0, 7, .12); flap(14.8, 2, .08);
  flap(15.3, 1, .05); flap(15.8, 1, .05); flap(16.9, 1, .05); flap(25.7, 4, .1); flap(27.5, 3, .08);
  flap(75.1, 4, .05); flap(76.1, 14, .13); flap(77.6, 6, .06);
  for (const tp of [17.3, 17.6]) { const t = T(tp); for (const f of [2450, 3720]) osc('sine', f, t, t + .08, gainEnv(t, .001, .07, .06, sfx)); }

  // ---- robot ----
  for (const [t0, e] of EYE_FLICKER) { if (!e) continue; const t = T(t0); osc('square', 1300, t, t + .02, gainEnv(t, .001, .03, .015, sfx)); }
  [[20.95, 880], [21.07, 1320], [21.19, 1760]].forEach(([tt, f]) => { const t = T(tt); osc('square', f, t, t + .1, filt('lowpass', 2600, .5, gainEnv(t, .003, .035, .08, sfx))); });
  const hum = ac.createGain(); hum.connect(sfx);
  hum.gain.setValueAtTime(0, T(20.9)); hum.gain.linearRampToValueAtTime(.025, T(21.4)); hum.gain.setValueAtTime(.025, T(69.5)); hum.gain.linearRampToValueAtTime(0, T(72.4));
  const hlp = filt('lowpass', 380, .7, hum); osc('sawtooth', 55, T(20.9), T(73), hlp); osc('sawtooth', 110.6, T(20.9), T(73), hlp);
  const servo = (t0, dur, f0, f1, vol) => {
    const t = T(t0), g = ac.createGain(); g.connect(sfx);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .08); g.gain.setValueAtTime(vol, t + dur - .1); g.gain.linearRampToValueAtTime(0, t + dur);
    const o = osc('sawtooth', f0, t, t + dur + .05, filt('bandpass', f1 * 3, 2.2, g)); o.frequency.linearRampToValueAtTime(f1, t + dur);
  };
  servo(21.3, 1.7, 90, 170, .06); servo(24.2, 1.3, 120, 200, .045); servo(26.1, 1.3, 130, 230, .045); servo(27.9, .6, 200, 110, .04);
  servo(28.6, 1.8, 70, 140, .05);
  const creak = (t0, dur, vol) => {
    const t = T(t0), g = ac.createGain(); g.connect(sfx);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .1); g.gain.linearRampToValueAtTime(0, t + dur);
    const bp = filt('bandpass', 400, 14, g); bp.frequency.setValueAtTime(380, t); bp.frequency.linearRampToValueAtTime(900, t + dur * .6); bp.frequency.linearRampToValueAtTime(520, t + dur);
    noise(WHITE, t, dur, bp);
  };
  creak(28.7, 1.2, .5); creak(29.5, .8, .35);
  // clockwork ticking of the wind-up key (slows to a stop as he turns to stone)
  for (let x = 21.5; x < 68; x += .42) { const t = T(x); noise(WHITE, t, .02, filt('highpass', 3500, .7, gainEnv(t, .001, .03, .015, sfx))); }
  for (let x = 68, i = 0; x < 74.5; x += .42 * (1 + (x - 68) * .45), i++) {
    const t = T(x); noise(WHITE, t, .02, filt('highpass', 3200, .7, gainEnv(t, .001, .035 * (1 - (x - 68) / 7.5), .02, sfx)));
  }
  // footsteps: one every 0.5 s from WALK0
  for (let x = WALK0 + .5; x < 56.9; x += .5) {
    const t = T(x), indoor = x < 33.3, rock = x > 50, v = x < 33.3 ? 1 : x < 43 ? .55 : x < 50 ? .9 : .7;
    if (indoor) { const g = gainEnv(t, .002, .14, .08, sfx); const o = osc('sine', 170, t, t + .12, g); o.frequency.exponentialRampToValueAtTime(90, t + .08); }
    else noise(WHITE, t, .1, filt('bandpass', rock ? 1400 : 650, .8, gainEnv(t, .004, .09 * v, .07, sfx)));
    for (const f of [910, 1430]) osc('sine', f * (1 + hash(x) * .04), t, t + .14, gainEnv(t, .001, .025 * v, .11, sfx));
  }
  // ---- stone ----
  for (let i = 0; i < 46; i++) {
    const x = 69 + Math.pow(hash(i * 1.7), .7) * 6.5, t = T(x);
    noise(WHITE, t, .03, filt('bandpass', 2200 + hash(i) * 3200, 3, gainEnv(t, .001, .05 + hash(i + 3) * .05, .02, sfx)));
  }
  { const t = T(69.8), g = ac.createGain(); g.connect(sfx);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t + .1); g.gain.exponentialRampToValueAtTime(.0001, t + 2.4);
    const o = osc('sine', 520, t, t + 2.5, g); o.frequency.exponentialRampToValueAtTime(55, t + 2.3); }
  { const t = T(70.5), g = ac.createGain(); g.connect(sfx);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, T(73)); g.gain.linearRampToValueAtTime(0, T(77.5));
    osc('sine', 55, t, T(78), g); osc('sine', 82.4, t, T(78), g); }
  // sit-down clank at the summit
  { const t = T(57.6); for (const f of [620, 1010]) osc('sine', f, t, t + .5, gainEnv(t, .002, .04, .4, sfx)); }

  return master;
}
// ================= PLAYBACK =================
const overlay = document.getElementById('overlay'), bar = document.getElementById('bar'), pauseTag = document.getElementById('pause');
let ac = null, T0 = 0, perf0 = 0, pausedAt = 0, state = 'idle', lastFrame = -1;

function now() {
  if (state === 'paused') return pausedAt;
  if (ac) return ac.currentTime - T0;
  return (performance.now() - perf0) / 1000;
}
async function start() {
  if (ac) { try { ac.close(); } catch (e) { } ac = null; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC({ latencyHint: 'playback' });
    if (ac.state === 'suspended') await ac.resume();
    T0 = ac.currentTime + .15;
    buildAudio(ac, T0);
  } catch (e) { console.warn('audio unavailable', e); ac = null; }
  perf0 = performance.now() + 150;
  state = 'playing'; lastFrame = -1;
  overlay.classList.add('hide'); pauseTag.classList.remove('on');
}
function togglePause() {
  if (state === 'playing') {
    pausedAt = now(); state = 'paused'; pauseTag.classList.add('on');
    if (ac) ac.suspend();
  } else if (state === 'paused') {
    state = 'playing'; pauseTag.classList.remove('on');
    if (ac) ac.resume(); else perf0 = performance.now() - pausedAt * 1000;
  }
}
function finish() {
  state = 'ended';
  overlay.querySelector('h1').textContent = 'おわり';
  overlay.querySelector('.sub').textContent = '잠드는 언덕 · 끝';
  overlay.querySelector('#play').textContent = '↺ 다시 보기';
  overlay.classList.remove('hide');
}

function loop() {
  requestAnimationFrame(loop);
  if (state !== 'playing') return;
  const t = now();
  if (t < 0) return;
  const f = Math.floor(t * 24);
  if (f !== lastFrame) { lastFrame = f; render(t); bar.style.width = (clamp(t / DUR) * 100) + '%'; }
  if (t >= DUR + .6) { render(DUR); finish(); }
}

overlay.addEventListener('click', () => { if (state === 'idle' || state === 'ended') start(); });
overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (state === 'idle' || state === 'ended') start(); } });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'playing' || state === 'paused')) { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') start();
  else if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); }
});
document.getElementById('stage').addEventListener('click', () => { if (state === 'playing' || state === 'paused') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// poster frame behind the start screen; window.__render(t) lets you scrub a still for inspection
window.__render = t => render(t);
render(60.5);
requestAnimationFrame(loop);
</script>
