  :root{--bg:#07060a;--fg:#fff4e0;--dim:#b9a99a;--accent:#ffd34a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"ChalkFont","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
  body.portrait canvas{width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 55%,rgba(20,40,30,.55),rgba(0,0,0,.86) 70%);cursor:pointer;
    transition:opacity .9s ease;text-align:center;padding:16px;box-sizing:border-box;user-select:none}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,54px);line-height:1.25;letter-spacing:.02em;
    text-shadow:0 4px 0 #140c18,0 0 18px rgba(255,200,120,.35)}
  #overlay .sub{color:var(--dim);font-size:clamp(13px,2.4vw,17px);letter-spacing:.08em}
  #overlay button{margin-top:16px;font:inherit;font-size:clamp(16px,2.6vw,20px);color:#1b1220;background:var(--accent);
    border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 0 4px rgba(255,211,74,.2),0 8px 30px rgba(255,170,60,.25)}
  #overlay button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay .hint{color:#8a7d70;font-size:12px;letter-spacing:.06em;margin-top:6px}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#8e2d72,#ffd34a);opacity:0;transition:opacity .4s}
  body:hover #bar{opacity:.75}
  #pause{position:fixed;top:14px;right:16px;font-size:13px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .3s}
  #pause.on{opacity:1}

<body>
<div id="stage"><canvas id="cv" width="1080" height="1920" aria-label="칠판으로 배우는 삼각함수 영상"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="재생">
  <h1>삼각함수,<br>칠판으로 한 번에</h1>
  <div class="sub">sin · cos · tan · 단위원 · 그래프 · 핵심 공식</div>
  <button id="play" type="button">▶ 재생 (소리 켜짐)</button>
  <div class="hint">화면 터치 · Space 일시정지 · R 처음부터 · F 전체화면</div>
</div>
<div id="bar"></div>
<div id="pause">PAUSE</div>
<script>
"use strict";
// ================= CORE: math, color, noise, drawing helpers =================
const W = 1080, H = 1920; let DUR = 90;
const PT = H > W, V = (l, p) => PT ? p : l;   // landscape / portrait (9:16) layouts
const TAU = Math.PI * 2;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
document.body.classList.toggle('portrait', PT);
const ctx = cv.getContext('2d');
const INK = '#1b1220';

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a));
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// piecewise keyframes [[t,v],...] with smoothstep between keys
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, ss(t0, t1, t));
    }
  }
  return keys[keys.length - 1][1];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// deterministic hash -> [0,1)
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) p[i] = r();
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return lerp(p[i & 1023], p[(i + 1) & 1023], u);
  };
}
function fbm(n, x, oct = 4) {
  let s = 0, a = .5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); norm += a; a *= .5; f *= 2.03; }
  return s / norm;
}

// ---- color ----
const _pc = new Map();
function P(c) {
  if (Array.isArray(c)) return c;
  let v = _pc.get(c);
  if (!v) {
    if (c[0] === '#') {
      const h = c.slice(1);
      v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    } else { // "rgb(r,g,b)" / "rgba(...)" produced by mix()/rgb()
      const m = c.match(/[\d.]+/g).map(Number);
      v = [m[0], m[1], m[2]];
    }
    if (_pc.size > 4000) _pc.clear();
    _pc.set(c, v);
  }
  return v;
}
const mixA = (a, b, t) => { a = P(a); b = P(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; };
const rgb = (a, al) => al === undefined
  ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`
  : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const mix = (a, b, t, al) => rgb(mixA(a, b, t), al);
function stoneOf(c) {
  const a = P(c), l = (a[0] * .3 + a[1] * .59 + a[2] * .11) / 255;
  const v = lerp(78, 168, l);
  return [v + 6, v + 3, v - 2];
}
function mulA(a, b) { a = P(a); b = P(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; }

// ---- paths ----
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function capsule(c, x1, y1, x2, y2, r) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.beginPath();
  c.arc(x2, y2, r, a - Math.PI / 2, a + Math.PI / 2);
  c.arc(x1, y1, r, a + Math.PI / 2, a + Math.PI * 1.5);
  c.closePath();
}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); }

// Cel shading: fill shade, clip, then fill base shifted toward light -> hard-edged shadow rim.
function cel(c, build, base, shade, lx, ly, lw, ink = INK) {
  c.save();
  build(c); c.fillStyle = shade; c.fill();
  c.clip();
  c.translate(lx, ly); build(c); c.fillStyle = base; c.fill();
  c.restore();
  if (lw > 0) { build(c); c.lineWidth = lw; c.strokeStyle = ink; c.stroke(); }
}

function camera(c, cx, cy, z) { c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cx, -cy); }

// ---- offscreen buffers ----
function mk(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; }
const rimBuf = mk(W, H), rimCtx = rimBuf.getContext('2d');
const bloomBuf = mk(W / 8 | 0, H / 8 | 0), bloomCtx = bloomBuf.getContext('2d');
const bloomBuf2 = mk(W / 4 | 0, H / 4 | 0), bloomCtx2 = bloomBuf2.getContext('2d');
const BW = bloomBuf.width, BH = bloomBuf.height, BW2 = bloomBuf2.width, BH2 = bloomBuf2.height;

// draw something with a backlit rim (silhouette offset copies under the real drawing)
function rimmed(c, drawFn, rimCol, amt, offs) {
  if (amt > 0.01) {
    const m = c.getTransform();
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-over';
    rimCtx.clearRect(0, 0, W, H);
    rimCtx.setTransform(m);
    drawFn(rimCtx);
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-in';
    rimCtx.fillStyle = rimCol; rimCtx.fillRect(0, 0, W, H);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = amt;
    for (const [dx, dy] of offs) c.drawImage(rimBuf, dx, dy);
    c.restore();
  }
  drawFn(c);
}

// ---- film grain, vignette ----
const grains = [];
(function () {
  const r = mulberry32(77);
  for (let k = 0; k < 4; k++) {
    const g = mk(256, 256), gc = g.getContext('2d'), id = gc.createImageData(256, 256);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = 128 + (r() - .5) * 255 * (r() < .5 ? .6 : 1);
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
    }
    gc.putImageData(id, 0, 0);
    grains.push(ctx.createPattern(g, 'repeat'));
  }
})();
const vignette = (function () {
  const v = mk(W, H), vc = v.getContext('2d');

}
// ================= PLAYBACK =================
const pt_fonts = (document.fonts && document.fonts.load) ? document.fonts.load('80px ChalkFont') : Promise.resolve();
window.__fontsReady = pt_fonts.catch(() => null);
const overlay = document.getElementById('overlay'), bar = document.getElementById('bar'), pauseTag = document.getElementById('pause');
let ac = null, T0 = 0, perf0 = 0, pausedAt = 0, state = 'idle', lastFrame = -1;

function now() {
  if (state === 'paused') return pausedAt;
  if (ac) return ac.currentTime - T0;
  return (performance.now() - perf0) / 1000;
}
async function start() {
  if (ac) { try { ac.close(); } catch (e) { } ac = null; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC({ latencyHint: 'playback' });
    if (ac.state === 'suspended') await ac.resume();
    T0 = ac.currentTime + .15;
    buildAudio(ac, T0);
  } catch (e) { console.warn('audio unavailable', e); ac = null; }
  perf0 = performance.now() + 150;
  state = 'playing'; lastFrame = -1;
  overlay.classList.add('hide'); pauseTag.classList.remove('on');
}
function togglePause() {
  if (state === 'playing') {
    pausedAt = now(); state = 'paused'; pauseTag.classList.add('on');
    if (ac) ac.suspend();
  } else if (state === 'paused') {
    state = 'playing'; pauseTag.classList.remove('on');
    if (ac) ac.resume(); else perf0 = performance.now() - pausedAt * 1000;
  }
}
function finish() {
  state = 'ended';
  overlay.querySelector('h1').textContent = '수업 끝!';
  overlay.querySelector('.sub').textContent = '칠판으로 배우는 삼각함수 · 저장해두고 복습!';
  overlay.querySelector('#play').textContent = '↺ 다시 보기';
  overlay.classList.remove('hide');
}

function loop() {
  requestAnimationFrame(loop);
  if (state !== 'playing') return;
  const t = now();
  if (t < 0) return;
  const f = Math.floor(t * 24);
  if (f !== lastFrame) { lastFrame = f; render(t); bar.style.width = (clamp(t / DUR) * 100) + '%'; }
  if (t >= DUR + .6) { render(DUR); finish(); }
}

overlay.addEventListener('click', () => { if (state === 'idle' || state === 'ended') start(); });
overlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (state === 'idle' || state === 'ended') start(); } });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'playing' || state === 'paused')) { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') start();
  else if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); }
});
document.getElementById('stage').addEventListener('click', () => { if (state === 'playing' || state === 'paused') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

// poster frame behind the start screen; window.__render(t) lets you scrub a still for inspection
window.__render = t => render(t);
const poster = () => render(SCENES[1].a + 16.6);
window.__fontsReady.then(poster, poster);
requestAnimationFrame(loop);
</script>
</body>
