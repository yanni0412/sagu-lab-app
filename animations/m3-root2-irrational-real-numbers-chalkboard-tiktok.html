  :root{--bg:#07060a;--fg:#fff4e0;--dim:#b9a99a;--accent:#ffd34a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"ChalkFont","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
  body.portrait canvas{width:56.25vh;height:100vh;max-width:100vw;max-height:177.78vw}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 55%,rgba(20,40,30,.55),rgba(0,0,0,.86) 70%);cursor:pointer;
    transition:opacity .9s ease;text-align:center;padding:16px;box-sizing:border-box;user-select:none}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-weight:400;font-size:clamp(26px,6vw,54px);line-height:1.25;letter-spacing:.02em;
    text-shadow:0 4px 0 #140c18,0 0 18px rgba(255,200,120,.35)}
  #overlay .sub{color:var(--dim);font-size:clamp(13px,2.4vw,17px);letter-spacing:.08em}
  #overlay button{margin-top:16px;font:inherit;font-size:clamp(16px,2.6vw,20px);color:#1b1220;background:var(--accent);
    border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 0 4px rgba(255,211,74,.2),0 8px 30px rgba(255,170,60,.25)}
  #overlay button:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay .hint{color:#8a7d70;font-size:12px;letter-spacing:.06em;margin-top:6px}
  #bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#8e2d72,#ffd34a);opacity:0;transition:opacity .4s}
  body:hover #bar{opacity:.75}
  #pause{position:fixed;top:14px;right:16px;font-size:13px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .3s}
  #pause.on{opacity:1}
</style>
</head>

<div id="overlay" role="button" tabindex="0" aria-label="재생">

<script>
"use strict";
// ================= CORE: math, color, noise, drawing helpers =================
const W = 1080, H = 1920; let DUR = 90;

const TAU = Math.PI * 2;
const cv = document.getElementById('cv');

document.body.classList.toggle('portrait', PT);
const ctx = cv.getContext('2d');
const INK = '#1b1220';

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;

// piecewise keyframes [[t,v],...] with smoothstep between keys
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, ss(t0, t1, t));

  return keys[keys.length - 1][1];
}

  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

  for (let i = 0; i < 1024; i++) p[i] = r();

    return lerp(p[i & 1023], p[(i + 1) & 1023], u);

  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3); norm += a; a *= .5; f *= 2.03; }

// ---- color ----
const _pc = new Map();
function P(c) {
  if (Array.isArray(c)) return c;
  let v = _pc.get(c);
  if (!v) {
    if (c[0] === '#') {
      const h = c.slice(1);
      v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];

function mulA(a, b) { a = P(a); b = P(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; }

// ---- paths ----
function rrect(c, x, y, w, h, r) {

  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);

  c.arc(x1, y1, r, a + Math.PI / 2, a + Math.PI * 1.5);

}
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); }

// Cel shading: fill shade, clip, then fill base shifted toward light -> hard-edged shadow rim.
function cel(c, build, base, shade, lx, ly, lw, ink = INK) {
  c.save();
  build(c); c.fillStyle = shade; c.fill();
  c.clip();
  c.translate(lx, ly); build(c); c.fillStyle = base; c.fill();
  c.restore();
  if (lw > 0) { build(c); c.lineWidth = lw; c.strokeStyle = ink; c.stroke(); }
}

function camera(c, cx, cy, z) { c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cx, -cy); }

// ---- offscreen buffers ----
function mk(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; }
const rimBuf = mk(W, H), rimCtx = rimBuf.getContext('2d');
const bloomBuf = mk(W / 8 | 0, H / 8 | 0), bloomCtx = bloomBuf.getContext('2d');

const BW = bloomBuf.width, BH = bloomBuf.height, BW2 = bloomBuf2.width, BH2 = bloomBuf2.height;

// draw something with a backlit rim (silhouette offset copies under the real drawing)
function rimmed(c, drawFn, rimCol, amt, offs) {
  if (amt > 0.01) {
    const m = c.getTransform();
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-over';
    rimCtx.clearRect(0, 0, W, H);
    rimCtx.setTransform(m);
    drawFn(rimCtx);
    rimCtx.setTransform(1, 0, 0, 1, 0, 0);
    rimCtx.globalCompositeOperation = 'source-in';
    rimCtx.fillStyle = rimCol; rimCtx.fillRect(0, 0, W, H);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = amt;
    for (const [dx, dy] of offs) c.drawImage(rimBuf, dx, dy);
    c.restore();
  }
  drawFn(c);

// ---- film grain, vignette ----
const grains = [];
(function () {
  const r = mulberry32(77);
  for (let k = 0; k < 4; k++) {
    const g = mk(256, 256), gc = g.getContext('2d'), id = gc.createImageData(256, 256);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = 128 + (r() - .5) * 255 * (r() < .5 ? .6 : 1);
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;

    gc.putImageData(id, 0, 0);
    grains.push(ctx.createPattern(g, 'repeat'));
  }
})();

  const v = mk(W, H), vc = v.getContext('2d');
  const g = vc.createRadialGradient(W / 2, H / 2, V(H * .35, W * .3), W / 2, H / 2, V(H * .95, Math.hypot(W, H) / 2));
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.7, 'rgba(10,4,18,.28)'); g.addColorStop(1, 'rgba(6,2,10,.78)');
  vc.fillStyle = g; vc.fillRect(0, 0, W, H);
  return v;
})();

function postFX(t, frame, opt) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  // halation / bloom: downsample, square (multiply) to keep highlights, add back
  const bs = opt.bloom ?? .5;
  if (bs > 0) {
    bloomCtx2.globalCompositeOperation = 'source-over';
    bloomCtx2.drawImage(cv, 0, 0, BW2, BH2);
    bloomCtx2.globalCompositeOperation = 'multiply';
    bloomCtx2.drawImage(bloomBuf2, 0, 0);
    bloomCtx2.drawImage(bloomBuf2, 0, 0);
    bloomCtx.globalCompositeOperation = 'source-over';
    bloomCtx.drawImage(bloomBuf2, 0, 0, BW, BH);
    c.save();
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = bs * .55;
    c.drawImage(bloomBuf, 0, 0, W, H);
    c.globalAlpha = bs * .35;
    c.drawImage(bloomBuf2, 0, 0, W, H);
    c.restore();
  }
  // vignette
  c.drawImage(vignette, 0, 0);
  // grain
  c.save();
  c.globalCompositeOperation = 'overlay';
  c.globalAlpha = opt.grain ?? .14;
  c.fillStyle = grains[frame & 3];
  c.translate((hash(frame) * 256) | 0, (hash(frame + 9) * 256) | 0);
  c.fillRect(-256, -256, W + 512, H + 512);
  c.restore();
  // film dust specks & a rare hair
  c.save();
  for (let i = 0; i < 3; i++) {
    const h = hash(frame * 7.3 + i * 13.1);
    if (h < .32) {
      c.fillStyle = h < .16 ? 'rgba(10,6,12,.55)' : 'rgba(255,248,230,.35)';
      circ(c, hash(frame + i * 3.7) * W, hash(frame * 1.7 + i) * H, 1 + hash(frame + i) * 2.2); c.fill();
    }
  }
  if (hash(frame * .37) < .04) {
    c.strokeStyle = 'rgba(15,8,14,.35)'; c.lineWidth = 1;
    const x = hash(frame * 3.1) * W, y = hash(frame * 5.3) * H;
    c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + 20, y + 10, x - 10, y + 30, x + 14, y + 46); c.stroke();
  }
  c.restore();
  // fades
  if (opt.fade > 0) { c.fillStyle = `rgba(0,0,0,${opt.fade})`; c.fillRect(0, 0, W, H); }
  if (opt.white > 0) { c.fillStyle = `rgba(255,250,240,${opt.white})`; c.fillRect(0, 0, W, H); }
}
// ================= BOARD & CHALK =================
const CF = '"ChalkFont","Nanum Pen Script","Gaegu",cursive,sans-serif';
const CC = { w: '#f3f0e6', y: '#f6dc72', p: '#f5a6b8', b: '#a2d2f2', g: '#b4e2a8', o: '#f7b97c' };
const col = k => CC[k] || k;
const BOARD = (() => {
  const b = mk(W, H), c = b.getContext('2d'), r = mulberry32(31);
  const g = c.createRadialGradient(W * .45, H * .42, 80, W * .5, H * .5, H * .75);
  g.addColorStop(0, '#2c4d3c'); g.addColorStop(.6, '#22402f'); g.addColorStop(1, '#152a1e');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // old eraser swipes and smudges
  for (let i = 0; i < 26; i++) {
    c.save(); c.translate(r() * W, 150 + r() * (H - 400)); c.rotate((r() - .5) * .25);
    const gg = c.createRadialGradient(0, 0, 10, 0, 0, 260); gg.addColorStop(0, `rgba(230,240,230,${.02 + r() * .035})`); gg.addColorStop(1, 'rgba(230,240,230,0)');
    c.scale(1, .18 + r() * .2); c.fillStyle = gg; c.fillRect(-260, -260, 520, 520); c.restore();
  }

  c.strokeStyle = 'rgba(235,240,230,.035)'; c.lineWidth = 5; c.lineCap = 'round';
  for (let i = 0; i < 70; i++) { const x = r() * W, y = 200 + r() * (H - 500); c.beginPath(); c.moveTo(x, y); for (let k = 0; k < 4; k++) c.quadraticCurveTo(x + (k + .5) * 22, y + (r() - .5) * 30, x + (k + 1) * 22, y + (r() - .5) * 10); c.stroke(); }
  // slate texture
  const id = c.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  c.putImageData(id, 0, 0);
  // wooden frame + chalk tray
  const wood = (x, y, w, h) => { const wg = c.createLinearGradient(x, y, x, y + h); wg.addColorStop(0, '#8a5a32'); wg.addColorStop(.5, '#6a4224'); wg.addColorStop(1, '#4a2c16'); c.fillStyle = wg; c.fillRect(x, y, w, h); };
  wood(0, 0, W, 26); wood(0, 0, 22, H); wood(W - 22, 0, 22, H); wood(0, H - 120, W, 120);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(22, H - 124, W - 44, 6);
  for (const [x, cl, l] of [[180, '#f3f0e6', 70], [300, '#f6dc72', 52], [880, '#f5a6b8', 60]]) { c.save(); c.translate(x, H - 92); c.rotate(-.06); c.fillStyle = cl; rrect(c, 0, 0, l, 16, 7); c.fill(); c.restore(); }
  c.fillStyle = 'rgba(240,240,230,.25)'; for (let i = 0; i < 300; i++) { c.fillRect(30 + r() * (W - 60), H - 112 + r() * 14, 2, 2); }
  return b;
})();
const GRAIN = (() => { // alpha mask that breaks chalk strokes into dusty texture
  const g = mk(256, 256), gc = g.getContext('2d'), id = gc.createImageData(256, 256), r = mulberry32(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = r(); id.data[i] = id.data[i + 1] = id.data[i + 2] = 255; id.data[i + 3] = v < .08 ? 40 : 150 + v * 105; }
  gc.putImageData(id, 0, 0); return ctx.createPattern(g, 'repeat');
})();
const CL = mk(W, H), CLc = CL.getContext('2d');

// ---- strokes ----
function pathLen(pts) { let L = 0; const cum = [0]; for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(L); } return { L, cum }; }
function chalkLine(c, pts, p, k, w = 7, alpha = 1) { // draws the first p (0..1) of a polyline; returns the tip
  if (p <= 0 || pts.length < 2) return null;
  const { L, cum } = pathLen(pts), tgt = L * clamp(p);
  const vis = [pts[0]]; let tip = pts[0];
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] <= tgt) { vis.push(pts[i]); tip = pts[i]; continue; }
    const u = (tgt - cum[i - 1]) / (cum[i] - cum[i - 1] || 1); tip = [lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)]; vis.push(tip); break;
  }
  c.save(); c.globalAlpha = alpha; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = col(k); c.lineWidth = w; c.beginPath(); vis.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
  c.globalAlpha = alpha * .45; c.lineWidth = w * .55; c.beginPath(); vis.forEach(([x, y], i) => i ? c.lineTo(x + 1.6, y - 1.2) : c.moveTo(x + 1.6, y - 1.2)); c.stroke();
  c.restore();

}
const arcPts = (cx, cy, r, a0, a1, n = 64) => { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * r, cy - Math.sin(a) * r]); } return o; };

function chalkMulti(c, segs, p, k, w = 7, alpha = 1) {
  const lens = segs.map(sg => pathLen(sg).L), tot = lens.reduce((a, b) => a + b, 0) || 1; let acc = 0, tip = null;
  segs.forEach((sg, i) => { const q = clamp((p * tot - acc) / (lens[i] || 1)); if (q > 0) { const tp = chalkLine(c, sg, q, k, w, alpha); if (q < 1) tip = tp; } acc += lens[i]; });

}
const ellPts = (cx, cy, rx, ry, rot = 0, n = 60) => Array.from({ length: n + 1 }, (_, i) => { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });

// ---- handwritten math: tokens -> layout ----
// token: 'text' | {s, c} | {ang} (angle sign) | {th} | {pi} | {f: [..], d: [..]} | {sq: [..]} | {up: [..]} | {deg} | {dot} | {minus} | {cn: n} (circled number) | {dn: [..]} (subscript)
function tW(c, tok, s) {
  if (typeof tok === 'string') tok = { s: tok };
  if (tok.s !== undefined) { c.font = `${s}px ${CF}`; return c.measureText(tok.s).width; }
  if (tok.arr) return s * .9;
  if (tok.ang) return s * .62;
  if (tok.th) return s * .5; if (tok.pi) return s * .58; if (tok.deg) return s * .26; if (tok.dot) return s * .34; if (tok.minus) return s * .48; if (tok.cn) return s * .78;

function mW(c, toks, s) { let w = 0; for (const t of toks) w += tW(c, t, s); return w; }

    c.strokeStyle = kk; c.fillStyle = kk; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';

    else if (tok.arr) { c.beginPath(); c.moveTo(x + s * .1, y - s * .3); c.lineTo(x + s * .78, y - s * .31); c.moveTo(x + s * .58, y - s * .48); c.lineTo(x + s * .8, y - s * .31); c.lineTo(x + s * .58, y - s * .13); c.stroke(); }
    else if (tok.ang) { c.beginPath(); c.moveTo(x + s * .5, y - s * .66); c.lineTo(x + s * .06, y - s * .04); c.lineTo(x + s * .54, y - s * .05); c.stroke(); }
    else if (tok.th) { c.beginPath(); c.ellipse(x + s * .25, y - s * .34, s * .15, s * .3, .08, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(x + s * .12, y - s * .35); c.lineTo(x + s * .38, y - s * .33); c.stroke(); }

    else if (tok.deg) { c.beginPath(); c.arc(x + s * .12, y - s * .62, s * .08, 0, TAU); c.stroke(); }

    else if (tok.minus) { c.beginPath(); c.moveTo(x + s * .06, y - s * .3); c.lineTo(x + s * .42, y - s * .31); c.stroke(); }
    else if (tok.cn) { c.beginPath(); c.arc(x + s * .38, y - s * .3, s * .33, 0, TAU); c.stroke(); c.font = `${s * .6}px ${CF}`; c.textAlign = 'center'; c.fillText(String(tok.cn), x + s * .38, y - s * .1); c.textAlign = 'left'; }
