<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1726">
<title>도어온 스마트 도어락</title>

<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f4f6fa; --line:#d9dee8;
  --ink:#121a2b; --ink-2:#46536b; --ink-3:#7c879c;
  --accent:#2f6bff; --accent-ink:#ffffff; --accent-soft:#e2eaff;
  --locked:#1f8a5b; --locked-soft:#dcf3e8;
  --open:#e0762b; --open-soft:#fdebdc;
  --bad:#d23b3b; --bad-soft:#fde3e3;
  --shadow:0 1px 2px rgba(18,26,43,.06),0 8px 24px rgba(18,26,43,.08);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b111c; --surface:#141c2b; --surface-2:#1b2537; --line:#28344a;
    --ink:#e8edf6; --ink-2:#a9b5ca; --ink-3:#77849b;
    --accent:#6b95ff; --accent-ink:#0b1430; --accent-soft:#1c2a4d;
    --locked:#47c98c; --locked-soft:#123526;
    --open:#f39a55; --open-soft:#3a2414;
    --bad:#f07070; --bad-soft:#3d1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b111c; --surface:#141c2b; --surface-2:#1b2537; --line:#28344a;
  --ink:#e8edf6; --ink-2:#a9b5ca; --ink-3:#77849b;
  --accent:#6b95ff; --accent-ink:#0b1430; --accent-soft:#1c2a4d;
  --locked:#47c98c; --locked-soft:#123526;
  --open:#f39a55; --open-soft:#3a2414;
  --bad:#f07070; --bad-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ---------- top ---------- */
.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:var(--bg)}
.device-btn{display:flex; align-items:center; gap:6px; border:0; background:none; padding:6px 0;
  font-size:20px; font-weight:800; letter-spacing:-.02em}
.device-btn svg{width:18px; height:18px; color:var(--ink-3)}
.icon-btn{position:relative; width:42px; height:42px; border-radius:50%; border:0; background:var(--surface);
  display:grid; place-items:center; box-shadow:var(--shadow)}
.icon-btn svg{width:22px; height:22px}
.dot-badge{position:absolute; top:6px; right:6px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
  background:var(--bad); color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center}

main{flex:1; padding:0 16px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

h2{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:6px 0 14px}
h3{font-size:13px; font-weight:700; color:var(--ink-3); margin:22px 4px 8px; letter-spacing:.02em}

.card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px}

/* ---------- home ---------- */
.status-line{display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:13px; margin:0 4px 6px}
.conn-dot{width:8px; height:8px; border-radius:50%; background:var(--locked)}
.conn-dot.off{background:var(--bad)}

.lock-stage{display:flex; flex-direction:column; align-items:center; padding:22px 0 18px}
.lock-btn{
  --p:0; --c:var(--locked); --soft:var(--locked-soft);
  position:relative; width:228px; height:228px; border-radius:50%; border:0; padding:0;
  background:var(--surface); box-shadow:var(--shadow); touch-action:none; user-select:none; -webkit-user-select:none;
  display:grid; place-items:center; transition:transform .15s ease;
}
.lock-btn.open{--c:var(--open); --soft:var(--open-soft)}
.lock-btn.offline{--c:var(--ink-3); --soft:var(--surface-2)}
.lock-btn:active{transform:scale(.97)}
.lock-btn .ring{position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*1turn), transparent 0)}
.lock-btn .ring::after{content:""; position:absolute; inset:9px; border-radius:50%; background:var(--surface)}
.lock-btn .face{position:relative; width:180px; height:180px; border-radius:50%; background:var(--soft);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--c)}
.lock-btn .face svg{width:62px; height:62px}
.lock-btn .state{font-size:22px; font-weight:800; letter-spacing:-.02em}
.lock-btn.busy .face svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.lock-hint{margin-top:16px; color:var(--ink-2); font-size:14px; min-height:21px; text-align:center}
.lock-hint b{color:var(--ink)}

.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tile{background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px; min-width:0}
.tile .k{font-size:12px; color:var(--ink-3)}
.tile .v{font-size:17px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile .v.warn{color:var(--bad)}
.batt{display:flex; align-items:center; gap:6px}
.batt i{position:relative; width:24px; height:12px; border:2px solid currentColor; border-radius:3px; display:inline-block}
.batt i::after{content:""; position:absolute; right:-5px; top:2px; width:2px; height:4px; background:currentColor; border-radius:1px}
.batt i b{position:absolute; left:1px; top:1px; bottom:1px; border-radius:1px; background:currentColor}

.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.quick button{display:flex; align-items:center; gap:10px; border:0; background:var(--surface); box-shadow:var(--shadow);
  border-radius:14px; padding:14px; text-align:left; font-weight:700}
.quick svg{width:22px; height:22px; color:var(--accent); flex:none}

/* ---------- list rows ---------- */
.list{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.row{display:flex; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid var(--line); min-height:56px}
.row:first-child{border-top:0}
.row .ico{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:var(--surface-2); color:var(--ink-2)}
.row .ico svg{width:19px; height:19px}
.row .ico.ok{background:var(--locked-soft); color:var(--locked)}
.row .ico.op{background:var(--open-soft); color:var(--open)}
.row .ico.bad{background:var(--bad-soft); color:var(--bad)}
.row .ico.ac{background:var(--accent-soft); color:var(--accent)}
.row .body{flex:1; min-width:0}
.row .t1{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t2{font-size:12.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .side{font-size:12.5px; color:var(--ink-3); flex:none; text-align:right}
button.row{width:100%; border-left:0; border-right:0; border-bottom:0; background:none; text-align:left}
.row:first-child{border-top:0}
.empty{padding:28px 16px; text-align:center; color:var(--ink-3); font-size:14px}

.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:13.5px;
  font-weight:600; white-space:nowrap; color:var(--ink-2)}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.tag{display:inline-block; font-size:11.5px; font-weight:700; border-radius:6px; padding:1px 7px; margin-left:6px; vertical-align:1px}
.tag.ok{background:var(--locked-soft); color:var(--locked)}
.tag.wait{background:var(--accent-soft); color:var(--accent)}
.tag.off{background:var(--surface-2); color:var(--ink-3)}

/* ---------- forms ---------- */
.btn{border:0; border-radius:12px; padding:13px 16px; font-weight:700; background:var(--surface-2); color:var(--ink)}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft); color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn-row{display:flex; gap:8px; margin-top:16px}
.btn-row .btn{flex:1}

.field{display:block; margin-top:14px}
.field > span{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.field input,.field select{width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px 14px}
.field input:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:-1px}
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:4px; gap:4px}
.seg button{flex:1; border:0; background:none; border-radius:9px; padding:9px 4px; font-weight:600; font-size:14px; color:var(--ink-2)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.days{display:flex; gap:6px}
.days button{flex:1; aspect-ratio:1; max-width:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2); font-weight:700; font-size:13px}
.days button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.switch{position:relative; width:50px; height:30px; flex:none}
.switch input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; z-index:1}
.switch i{position:absolute; inset:0; border-radius:15px; background:var(--line); transition:background .15s}
.switch i::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:2px solid var(--accent); outline-offset:2px}
.row select{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:6px 8px}

.code{font-size:30px; font-weight:800; letter-spacing:.18em; text-align:center; padding:14px; border-radius:12px;
  background:var(--surface-2); margin-top:6px}

/* ---------- tabs ---------- */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabs button{border:0; background:none; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:11.5px; font-weight:600; color:var(--ink-3)}
.tabs button svg{width:24px; height:24px}
.tabs button.on{color:var(--accent)}

/* ---------- sheet / dialog ---------- */
.scrim{position:fixed; inset:0; z-index:50; background:rgba(5,10,20,.45); display:flex; align-items:flex-end; justify-content:center;
  animation:fade .15s ease}
.sheet{width:100%; max-width:520px; max-height:88vh; overflow:auto; background:var(--surface); border-radius:22px 22px 0 0;
  padding:8px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .2s ease}
@keyframes up{from{transform:translateY(30px)} to{transform:none}}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 12px}
.sheet h4{font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:-.02em}
.sheet p.sub{margin:0; color:var(--ink-2); font-size:14px}

/* pin pad */
.pin-screen{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.pin-screen h4{font-size:20px; font-weight:800; margin:0}
.pin-screen p{color:var(--ink-2); margin:6px 0 0; min-height:22px; text-align:center}
.pin-screen p.err{color:var(--bad)}
.pin-dots{display:flex; gap:16px; margin:26px 0 30px}
.pin-dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-3)}
.pin-dots i.on{background:var(--ink); border-color:var(--ink)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
.pad{display:grid; grid-template-columns:repeat(3,76px); gap:14px 22px}
.pad button{width:76px; height:76px; border-radius:50%; border:0; background:var(--surface); box-shadow:var(--shadow);
  font-size:26px; font-weight:600}
.pad button.ghost{background:none; box-shadow:none; font-size:15px; color:var(--ink-2)}
.pad button:active{background:var(--surface-2)}

/* toast */
.toasts{position:fixed; left:0; right:0; top:calc(12px + env(safe-area-inset-top)); z-index:70; display:flex; flex-direction:column;
  align-items:center; gap:8px; pointer-events:none; padding:0 16px}
.toast{max-width:480px; width:100%; background:var(--ink); color:var(--bg); border-radius:14px; padding:12px 16px; font-size:14px;
  font-weight:600; box-shadow:var(--shadow); animation:drop .2s ease}
.toast.bad{background:var(--bad); color:#fff}
@keyframes drop{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}

.note{font-size:12.5px; color:var(--ink-3); margin:10px 4px 0}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <button class="device-btn" id="deviceBtn" aria-label="도어락 선택">
      <span id="deviceName">현관문</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="bellBtn" aria-label="알림">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot-badge" id="bellBadge" hidden></span>
    </button>
  </header>

  <main id="main"></main>

  <nav class="tabs" aria-label="메뉴">
    <div class="in">
      <button data-tab="home" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button data-tab="log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>출입기록</button>
      <button data-tab="keys">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M16 7l3 3M18.5 4.5l2 2"/></svg>출입키</button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
    </div>
  </nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════
   1. 유틸
   ══════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const randInt = n => {               // 0..n-1, 암호학적 난수 (편향 제거)
  const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= max);
  return buf[0] % n;
};
const uid = () => Date.now().toString(36) + randInt(1e9).toString(36);
const randomCode = len => Array.from({length: len}, () => randInt(10)).join("");

async function sha256(text){
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  }
  // 비보안 컨텍스트(file:// 등) 대비용 간단 해시 — 실제 서비스에서는 쓰지 마세요
  let h = 5381; for (const ch of text) h = (h * 33 ^ ch.charCodeAt(0)) >>> 0;
  return "djb2:" + h.toString(16);
}

const DAY = ["일","월","화","수","목","금","토"];
const fmtTime = t => new Date(t).toLocaleTimeString("ko-KR", {hour:"numeric", minute:"2-digit"});
const fmtDate = t => {
  const d = new Date(t), today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - new Date(d).setHours(0,0,0,0)) / 864e5);
  if (diff === 0) return "오늘";
  if (diff === 1) return "어제";
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAY[d.getDay()]})`;
};
const fmtDT = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const ago = t => {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return `${Math.floor(s/60)}분 전`;
  if (s < 86400) return `${Math.floor(s/3600)}시간 전`;
  return fmtDate(t);
};
const toLocalInput = t => { const d = new Date(t - new Date(t).getTimezoneOffset()*6e4); return d.toISOString().slice(0,16); };

const ICON = {
  lock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-1"/></svg>',
  wifiOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.1-1.5M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 11 5"/><path d="M12 20h.01"/></svg>',
  alert:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',

/* ══════════════════════════════════════════════════════════
   2. 상태 저장 (localStorage)
   ══════════════════════════════════════════════════════════ */
const STORE_KEY = "dooron.v1";
const METHOD = {app:"앱 원격", finger:"지문", pin:"비밀번호", card:"카드키", tempkey:"임시 비밀번호", auto:"자동", inside:"실내 버튼", face:"얼굴인식"};

function seed(){
  const now = Date.now(), id = uid();
  const s = {
    devices:[{id, name:"현관문", model:"DL-500 Wi-Fi", locked:true, doorOpen:false, battery:78, online:true,
      autoLock:true, autoLockSec:5, doubleLock:false, intrusionAlarm:true, volume:"중간"}],
    currentId:id,
    members:[{id:uid(), name:"나", role:"관리자"}, {id:uid(), name:"엄마", role:"구성원"}, {id:uid(), name:"동생", role:"구성원"}],
    keys:[], logs:[], notices:[],
    security:{pinHash:null, confirmRemote:true},
    notify:{unlock:true, alert:true, battery:true, doorOpen:true},
  };
  const add = (min, type, method, who) => s.logs.push({id:uid(), deviceId:id, t:now - min*6e4, type, method, who});
  add(25, "unlock", "finger", "엄마"); add(25, "lock", "auto", "");
  add(190, "unlock", "pin", "동생"); add(190, "lock", "auto", "");
  add(60*20, "unlock", "app", "나"); add(60*20, "lock", "auto", "");
  add(60*26, "alert", "pin", "비밀번호 5회 오류");
  s.logs.sort((a, b) => b.t - a.t);
  return s;
}

let S;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); } catch { S = seed(); }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} };
const dev = () => S.devices.find(d => d.id === S.currentId) || S.devices[0];

/* ══════════════════════════════════════════════════════════
   3. 도어락 드라이버
   — 실제 기기와 연결할 때는 이 부분만 바꾸면 됩니다.
     MockLockDriver: 지연·실패를 흉내 내는 가상 도어락
     HttpLockDriver: 제조사/자체 서버 API 예시 (기본 비활성)
   ══════════════════════════════════════════════════════════ */
class MockLockDriver {
  async send(device, cmd){
    await sleep(600 + randInt(600));
    if (!device.online) throw new Error("도어락과 연결이 끊겨 있어요");
    if (cmd === "unlock" && device.doubleLock) throw new Error("실내에서 이중 잠금이 걸려 있어 원격으로 열 수 없어요");
    return {ok:true};
  }
}
class HttpLockDriver {
  constructor(baseUrl, token){ this.baseUrl = baseUrl; this.token = token; }
  async send(device, cmd){
    const res = await fetch(`${this.baseUrl}/devices/${encodeURIComponent(device.id)}/${cmd}`, {
      method:"POST", headers:{"Authorization":`Bearer ${this.token}`, "Content-Type":"application/json"},
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || `요청 실패 (${res.status})`);
    return res.json();
  }
}
window.DoorOn = {HttpLockDriver};   // 콘솔에서 확인용

/* ---------- BLE: 도어온 프로토콜 (firmware/doorlock_esp32 와 짝) ----------
   앱 → 도어락 (CMD 쓰기)
     [0x01]                     일회용 난수(nonce) 요청
     [0x02]                     상태 요청
     [op, arg, mac(16)]         인증 명령. mac = HMAC-SHA256(키, nonce‖op‖arg) 앞 16바이트
                                op: 0x00 키 확인, 0x10 열기, 0x11 잠그기, 0x20 자동잠금 초(arg, 0=끔)
   도어락 → 앱 (EVT 알림)
     [0x81, nonce(8)]           난수 (10초 유효, 한 번 쓰면 폐기 → 재전송 공격 방지)
     [0x90, op, code]           결과 code: 0 성공 1 키 불일치 2 이중잠금 3 난수 만료 4 문 열림 5 잘못된 명령 6 잠시 차단
     [0xA0, locked, doorOpen, battery, autoLockSec]   상태
     [0xB0, kind, detail]       현장 이벤트 kind: 1 열림 2 잠김 3 경고 / detail: 열림·잠김=방법, 경고=사유  */
const BLE = {
  SVC:"d00a0001-7c3e-4b9a-9f1e-3a5c2b8e6f10",
  CMD:"d00a0002-7c3e-4b9a-9f1e-3a5c2b8e6f10",
  EVT:"d00a0003-7c3e-4b9a-9f1e-3a5c2b8e6f10",
};
const BLE_OP = {check:0x00, unlock:0x10, lock:0x11, autolock:0x20};
const BLE_ERR = {1:"보안 키가 맞지 않아요", 2:"실내에서 이중 잠금이 걸려 있어요", 3:"요청 시간이 지났어요. 다시 시도하세요",
  4:"문이 열려 있어 잠글 수 없어요", 5:"도어락이 명령을 이해하지 못했어요", 6:"인증 실패가 반복돼 잠시 차단됐어요. 30초 후 다시 시도하세요"};
const BLE_METHOD = {1:"pin", 2:"inside", 3:"auto", 4:"app", 5:"card"};

const hexToBytes = h => Uint8Array.from(h.match(/../g), b => parseInt(b, 16));
const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
async function hmac16(keyHex, bytes){
  const key = await crypto.subtle.importKey("raw", hexToBytes(keyHex), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, Uint8Array.from(bytes))).slice(0, 16);
}

/* 전송 계층: APK(Capacitor 네이티브 플러그인) / 브라우저(Web Bluetooth) */
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const NativeBle = {
  _p:null, _ready:null,
  get p(){ return this._p || (this._p = window.Capacitor.registerPlugin("BluetoothLe")); },
  supported:true,
  init(){ return this._ready || (this._ready = this.p.initialize({}).catch(e => { this._ready = null; throw e; })); },
  async pick(){ await this.init(); const d = await this.p.requestDevice({services:[BLE.SVC]}); return {id:d.deviceId, name:d.name || "도어락"}; },
  async connect(id, onDisc){
    await this.init();
    this.subs = this.subs || {};
    if (this.subs["d" + id]) await this.subs["d" + id].remove();
    this.subs["d" + id] = await this.p.addListener(`disconnected|${id}`, onDisc);
    await this.p.connect({deviceId:id, timeout:10000});
  },
  async notify(id, cb){
    if (this.subs["n" + id]) await this.subs["n" + id].remove();
    this.subs["n" + id] = await this.p.addListener(`notification|${id}|${BLE.SVC}|${BLE.EVT}`, e => cb(hexToBytes((e && e.value || "").replace(/[^0-9a-f]/gi, ""))));
    await this.p.startNotifications({deviceId:id, service:BLE.SVC, characteristic:BLE.EVT});
  },
  write(id, bytes){ return this.p.write({deviceId:id, service:BLE.SVC, characteristic:BLE.CMD, value:bytesToHex(bytes)}); },
  disconnect(id){ return this.p.disconnect({deviceId:id}).catch(() => {}); },
};
const WebBle = {
  devs:new Map(), chars:new Map(),
  get supported(){ return !!navigator.bluetooth; },
  async pick(){
    const d = await navigator.bluetooth.requestDevice({filters:[{services:[BLE.SVC]}]});
    this.devs.set(d.id, d); return {id:d.id, name:d.name || "도어락"};
  },
  async connect(id, onDisc){
    let d = this.devs.get(id);
    if (!d && navigator.bluetooth.getDevices) d = (await navigator.bluetooth.getDevices()).find(x => x.id === id);
    if (!d) {   // 브라우저가 기기를 기억하지 못하면 다시 골라야 함
      const picked = await navigator.bluetooth.requestDevice({filters:[{services:[BLE.SVC]}]});
      d = picked; this.devs.set(id, d);
    }
    d.ongattserverdisconnected = onDisc;
    const server = await d.gatt.connect(), svc = await server.getPrimaryService(BLE.SVC);
    this.chars.set(id, {d, cmd:await svc.getCharacteristic(BLE.CMD), evt:await svc.getCharacteristic(BLE.EVT)});
  },
  async notify(id, cb){
    const c = this.chars.get(id);
    c.evt.oncharacteristicvaluechanged = e => { const v = e.target.value; cb(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength))); };
    await c.evt.startNotifications();
  },
  write(id, bytes){ const c = this.chars.get(id); return (c.cmd.writeValueWithResponse || c.cmd.writeValue).call(c.cmd, Uint8Array.from(bytes)); },
  async disconnect(id){ const c = this.chars.get(id); if (c && c.d.gatt.connected) c.d.gatt.disconnect(); },
};
const bleT = isNative ? NativeBle : WebBle;

class BleLockDriver {
  constructor(onEvent){ this.onEvent = onEvent; this.live = new Set(); this.waiters = []; }
  get supported(){ return bleT.supported; }
  pick(){ return bleT.pick(); }
  async connect(device){
    if (this.live.has(device.id)) return;
    await bleT.connect(device.bleId, () => { this.live.delete(device.id); this.onEvent(device, {type:"disconnected"}); });
    await bleT.notify(device.bleId, bytes => this._rx(device, bytes));
    this.live.add(device.id);
    await bleT.write(device.bleId, [0x02]);   // 현재 상태 받아오기
  }
  async disconnect(device){ this.live.delete(device.id); await bleT.disconnect(device.bleId); }
  _expect(device, hdr, ms = 5000){
    return new Promise((resolve, reject) => {
      const w = {dev:device.id, hdr, resolve, timer:setTimeout(() => { this.waiters = this.waiters.filter(x => x !== w); reject(new Error("도어락이 응답하지 않아요")); }, ms)};
      this.waiters.push(w);
    });
  }
  _rx(device, b){
    if (!b.length) return;
    const w = this.waiters.find(x => x.dev === device.id && x.hdr === b[0]);
    if (w) { clearTimeout(w.timer); this.waiters = this.waiters.filter(x => x !== w); w.resolve(b); }
    if (b[0] === 0xA0 && b.length >= 5) this.onEvent(device, {type:"state", locked:!!b[1], doorOpen:!!b[2], battery:b[3], autoLockSec:b[4]});
    if (b[0] === 0xB0 && b.length >= 3) this.onEvent(device, {type:"event", kind:b[1], detail:b[2]});
  }
  async send(device, cmd, arg = 0){
    await this.connect(device);
    const nP = this._expect(device, 0x81);
    await bleT.write(device.bleId, [0x01]);
    const nonce = (await nP).slice(1, 9);
    const op = BLE_OP[cmd];
    const mac = await hmac16(device.keyHex, [...nonce, op, arg]);
    const rP = this._expect(device, 0x90);
    await bleT.write(device.bleId, [op, arg, ...mac]);
    const r = await rP;
    if (r[2] !== 0) throw new Error(BLE_ERR[r[2]] || `도어락 오류 (${r[2]})`);
    return {ok:true};
  }
}

const mock = new MockLockDriver();
const ble = new BleLockDriver(onBleEvent);
const driverFor = d => d.kind === "ble" ? ble : mock;

function onBleEvent(d, ev){
  d = S.devices.find(x => x.id === d.id); if (!d) return;
  if (ev.type === "disconnected") { if (d.online) toast(`${d.name} 블루투스 연결이 끊겼어요`, true); d.online = false; }
  else if (ev.type === "state") {
    Object.assign(d, {online:true, locked:ev.locked, doorOpen:ev.doorOpen, battery:ev.battery, autoLock:ev.autoLockSec > 0});
    if (ev.autoLockSec) d.autoLockSec = ev.autoLockSec;
  } else if (ev.type === "event") {
    if (ev.kind === 1) { d.locked = false; log(d, "unlock", BLE_METHOD[ev.detail] || "inside"); notice(d, "unlock", `${METHOD[BLE_METHOD[ev.detail]] || "도어락"}(으)로 문이 열렸어요`); }
    else if (ev.kind === 2) { d.locked = true; log(d, "lock", BLE_METHOD[ev.detail] || "auto"); }
    else if (ev.kind === 3) {
      const why = ev.detail === 1 ? "문 열림 지속" : "인증 실패 반복";
      log(d, "alert", "door", why);
      if (ev.detail === 1) notice(d, "door", "문이 오래 열려 있어요", true);
      else if (d.intrusionAlarm) notice(d, "alert", "잘못된 키로 여러 번 열려고 했어요. 침입 시도일 수 있어요", true);
    }
  }
  save(); render();
}

async function bleConnect(){
  const d = dev();
  if (busy) return;
  busy = true; render();
  try { await ble.connect(d); toast(`${d.name}에 연결했어요`); }
  catch (e) { toast(e.name === "NotFoundError" ? "기기 선택을 취소했어요" : `연결 실패: ${e.message || e}`, true); }
  finally { busy = false; render(); }
}

/* ══════════════════════════════════════════════════════════
   4. 핵심 동작: 열기 / 잠그기 / 자동잠금 / 기록 / 알림
   ══════════════════════════════════════════════════════════ */
const timers = {};   // deviceId -> {auto, door, doorAlert}
const T = id => timers[id] || (timers[id] = {});
let busy = false;

function log(d, type, method, who = ""){
  S.logs.unshift({id:uid(), deviceId:d.id, t:Date.now(), type, method, who});
  if (S.logs.length > 500) S.logs.length = 500;
}
function notice(d, kind, text, bad = false){
  const key = kind === "unlock" ? "unlock" : kind === "battery" ? "battery" : kind === "door" ? "doorOpen" : "alert";
  if (!S.notify[key]) return;
  S.notices.unshift({id:uid(), deviceId:d.id, t:Date.now(), kind, text, read:false});
  if (S.notices.length > 100) S.notices.length = 100;
  toast(`${d.name} · ${text}`, bad);
}

function setLocked(d, locked, method, who){
  d.locked = locked;
  log(d, locked ? "lock" : "unlock", method, who);
  if (!locked) {
    if (method !== "app") notice(d, "unlock", `${who ? who + "님이 " : ""}${METHOD[method]}(으)로 문을 열었어요`);
    scheduleAutoLock(d);
  } else clearTimeout(T(d.id).auto);
  save(); render();
}

function scheduleAutoLock(d){
  clearTimeout(T(d.id).auto);
  if (!d.autoLock || d.kind === "ble") return;   // BLE 도어락은 기기가 직접 자동잠금
  T(d.id).auto = setTimeout(() => {
    if (d.locked) return;
    if (d.doorOpen) return scheduleAutoLock(d);   // 문이 닫힐 때까지 대기
    setLocked(d, true, "auto", "");
  }, d.autoLockSec * 1000);
}

async function remote(cmd){
  const d = dev();
  if (busy) return;
  if (cmd === "unlock" && S.security.confirmRemote && S.security.pinHash) {
    const ok = await askPin({title:"원격으로 문 열기", sub:"앱 비밀번호를 입력하세요", verify:true});
    if (!ok) return;
  }
  busy = true; render();
  try {
    await driverFor(d).send(d, cmd);
    setLocked(d, cmd === "lock", "app", "나");
    toast(cmd === "lock" ? "문을 잠갔어요" : "문을 열었어요");
  } catch (e) {
    toast(e.message, true);
  } finally { busy = false; render(); }
}

/* 시뮬레이터: 누군가 도어락 앞에서 출입 */
function simulateEntry(method, who){
  const d = dev();
  if (!d.locked) d.locked = true;
  setLocked(d, false, method, who);
  d.doorOpen = true; save(); render();
  clearTimeout(T(d.id).door);
  T(d.id).door = setTimeout(() => { d.doorOpen = false; save(); render(); }, 2500);
}
function setDoorOpen(d, open){
  d.doorOpen = open;
  clearTimeout(T(d.id).doorAlert);
  if (open) T(d.id).doorAlert = setTimeout(() => {
    if (d.doorOpen) { log(d, "alert", "door", "문 열림 지속"); notice(d, "door", "문이 오래 열려 있어요", true); save(); render(); }
  }, 10000);   // 데모용 10초 (실제 제품은 보통 1~3분)
  save(); render();
}

/* 키패드 입력 → 임시 비밀번호 검증 */
function keyStatus(k, now = Date.now()){
  if (k.type === "once") {
    if (k.used) return "used";
    if (now > k.end) return "expired";
    return "active";
  }
  if (now < k.start) return "pending";
  if (now > k.end) return "expired";
  if (k.type === "recurring") {
    const d = new Date(now), mins = d.getHours()*60 + d.getMinutes();
    if (!k.days.includes(d.getDay()) || mins < k.fromMin || mins >= k.toMin) return "outside";
  }
  return "active";
}
function tryKeypad(code){
  const d = dev();
  const k = S.keys.find(k => k.deviceId === d.id && k.code === code);
  if (k && keyStatus(k) === "active") {
    if (k.type === "once") k.used = true;
    simulateEntry("tempkey", k.name);
    return true;
  }
  d.wrong = (d.wrong || 0) + 1;
  if (d.wrong >= 5) {
    d.wrong = 0;
    log(d, "alert", "pin", "비밀번호 5회 오류");
    if (d.intrusionAlarm) notice(d, "alert", "비밀번호가 5회 틀렸어요. 침입 시도일 수 있어요", true);
  }
  save(); render();
  return false;
}

/* ══════════════════════════════════════════════════════════
   5. 화면
   ══════════════════════════════════════════════════════════ */
let tab = "home", logFilter = "all", reveal = new Set();
const main = $("#main");

function render(){
  const d = dev();
  $("#deviceName").textContent = d.name;
  const unread = S.notices.filter(n => !n.read).length;
  $("#bellBadge").hidden = !unread; $("#bellBadge").textContent = unread > 9 ? "9+" : unread;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const scroll = window.scrollY;
  main.innerHTML = `<div class="view">${VIEWS[tab](d)}</div>`;
  window.scrollTo(0, scroll);
}

function logRow(l, showDevice){
  const d = S.devices.find(x => x.id === l.deviceId);
  const map = {

const minToStr = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const strToMin = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };

function toast(text, bad = false){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : ""); el.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 2800);
}

function sheet(html, onMount){
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => scrim.remove();
  scrim.addEventListener("click", e => { if (e.target === scrim || e.target.closest("[data-close]")) close(); });
  document.body.append(scrim);
  onMount && onMount(scrim.firstElementChild, close);
  return close;
}

/* PIN 입력 화면. verify:true면 저장된 앱 비밀번호와 비교, 아니면 입력값을 반환 */
function askPin({title, sub = "", verify = false, cancelable = true, len = 6}){
  return new Promise(resolve => {
    const el = document.createElement("div");
    el.className = "pin-screen";
    el.innerHTML = `<h4>${esc(title)}</h4><p>${esc(sub)}</p>
      <div class="pin-dots">${"<i></i>".repeat(len)}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join("")}
        <button class="ghost" data-x="cancel" ${cancelable ? "" : "style='visibility:hidden'"}>취소</button>
        <button data-n="0">0</button><button class="ghost" data-x="back">지우기</button></div>`;
    document.body.append(el);
    let v = "", tries = 0;
    const dots = el.querySelector(".pin-dots"), msg = el.querySelector("p");
    const paint = () => dots.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", i < v.length));
    const done = r => { el.remove(); document.removeEventListener("keydown", onKey); resolve(r); };
    const input = async n => {
      if (v.length >= len) return;
      v += n; paint();
      if (v.length < len) return;
      if (!verify) return done(v);
      if (await sha256(v) === S.security.pinHash) return done(true);
      tries++; v = "";
      msg.textContent = `비밀번호가 맞지 않아요 (${tries}회)`; msg.className = "err";
      dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
      paint();
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.n) input(b.dataset.n);
      else if (b.dataset.x === "back") { v = v.slice(0, -1); paint(); }
      else if (b.dataset.x === "cancel" && cancelable) done(verify ? false : null);
    });
    const onKey = e => {
      if (/^\d$/.test(e.key)) input(e.key);
      else if (e.key === "Backspace") { v = v.slice(0, -1); paint(); }
      else if (e.key === "Escape" && cancelable) done(verify ? false : null);
    };
    document.addEventListener("keydown", onKey);
  });
}

      <label class="field"><span>유효 기간</span><select id="kWeeks"><option value="4">4주</option><option value="12" selected>12주</option><option value="52">1년</option></select></label>
    </div>
    <div class="field"><span>비밀번호</span><div class="code num" id="kCode">${st.code}</div>
      <button class="btn block" style="margin-top:8px" id="kRegen">다른 번호로 바꾸기</button></div>
    <div class="btn-row"><button class="btn" data-close>취소</button><button class="btn primary" id="kSave">만들고 공유</button></div>`,
  (el, close) => {
    const show = () => { el.querySelector("#kOnce").hidden = st.type !== "once"; el.querySelector("#kPeriod").hidden = st.type !== "period"; el.querySelector("#kRec").hidden = st.type !== "recurring"; };
    el.querySelector("#kType").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      st.type = b.dataset.v; el.querySelectorAll("#kType button").forEach(x => x.classList.toggle("on", x === b)); show();
    });
    el.querySelector("#kDays").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const i = +b.dataset.d; st.days = st.days.includes(i) ? st.days.filter(x => x !== i) : [...st.days, i].sort();
      b.classList.toggle("on");
    });
    el.querySelector("#kRegen").onclick = () => { st.code = randomCode(6); el.querySelector("#kCode").textContent = st.code; };
    el.querySelector("#kSave").onclick = () => {
      const name = el.querySelector("#kName").value.trim() || "손님";
      const k = {id:uid(), deviceId:d.id, name, code:st.code, type:st.type, createdAt:Date.now(), used:false};

      if (st.type === "once") { k.start = n; k.end = n + (+el.querySelector("#kHours").value) * 36e5; }

        k.start = new Date(el.querySelector("#kStart").value).getTime(); k.end = new Date(el.querySelector("#kEnd").value).getTime();

        k.start = n; k.end = n + (+el.querySelector("#kWeeks").value) * 7 * 864e5;
      }
      if (S.keys.some(x => x.deviceId === d.id && x.code === k.code && keyStatus(x) !== "expired" && keyStatus(x) !== "used"))
        return toast("이미 쓰는 번호예요. 다른 번호로 바꿔 주세요", true);
      S.keys.unshift(k); save(); close();
      tab = "keys"; render();
      shareKey(k);
    };
  });
}

async function shareKey(k){
  const d = S.devices.find(x => x.id === k.deviceId);
  const when = k.type === "once" ? `${fmtDT(k.end)}까지 1회` :
    k.type === "period" ? `${fmtDT(k.start)} ~ ${fmtDT(k.end)}` :
    `매주 ${k.days.map(i => DAY[i]).join("·")} ${minToStr(k.fromMin)}~${minToStr(k.toMin)} (${fmtDT(k.end)}까지)`;
  const text = `[${d ? d.name : "도어락"}] ${k.name}님 임시 비밀번호\n번호: ${k.code}\n사용 가능: ${when}\n도어락 키패드에 번호 입력 후 * 또는 # 을 눌러주세요.`;
  try {
    if (navigator.share) { await navigator.share({text}); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("공유 문구를 복사했어요"); }
  catch { sheet(`<h4>공유 문구</h4><p class="sub">아래 내용을 복사해 보내세요</p><pre style="white-space:pre-wrap; background:var(--surface-2); padding:12px; border-radius:12px">${esc(text)}</pre><button class="btn block" data-close>닫기</button>`); }
}

      if (!/^[0-9a-f]{32}$/.test(keyHex)) return toast("보안 키는 0-9, a-f로 된 32자리여야 해요", true);
      const name = el.querySelector("#bName").value.trim() || "도어락";

      } catch (e) {
        if (d) ble.disconnect(d).catch(() => {});

/* 길게 눌러 열기 (실수로 열리는 것 방지) */
const HOLD_MS = 900;
let hold = null;
main.addEventListener("pointerdown", e => {
  const btn = e.target.closest("#lockBtn"); if (!btn || btn.disabled) return;
  const d = dev();
  if (!d.locked || !d.online) return;   // 열린 상태: 클릭으로 바로 잠금 / 오프라인: 클릭으로 연결
  btn.setPointerCapture(e.pointerId);
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / HOLD_MS);
    btn.style.setProperty("--p", p);
    if (p >= 1) { hold = null; btn.style.setProperty("--p", 0); navigator.vibrate && navigator.vibrate(30); remote("unlock"); return; }
    hold = requestAnimationFrame(step);
  };
  hold = requestAnimationFrame(step);
});
const cancelHold = () => {
  if (hold == null) return;
  cancelAnimationFrame(hold); hold = null;
  const btn = $("#lockBtn"); if (btn) btn.style.setProperty("--p", 0);
};
main.addEventListener("pointerup", cancelHold);
main.addEventListener("pointercancel", cancelHold);
main.addEventListener("contextmenu", e => { if (e.target.closest("#lockBtn")) e.preventDefault(); });

main.addEventListener("click", e => {
  const t = e.target;
  const lockBtn = t.closest("#lockBtn");
  if (lockBtn) { if (!dev().online) { if (dev().kind === "ble") bleConnect(); } else if (!dev().locked) remote("lock"); else if (e.detail === 0) remote("unlock"); return; }  // detail 0 = 키보드(Enter/Space)
  const f = t.closest("[data-filter]"); if (f) { logFilter = f.dataset.filter; render(); return; }
  const k = t.closest("[data-key]"); if (k) return keyDetail(k.dataset.key);
  const m = t.closest("[data-member]"); if (m) return memberSheet(m.dataset.member);
  const sim = t.closest("[data-sim]");
  if (sim) {
    const d = dev();
    if (sim.dataset.sim === "finger") {
      const fam = S.members.filter(x => x.name !== "나"); const who = fam.length ? fam[randInt(fam.length)].name : "가족";
      simulateEntry("finger", who);
    } else if (sim.dataset.sim === "door") setDoorOpen(d, !d.doorOpen);
    else if (sim.dataset.sim === "battery") {
      d.battery = d.battery <= 20 ? 100 : Math.max(5, d.battery - 15);
      if (d.battery <= 20) notice(d, "battery", `배터리가 ${d.battery}% 남았어요. 건전지를 교체하세요`, true);
      save(); render();
    } else if (sim.dataset.sim === "online") { d.online = !d.online; save(); render(); toast(d.online ? "도어락이 다시 연결됐어요" : "도어락 연결이 끊겼어요", !d.online); }
    return;
  }
  const a = t.closest("[data-act]"); if (!a) return;
  ({
    "new-key": newKeySheet,
    "keypad": keypadSheet,
    "go-log": () => { tab = "log"; window.scrollTo(0, 0); render(); },
    "new-member": () => textSheet("구성원 초대", "이름", "", v => { S.members.push({id:uid(), name:v, role:"구성원"}); save(); render(); toast(`${v}님에게 초대장을 보냈어요`); }),
    "rename": () => textSheet("도어락 이름", "이름", dev().name, v => { dev().name = v; save(); render(); }),
    "pin": setPin,
    "pin-off": async () => { if (await askPin({title:"앱 비밀번호 해제", sub:"현재 비밀번호를 입력하세요", verify:true})) { S.security.pinHash = null; save(); render(); toast("앱 비밀번호를 해제했어요"); } },
    "add-device": addDevice,
    "ble-reconnect": () => { const d = dev(); if (d.online) ble.disconnect(d).then(() => { d.online = false; save(); render(); }); else bleConnect(); },
    "ble-key": () => textSheet("보안 키 변경", "32자리 키", "", v => {
      v = v.replace(/[\s:-]/g, "").toLowerCase();
      if (!/^[0-9a-f]{32}$/.test(v)) return toast("보안 키는 0-9, a-f로 된 32자리여야 해요", true);
      dev().keyHex = v; save(); render(); toast("보안 키를 바꿨어요");
    }),
    "del-device": () => confirmSheet(`${dev().name} 삭제`, "기록과 임시 비밀번호도 함께 지워져요.", "삭제", () => {
      if (dev().kind === "ble") ble.disconnect(dev()).catch(() => {});
      const id = dev().id; clearTimeout(T(id).auto); clearTimeout(T(id).door); clearTimeout(T(id).doorAlert);
      S.devices = S.devices.filter(x => x.id !== id); S.logs = S.logs.filter(x => x.deviceId !== id);
      S.keys = S.keys.filter(x => x.deviceId !== id); S.notices = S.notices.filter(x => x.deviceId !== id);
      S.currentId = S.devices[0].id; save(); tab = "home"; render();
    }),
    "reset": () => confirmSheet("모든 데이터 초기화", "도어락·기록·출입키·앱 비밀번호가 처음 상태로 돌아가요.", "초기화", () => {
      Object.values(timers).forEach(t => Object.values(t).forEach(clearTimeout));
      S = seed(); save(); tab = "home"; render();
    }),
  })[a.dataset.act]?.();
});

main.addEventListener("change", e => {
  const el = e.target.closest("[data-set]"); if (!el) return;
  const d = dev(), k = el.dataset.set, v = el.type === "checkbox" ? el.checked : el.value;
  if (d.kind === "ble" && (k === "autoLock" || k === "autoLockSec")) {   // 기기에 직접 설정
    const sec = k === "autoLock" ? (v ? d.autoLockSec : 0) : +v;
    ble.send(d, "autolock", sec)
      .then(() => { d.autoLock = sec > 0; if (sec) d.autoLockSec = sec; toast("도어락 설정을 바꿨어요"); })
      .catch(err => toast(err.message, true))
      .finally(() => { save(); render(); });
    return;
  }
  if (k.startsWith("n.")) S.notify[k.slice(2)] = v;
  else if (k === "confirmRemote") S.security.confirmRemote = v;
  else if (k === "autoLockSec") d.autoLockSec = +v;
  else d[k] = v;
  if (k === "autoLock" && v && !d.locked) scheduleAutoLock(d);
  if (k === "autoLock" && !v) clearTimeout(T(d.id).auto);
  save(); render();
});

async function setPin(){
  if (S.security.pinHash && !(await askPin({title:"앱 비밀번호 변경", sub:"현재 비밀번호를 입력하세요", verify:true}))) return;
  const a = await askPin({title:"새 앱 비밀번호", sub:"숫자 6자리를 입력하세요"}); if (!a) return;
  const b = await askPin({title:"한 번 더 입력", sub:"확인을 위해 다시 입력하세요"}); if (!b) return;
  if (a !== b) return toast("두 번 입력한 비밀번호가 달라요", true);
  S.security.pinHash = await sha256(a); save(); render(); toast("앱 비밀번호를 설정했어요");
}

// 새로고침 전에 열려 있던 도어락은 자동잠금 타이머를 다시 건다
S.devices.forEach(d => { if (d.kind === "ble") d.online = false; else if (!d.locked) scheduleAutoLock(d); });
setInterval(() => { if (tab === "keys") render(); }, 30000);   // 임시키 상태(예정→사용 가능→만료) 갱신
render();
if (S.security.pinHash) askPin({title:"도어온", sub:"앱 비밀번호를 입력하세요", verify:true, cancelable:false});

})();
</script>
